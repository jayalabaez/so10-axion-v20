name: hilbert-mixed-8comp-hessian

on:
  workflow_dispatch:

concurrency:
  group: hilbert-mixed-8comp-hessian-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hilbert-mixed-8comp-hessian:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute Hilbert/mixed 8-comp Hessian
        run: python hilbert_mixed_8comp_hessian_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_hilbert_mixed_8comp_hessian_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('HILBERT_MIXED_8COMP_HESSIAN_V20_VERDICT.json'))
          assert r['status']=='HILBERT_MIXED_8COMP_HESSIAN_PD__OFF_SINGLET_OPEN'
          assert r['n_failed']==0
          assert r['operator_hessian']['positive_definite']
          assert not r['schematic_contrast']['positive_definite']
          assert r['flag']['schematic_well_hessian_replaced_by_hilbert_mixed']
          assert r['flag']['schematic_lifted_well_instability_fixed']
          assert not r['flag']['full_sm_irrep_mass_matrices']
          assert not r['flag']['live_sarah_or_pyrate_executable_run']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload Hilbert/mixed 8-comp Hessian verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hilbert-mixed-8comp-hessian-verdict
          path: |
            HILBERT_MIXED_8COMP_HESSIAN_V20_VERDICT.json
            HILBERT_MIXED_8COMP_HESSIAN_V20.md
