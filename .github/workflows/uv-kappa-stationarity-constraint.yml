name: uv-kappa-stationarity-constraint

on:
  pull_request:
    paths:
      - uv_kappa_stationarity_constraint_v20.py
      - test_uv_kappa_stationarity_constraint_v20.py
      - charge_allowed_potential_minimize_v20.py
      - unique_soft_scale_stationarity_v20.py
      - .github/workflows/uv-kappa-stationarity-constraint.yml
  workflow_dispatch:

concurrency:
  group: uv-kappa-stationarity-constraint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  uv-kappa-stationarity-constraint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute UV kappa constraint
        run: python uv_kappa_stationarity_constraint_v20.py --write
      - name: Focused regression tests
        run: python -m unittest -v test_uv_kappa_stationarity_constraint_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('UV_KAPPA_STATIONARITY_CONSTRAINT_V20.json'))
          assert r['status']=='UV_KAPPA_STATIONARITY_CONSTRAINED__NOT_UNIQUE'
          assert r['n_failed']==0
          assert r['overall_state']=='BLOCKED'
          assert r['vevs_GeV']['hEW']==174.0
          assert r['A_kappa']['physical_GeV2']>0
          assert not r['flags']['uv_kappa_uniquely_determined']
          assert not r['flags']['whole_model_validated']
          PY
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uv-kappa-stationarity-constraint
          path: |
            UV_KAPPA_STATIONARITY_CONSTRAINT_V20.json
            UV_KAPPA_STATIONARITY_CONSTRAINT_V20.md
