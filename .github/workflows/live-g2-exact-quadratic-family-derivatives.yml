name: live-g2-exact-quadratic-family-derivatives

on:
  workflow_dispatch:
  pull_request:
    paths:
      - live_g2_exact_quadratic_family_derivatives_v20.py
      - test_live_g2_exact_quadratic_family_derivatives_v20.py
      - live_g2_canonical_486_field_chart_v20.py
      - live_g2_arbitrary_component_potential_values_v20.py
      - live_g1_tensor_closure_ledger_v20.py
      - live_g1_g8_gate_ledger_v20.py
      - .github/workflows/live-g2-exact-quadratic-family-derivatives.yml
  push:
    branches: [main]
    paths:
      - live_g2_exact_quadratic_family_derivatives_v20.py
      - test_live_g2_exact_quadratic_family_derivatives_v20.py
      - live_g2_canonical_486_field_chart_v20.py
      - live_g2_arbitrary_component_potential_values_v20.py
      - live_g1_tensor_closure_ledger_v20.py
      - live_g1_g8_gate_ledger_v20.py
      - .github/workflows/live-g2-exact-quadratic-family-derivatives.yml

concurrency:
  group: live-g2-five-family-derivatives-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-quadratic-family-derivatives:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile exact derivative layer
        run: |
          python -m py_compile \
            live_g2_exact_quadratic_family_derivatives_v20.py \
            test_live_g2_exact_quadratic_family_derivatives_v20.py
      - name: Run exact derivative tests
        run: |
          python -m pytest -q \
            test_live_g2_exact_quadratic_family_derivatives_v20.py \
            test_live_g1_g8_gate_ledger_v20.py
      - name: Generate derivative and ledger certificates
        run: |
          python live_g2_exact_quadratic_family_derivatives_v20.py --write
          python live_g1_g8_gate_ledger_v20.py
      - name: Assert nonzero exact coverage and fail-closed scope
        run: |
          python - <<'PY'
          import json

          d=json.load(open('LIVE_G2_EXACT_QUADRATIC_FAMILY_DERIVATIVES_V20.json'))
          assert d['n_failed']==0, d['failures']
          assert d['coverage']['base_families_closed']==[
              'singlet_polynomial','126bar_norm','Hdag_Hdag_pair','Hdag_H_norm','Phi_norm'
          ]
          assert d['coverage']['base_family_count_closed']==5
          assert d['coverage']['base_family_count_total']==18
          assert d['coverage']['direction_count_closed']>0
          assert d['coverage']['parameter_count_closed']>0
          assert all(v>0 for v in d['coverage']['expected_direction_counts'].values())
          assert d['coverage']['expected_direction_counts']==d['coverage']['observed_direction_counts']
          assert d['coverage']['real_field_dimension']==486
          assert d['coverage']['Hessian_shape']==[486,486]
          assert d['maximum_direction_value_residual'] < 1e-10
          assert d['maximum_Hessian_symmetry_residual'] < 1e-12
          assert d['maximum_self_conjugate_imaginary_residual'] < 1e-10
          assert d['directional_reconstruction']['value_residual'] < 1e-9
          assert d['directional_reconstruction']['first_residual'] < 1e-8
          assert d['directional_reconstruction']['second_residual'] < 1e-7
          assert d['flags']['five_authoritative_nonzero_family_adapters_closed']
          assert d['flags']['all_selected_direction_gradients_exact']
          assert d['flags']['all_selected_direction_Hessians_exact']
          assert not d['flags']['all_64_direction_gradients_complete']
          assert not d['flags']['all_64_direction_Hessians_complete']
          assert not d['flags']['G2_closed']
          assert not d['flags']['whole_model_validated']

          ledger=json.load(open('LIVE_G1_G8_GATE_LEDGER_V20.json'))
          assert ledger['n_failed']==0, ledger['failures']
          assert ledger['summary']['closed']==['G1']
          assert ledger['gates']['G2']['status']=='PARTIAL'
          assert not ledger['flags']['g2_complete_gradient']
          assert not ledger['flags']['g2_complete_Hessian']
          assert not ledger['flags']['g2_closed']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-g2-exact-quadratic-family-derivatives
          path: |
            LIVE_G2_EXACT_QUADRATIC_FAMILY_DERIVATIVES_V20.json
            LIVE_G2_EXACT_QUADRATIC_FAMILY_DERIVATIVES_V20.md
            LIVE_G1_G8_GATE_LEDGER_V20.json
            LIVE_G1_G8_GATE_LEDGER_V20.md
