name: promote-210n-tensor-basis-uniqueness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  promote-210n-tensor-basis-uniqueness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute pure-210ⁿ uniqueness promotion
        run: python promote_210n_tensor_basis_uniqueness_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_promote_210n_tensor_basis_uniqueness_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('PROMOTE_210N_TENSOR_BASIS_UNIQUENESS_V20_VERDICT.json'))
          assert r['status']=='UNIQUE_FROM_FULL_PURE_210N_TENSOR_BASIS__MIXED_REP_OPEN'
          assert r['n_failed']==0
          assert r['quartic_projection']['spans_full_H4']
          assert r['hilbert_certificate']['residual_kernel_total_deg_le_4']==0
          fr=r['selected_hilbert']['fractions']
          assert abs(fr['a_over_MGUT']+fr['omega_over_MGUT']+fr['p_over_MGUT']-1)<1e-8
          assert r['flag']['unique_from_full_pure_210n_tensor_basis']
          assert r['flag']['unique_from_full_210n_tensor_basis']
          assert not r['flag']['mixed_rep_full_hilbert_series']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload promote-210ⁿ uniqueness verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promote-210n-tensor-basis-uniqueness-verdict
          path: |
            PROMOTE_210N_TENSOR_BASIS_UNIQUENESS_V20_VERDICT.json
            PROMOTE_210N_TENSOR_BASIS_UNIQUENESS_V20.md
