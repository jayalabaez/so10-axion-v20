name: quartic-soft-betas-sarah

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quartic-soft-betas-sarah:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute quartic/soft β ingest
        run: python quartic_soft_betas_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_quartic_soft_betas_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('QUARTIC_SOFT_BETAS_V20_VERDICT.json'))
          assert r['status']=='QUARTIC_SOFT_BETAS_INGESTED__FULL_210N_AND_UNIQUE_TAU_OPEN'
          assert r['n_failed']==0
          assert r['boundary_GUT']['ledger']['n_couplings']==8
          assert r['evolution_GUT_to_MI']['all_quartics_positive']
          assert r['flag']['two_loop_quartic_betas_complete']
          assert r['flag']['pyrate_sarah_quartic_soft_formulas_ingested']
          assert r['flag']['reduced_charge_allowed_sector_only']
          assert r['flag']['residual_casimir_zero_after_so10_breaking']
          assert not r['flag']['live_sarah_or_pyrate_executable_run']
          assert not r['flag']['full_210n_tensor_betas']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          assert r['boundary_GUT']['parent_casimir_warning']['max_abs_beta_total'] > 0
          PY
      - name: Upload quartic/soft β verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartic-soft-betas-sarah-verdict
          path: |
            QUARTIC_SOFT_BETAS_V20_VERDICT.json
            QUARTIC_SOFT_BETAS_V20.md
