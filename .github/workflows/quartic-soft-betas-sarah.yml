name: quartic-soft-betas-sarah

on:
  workflow_dispatch:

concurrency:
  group: quartic-soft-betas-sarah-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quartic-soft-betas-sarah:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute Pati-Salam-resolved quartic/soft RGE
        run: python quartic_soft_betas_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_quartic_soft_betas_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('QUARTIC_SOFT_BETAS_V20_VERDICT.json'))
          assert r['status']=='PS_SUBGROUP_RESOLVED_QUARTIC_SOFT_RGE__FULL_TENSOR_BETAS_OPEN'
          assert r['n_failed']==0
          assert r['boundary_GUT']['ledger']['n_couplings']==8
          assert r['evolution_GUT_to_MI']['all_quartics_positive']
          assert r['flag']['pati_salam_subgroup_resolved']
          assert r['flag']['charged_10_126_casimirs_nonzero']
          assert r['flag']['separate_g4_gL_gR_running']
          assert not r['flag']['two_loop_quartic_betas_complete']
          assert not r['flag']['full_component_tensor_betas']
          assert not r['flag']['live_sarah_or_pyrate_executable_run']
          rows={x['name']:x for x in r['boundary_GUT']['ledger']['rows'] if x['kind']=='self_quartic'}
          assert rows['DeltaR_126bar']['gauge_invariant_Cg2']>0
          assert rows['H10_eff']['gauge_invariant_Cg2']>0
          assert rows['P_210_PS']['gauge_invariant_Cg2']==0
          PY
      - name: Upload quartic/soft RGE verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartic-soft-betas-sarah-verdict
          path: |
            QUARTIC_SOFT_BETAS_V20_VERDICT.json
            QUARTIC_SOFT_BETAS_V20.md
