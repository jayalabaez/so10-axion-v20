name: multi-operator-phase-hessian

on:
  pull_request:
    paths:
      - multi_operator_phase_hessian_v20.py
      - test_multi_operator_phase_hessian_v20.py
      - extended_ttbar_54_locking_v20.py
      - charge_allowed_potential_minimize_v20.py
      - physical_h10_54_mass_block_from_deltar_v20.py
      - selected_vacuum_lambda4_portal_null_audit_v20.py
      - .github/workflows/multi-operator-phase-hessian.yml
  workflow_dispatch:

concurrency:
  group: multi-operator-phase-hessian-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  multi-operator-phase-hessian:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute multi-operator phase Hessian
        run: python multi_operator_phase_hessian_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_multi_operator_phase_hessian_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('MULTI_OPERATOR_PHASE_HESSIAN_V20_VERDICT.json'))
          assert r['status']=='MULTI_OPERATOR_PHASE_HESSIAN_REVALIDATED__GAUGE_QUOTIENT_PHYSICAL_CLOSURE'
          assert r['n_failed']==0
          by={p['name']:p for p in r['points']}
          assert by['locking_only']['amplitudes']['A_lock']==0.0
          assert by['locking_only']['amplitudes']['A_lam4']==0.0
          assert by['locking_only']['multi_operator_hessian']['n_positive']==0
          assert by['locking_only']['multi_operator_hessian']['n_zero']==3
          assert by['finite_kappa_benchmark']['multi_operator_hessian']['n_positive']==1
          assert by['finite_kappa_benchmark']['multi_operator_hessian']['n_zero']==2
          assert by['finite_kappa_benchmark']['physical_after_gauge_quotient']['rank']==1
          assert by['finite_kappa_benchmark']['physical_after_gauge_quotient']['nullity']==1
          assert by['finite_kappa_benchmark']['physical_after_gauge_quotient']['physical_null_vector_integer']==[1,-2]
          assert by['kappa_and_lam4_on']['physical_after_gauge_quotient']['rank']==1
          assert r['charge_vectors']['g_lock']==[2.0,2.0,2.0]
          assert r['flag']['multi_operator_phase_hessian']
          assert r['flag']['selected_vacuum_lock_and_lam4_null']
          assert r['flag']['physical_phase_closed_after_gauge_quotient']
          assert not r['flag']['extra_physical_nonaxion_flat_phase']
          assert not r['flag']['full_component_phase_space']
          assert not r['flag']['whole_model_validated']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload multi-operator Hessian verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-operator-phase-hessian-verdict
          path: |
            MULTI_OPERATOR_PHASE_HESSIAN_V20_VERDICT.json
            MULTI_OPERATOR_PHASE_HESSIAN_V20.md
