name: multi-operator-phase-hessian

on:
  workflow_dispatch:

concurrency:
  group: multi-operator-phase-hessian-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  multi-operator-phase-hessian:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute multi-operator phase Hessian
        run: python multi_operator_phase_hessian_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_multi_operator_phase_hessian_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('MULTI_OPERATOR_PHASE_HESSIAN_V20_VERDICT.json'))
          assert r['status']=='MULTI_OPERATOR_PHASE_HESSIAN_COMPLETE__REDUCED_SECTOR'
          assert r['n_failed']==0
          by={p['name']:p for p in r['points']}
          assert by['locking_only']['multi_operator_hessian']['n_positive']==1
          assert by['locking_only']['multi_operator_hessian']['n_zero']==2
          assert by['finite_kappa_benchmark']['multi_operator_hessian']['n_positive']==2
          assert by['finite_kappa_benchmark']['multi_operator_hessian']['n_zero']==1
          assert by['finite_kappa_benchmark']['multi_operator_hessian']['flat_direction']==[1.0,1.0,-2.0]
          assert r['charge_vectors']['g_lock']==[2.0,2.0,2.0]
          assert r['flag']['multi_operator_phase_hessian']
          assert r['flag']['complete_multi_operator_phase_hessian_reduced_sector']
          assert not r['flag']['full_component_phase_space']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload multi-operator Hessian verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-operator-phase-hessian-verdict
          path: |
            MULTI_OPERATOR_PHASE_HESSIAN_V20_VERDICT.json
            MULTI_OPERATOR_PHASE_HESSIAN_V20.md
