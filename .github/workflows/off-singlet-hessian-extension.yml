name: off-singlet-hessian-extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  off-singlet-hessian-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute off-singlet Hessian extension
        run: python off_singlet_hessian_extension_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_off_singlet_hessian_extension_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('OFF_SINGLET_HESSIAN_EXTENSION_V20_VERDICT.json'))
          assert r['status']=='OFF_SINGLET_HESSIAN_EXTENDED__MIXED_126_10_OPEN'
          assert r['n_failed']==0
          assert r['off_singlet_selected']['n_modes']==10
          assert r['off_singlet_selected']['all_positive']
          assert r['extended_hessian']['extended_positive_definite']
          assert r['flag']['off_singlet_hessian_extension']
          assert not r['flag']['full_sm_irrep_mass_matrices']
          assert not r['flag']['mixed_210_126_10_complete']
          assert not r['flag']['live_sarah_or_pyrate_executable_run']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload off-singlet Hessian extension verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: off-singlet-hessian-extension-verdict
          path: |
            OFF_SINGLET_HESSIAN_EXTENSION_V20_VERDICT.json
            OFF_SINGLET_HESSIAN_EXTENSION_V20.md
