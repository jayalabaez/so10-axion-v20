name: scalar-theory-closure-ledger

on:
  workflow_dispatch:

concurrency:
  group: scalar-theory-closure-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  closure-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute MIXED_10 absorption
        run: python diagonal_mixed_10_portal_absorption_v20.py --write
      - name: Execute filled mass PS/SM spectrum
        run: python filled_mass_ps_sm_irrep_spectrum_v20.py --write
      - name: Execute scalar theory closure ledger
        run: python scalar_theory_closure_ledger_v20.py --write
      - name: Focused regression tests
        run: |
          python -m unittest -v \
            test_diagonal_mixed_10_portal_absorption_v20.py \
            test_filled_mass_ps_sm_irrep_spectrum_v20.py \
            test_scalar_theory_closure_ledger_v20.py
      - name: Assert BLOCKED ledger honesty
        run: |
          python - <<'PY'
          import json
          r=json.load(open('SCALAR_THEORY_CLOSURE_LEDGER_V20.json'))
          assert r['n_failed']==0, r
          assert r['overall_state']=='BLOCKED'
          assert r['gate_summary']['n_closed']==0
          assert r['gate_summary']['n_partial']==3
          assert r['gate_summary']['n_open']==5
          assert not r['flags']['theory_complete']
          assert not r['flags']['whole_model_validated']
          m=json.load(open('DIAGONAL_MIXED_10_PORTAL_ABSORPTION_V20.json'))
          assert m['n_failed']==0
          assert m['flags']['open_mixed_10_absorbed_into_portal']
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scalar-theory-closure-ledger
          path: |
            SCALAR_THEORY_CLOSURE_LEDGER_V20.json
            SCALAR_THEORY_CLOSURE_LEDGER_V20.md
            DIAGONAL_MIXED_10_PORTAL_ABSORPTION_V20.json
            DIAGONAL_MIXED_10_PORTAL_ABSORPTION_V20.md
            FILLED_MASS_PS_SM_IRREP_SPECTRUM_V20.json
            FILLED_MASS_PS_SM_IRREP_SPECTRUM_V20.md
