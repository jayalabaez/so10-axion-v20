name: residual-lam210-eta-intra

on:
  workflow_dispatch:

concurrency:
  group: residual-lam210-eta-intra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  residual-lam210-eta-intra:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute residual λ210 / η_intra derivation
        run: python residual_lam210_eta_intra_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_residual_lam210_eta_intra_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('RESIDUAL_LAM210_ETA_INTRA_V20_VERDICT.json'))
          assert r['status']=='RESIDUAL_LAM210_ETA_INTRA_DERIVED__FULL_210N_OPEN'
          assert r['n_failed']==0
          c=r['uv_residual_couplings']
          assert abs(c['lam210_10']-c['lam1'])<1e-15
          assert abs(c['eta_intra']-c['lam2'])<1e-15
          assert r['flag']['residual_lam210_eta_intra_derived']
          assert r['flag']['unique_full_triplet_spectrum_under_ps_identification']
          assert not r['flag']['unique_from_full_210n_tensor_basis']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload residual λ210 / η_intra verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residual-lam210-eta-intra-verdict
          path: |
            RESIDUAL_LAM210_ETA_INTRA_V20_VERDICT.json
            RESIDUAL_LAM210_ETA_INTRA_V20.md
