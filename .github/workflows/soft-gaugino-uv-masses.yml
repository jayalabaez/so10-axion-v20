name: soft-gaugino-uv-masses

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  soft-gaugino-uv-masses:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute soft-gaugino UV masses
        run: python soft_gaugino_uv_masses_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_soft_gaugino_uv_masses_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('SOFT_GAUGINO_UV_MASSES_V20_VERDICT.json'))
          assert r['status']=='SOFT_GAUGINO_UV_MASSES_PROMOTED__QUARTIC_BETAS_OPEN'
          assert r['n_failed']==0
          assert r['spectra']['xi0_pure_soft']['n_majoranas']==32
          assert r['flag']['exact_soft_gaugino_masses_from_uv']
          assert r['flag']['g6_soft_overlap_resolved']
          assert r['flag']['m_V_proxy_replaced_by_pure_soft_xi0']
          assert not r['flag']['unique_soft_scale']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload soft-gaugino verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soft-gaugino-uv-masses-verdict
          path: |
            SOFT_GAUGINO_UV_MASSES_V20_VERDICT.json
            SOFT_GAUGINO_UV_MASSES_V20.md
