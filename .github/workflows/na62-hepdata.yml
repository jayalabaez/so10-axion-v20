name: na62-hepdata

on:
  workflow_dispatch:

concurrency:
  group: na62-hepdata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official Figure 2-a anchors for drift
        run: python na62_hepdata_probe_v20.py
      - name: Upload NA62 drift verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: na62-hepdata-drift
          path: NA62_HEPDATA_DRIFT_V20_VERDICT.json
