name: na62-hepdata

on:
  pull_request:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe official Figure 2-a table
        run: python na62_hepdata_probe_v20.py
      - name: Upload NA62 probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: na62-hepdata-probe
          path: NA62_HEPDATA_PROBE_V20_VERDICT.json
