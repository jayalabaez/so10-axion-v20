name: g3-source-snapshot

on:
  push:
    branches: [agent/g3-full-stationarity-feasibility]
    paths:
      - '.github/workflows/g3-source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package current source tree
        run: |
          zip -qr g3-current-source.zip . \
            -x '.git/*' \
               '*.json' \
               '*.md' \
               '__pycache__/*'
      - uses: actions/upload-artifact@v4
        with:
          name: g3-current-source
          path: g3-current-source.zip
          if-no-files-found: error
