name: portal-constraint-ray

on:
  pull_request:
    paths:
      - "portal_constraint_ray_v20.py"
      - "test_portal_constraint_ray_v20.py"
      - "portal_boundary_heavy_spectrum_v20.py"
      - "test_portal_boundary_heavy_spectrum_v20.py"
      - "channel_fcnc_rates_v20.py"
      - "na62_pointwise_limit_v20.py"
      - "twist_massless_limit_v20.py"
      - "portal_tensors_abcd_v20.py"
      - "physical_cf_matching_v20.py"
      - ".github/workflows/portal-constraint-ray.yml"
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Solve conditional boundary
        run: python portal_constraint_ray_v20.py
      - name: Resolve full heavy spectrum
        run: python portal_boundary_heavy_spectrum_v20.py
      - name: Boundary regressions
        run: |
          python -m unittest -v test_portal_constraint_ray_v20.py
          python -m unittest -v test_portal_boundary_heavy_spectrum_v20.py
      - name: Upload boundary verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-constraint-ray
          path: |
            PORTAL_CONSTRAINT_RAY_V20_VERDICT.json
            PORTAL_CONSTRAINT_RAY_V20.md
            PORTAL_BOUNDARY_HEAVY_SPECTRUM_V20_VERDICT.json
            PORTAL_BOUNDARY_HEAVY_SPECTRUM_V20.md
