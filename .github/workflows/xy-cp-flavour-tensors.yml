name: xy-cp-flavour-tensors

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  xy-cp-flavour-tensors:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute X/Y CP flavour tensors
        run: python xy_cp_flavour_tensors_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_xy_cp_flavour_tensors_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('XY_CP_FLAVOUR_TENSORS_V20_VERDICT.json'))
          assert r['status']=='XY_CP_FLAVOUR_TENSORS_COMPLETE__UV_CP_OPEN'
          assert r['n_failed']==0
          assert r['flag']['full_cp_xy_tensors']
          assert r['flag']['coherent_V2_interference']
          assert r['flag']['subleading_cp_portals_included']
          assert r['flag']['reduces_to_magnitude_for_real_V']
          assert r['lifetimes']['passes_SK_e_pi0_CP']
          assert abs(r['lifetimes']['delta_rel_tau_e'])>0
          assert not r['flag']['uv_cp_phases_from_potential']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload X/Y CP flavour verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xy-cp-flavour-tensors-verdict
          path: |
            XY_CP_FLAVOUR_TENSORS_V20_VERDICT.json
            XY_CP_FLAVOUR_TENSORS_V20.md
