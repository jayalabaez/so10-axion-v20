name: g2-current-source-snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/g2-current-source-snapshot.yml'

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package current executable source
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('.')
          paths=list(root.glob('*.py'))+list(root.glob('requirements*.txt'))+list(root.glob('.github/workflows/*.yml'))
          with zipfile.ZipFile('/tmp/g2-current-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for path in paths:
                  archive.write(path,path.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: g2-current-source
          path: /tmp/g2-current-source.zip
          if-no-files-found: error
