name: coleman-weinberg-lifted-vacuum

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  coleman-weinberg-lifted-vacuum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute Coleman-Weinberg on lifted vacuum
        run: python coleman_weinberg_lifted_vacuum_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_coleman_weinberg_lifted_vacuum_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('COLEMAN_WEINBERG_LIFTED_VACUUM_V20_VERDICT.json'))
          assert r['status']=='COLEMAN_WEINBERG_LIFTED_VACUUM_EVALUATED__STABILITY_CONDITIONAL'
          assert r['n_failed']==0
          assert r['mass_ledger']['n_goldstones_excluded']==33
          assert r['flag']['coleman_weinberg_evaluated']
          assert r['flag']['phi17_uv_sector_split']
          assert r['flag']['one_loop_stability_conditional_on_counterterms']
          assert not r['flag']['one_loop_stability_unconditional']
          assert r['coleman_weinberg']['V1_gut_ps_GeV4'] != 0
          assert not r['flag']['full_sm_irrep_cw_spectrum']
          assert not r['flag']['unique_vacuum_selected']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload Coleman-Weinberg verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coleman-weinberg-lifted-vacuum-verdict
          path: |
            COLEMAN_WEINBERG_LIFTED_VACUUM_V20_VERDICT.json
            COLEMAN_WEINBERG_LIFTED_VACUUM_V20.md
