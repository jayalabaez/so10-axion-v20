name: live-pyrate-quartic-soft-dump

on:
  workflow_dispatch:

concurrency:
  group: live-pyrate-quartic-soft-dump-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-pyrate-quartic-soft-dump:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repo dependencies
        run: python -m pip install -r requirements.txt
      - name: Install PyR@TE 3 (live tool)
        run: |
          mkdir -p "$HOME/lab"
          git clone --depth 1 https://github.com/LSartore/pyrate.git "$HOME/lab/pyrate"
          python -m venv "$HOME/lab/pyrate-venv"
          "$HOME/lab/pyrate-venv/bin/pip" install -U pip
          "$HOME/lab/pyrate-venv/bin/pip" install "PyYAML>=5.3" "sympy>=1.5" "h5py>=2.10" "numpy>=1.18" "scipy>=1.4" "matplotlib>=3.1"
          mkdir -p "$HOME/lab/bin"
          printf '%s\n' '#!/usr/bin/env bash' 'exec "$HOME/lab/pyrate-venv/bin/python" "$HOME/lab/pyrate/pyR@TE.py" "$@"' > "$HOME/lab/bin/pyrate3"
          chmod +x "$HOME/lab/bin/pyrate3"
          ln -sf pyrate3 "$HOME/lab/bin/pyrate"
          echo "$HOME/lab/bin" >> "$GITHUB_PATH"
      - name: Execute live PyR@TE quartic/soft dump
        run: python live_pyrate_quartic_soft_dump_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_live_pyrate_quartic_soft_dump_v20.py
      - name: Assert live dump honesty
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('LIVE_PYRATE_QUARTIC_SOFT_DUMP_V20_VERDICT.json'))
          assert r['n_failed']==0
          assert r['status']=='LIVE_PYRATE_QUARTIC_SOFT_DUMP_EXECUTED__TAU_P_OPEN'
          assert r['flag']['full_quartic_soft_live_dump']
          assert r['flag']['gauge_still_matches_minus4']
          assert r['flag']['live_quartic_sector_parsed']
          assert r['flag']['live_trilinear_sector_parsed']
          assert r['flag']['live_soft_sector_parsed']
          assert not r['flag']['lam4_cgc_live_encoded']
          assert not r['flag']['dim6_lock_live_encoded']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          assert Path('models/LIVE_QUARTIC_SOFT_DUMP.json').is_file()
          assert Path('models/SO10Z17AxionV20_quartic_live_BETA.m').is_file()
          PY
      - name: Upload live quartic/soft dump verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pyrate-quartic-soft-dump-verdict
          path: |
            LIVE_PYRATE_QUARTIC_SOFT_DUMP_V20_VERDICT.json
            LIVE_PYRATE_QUARTIC_SOFT_DUMP_V20.md
            models/LIVE_QUARTIC_SOFT_DUMP.json
            models/SO10Z17AxionV20_quartic_live.model
            models/SO10Z17AxionV20_quartic_live_BETA.m
