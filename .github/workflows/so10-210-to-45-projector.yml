name: so10-210-to-45-projector

on:
  pull_request:
    paths:
      - so10_210_to_45_projector_v20.py
      - test_so10_210_to_45_projector_v20.py
      - so10_210_to_54_projector_v20.py
      - .github/workflows/so10-210-to-45-projector.yml
  workflow_dispatch:

concurrency:
  group: so10-210-to-45-projector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  so10-210-to-45-projector:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute 210 to 45 projector
        run: python so10_210_to_45_projector_v20.py --write
      - name: Focused regression tests
        run: python -m unittest -v test_so10_210_to_45_projector_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('SO10_210_TO_45_PROJECTOR_V20.json'))
          assert r['status']=='SO10_210_TO_45_SAME_FIELD_VANISHES__MIXED_OPEN'
          assert r['n_failed']==0
          assert r['overall_state']=='BLOCKED'
          assert r['mathematics']['generic_same_field_fnorm'] < 1e-20
          assert r['mathematics']['generic_mixed_fnorm'] > 1e-12
          assert r['mathematics']['ps_p_a_mixed_fnorm'] < 1e-12
          assert r['checks']['ps_singlet_span_45_closes']
          assert not r['flags']['whole_model_validated']
          PY
      - name: Upload 210 to 45 projector artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: so10-210-to-45-projector
          path: |
            SO10_210_TO_45_PROJECTOR_V20.json
            SO10_210_TO_45_PROJECTOR_V20.md
