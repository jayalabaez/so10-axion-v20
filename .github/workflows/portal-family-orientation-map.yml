name: portal-family-orientation-map

on:
  pull_request:
    paths:
      - "portal_family_orientation_map_v20.py"
      - "test_portal_family_orientation_map_v20.py"
      - "portal_constraint_ray_v20.py"
      - "portal_boundary_heavy_spectrum_v20.py"
      - "channel_fcnc_rates_v20.py"
      - "na62_pointwise_limit_v20.py"
      - "twist_massless_limit_v20.py"
      - "portal_tensors_abcd_v20.py"
      - "physical_cf_matching_v20.py"
      - ".github/workflows/portal-family-orientation-map.yml"
  workflow_dispatch:

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build orientation map
        run: python portal_family_orientation_map_v20.py
      - name: Orientation regressions
        run: python -m unittest -v test_portal_family_orientation_map_v20.py
      - name: Upload orientation verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-family-orientation-map
          path: |
            PORTAL_FAMILY_ORIENTATION_MAP_V20_VERDICT.json
            PORTAL_FAMILY_ORIENTATION_MAP_V20.md
