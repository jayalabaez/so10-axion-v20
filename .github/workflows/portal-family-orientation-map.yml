name: portal-family-orientation-map

on:
  workflow_dispatch:

concurrency:
  group: portal-family-orientation-map-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build orientation map
        run: python portal_family_orientation_map_v20.py
      - name: Orientation regressions
        run: python -m unittest -v test_portal_family_orientation_map_v20.py
      - name: Upload orientation verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-family-orientation-map
          path: |
            PORTAL_FAMILY_ORIENTATION_MAP_V20_VERDICT.json
            PORTAL_FAMILY_ORIENTATION_MAP_V20.md
