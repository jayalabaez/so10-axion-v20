name: scalar-vacuum-proton-decay

on:
  workflow_dispatch:

concurrency:
  group: scalar-vacuum-proton-decay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scalar-vacuum-proton:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute scalar-vacuum and proton-decay calculation
        run: python scalar_vacuum_proton_decay_v20.py
      - name: Focused regression and fail-closed integration tests
        run: |
          python -m unittest -v test_scalar_vacuum_proton_decay_v20.py
          python -m unittest -v test_scalar_proton_validation_integration_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          vacuum=json.load(open('SCALAR_VACUUM_V20_VERDICT.json'))
          proton=json.load(open('PROTON_DECAY_V20_VERDICT.json'))
          combined=json.load(open('SCALAR_VACUUM_PROTON_DECAY_V20_VERDICT.json'))
          assert vacuum['flag']['reduced_radial_global_minimum_proved']
          assert not vacuum['flag']['complete_so10_scalar_potential']
          assert proton['flag']['gauge_boson_exchange_computed']
          assert proton['flag']['conditional_parameter_points_excluded']
          assert not proton['flag']['complete_operator_running_and_hadronic_matching']
          assert not proton['flag']['model_point_excluded']
          assert not combined['whole_model_excluded']
          assert not combined['whole_model_validated']
          PY
      - name: Upload scalar-vacuum and proton-decay verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalar-vacuum-proton-decay-verdict
          path: |
            SCALAR_VACUUM_V20_VERDICT.json
            PROTON_DECAY_V20_VERDICT.json
            SCALAR_VACUUM_PROTON_DECAY_V20_VERDICT.json
            SCALAR_VACUUM_PROTON_DECAY_V20.md
