name: so10-nonsusy-gauge-orbit

on:
  pull_request:
  workflow_dispatch:

jobs:
  gauge-orbit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute exact SO10 gauge orbit certificate
        run: python so10_nonsusy_gauge_orbit_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_so10_nonsusy_gauge_orbit_v20.py
      - name: Assert exact breaking count
        run: |
          python - <<'PY'
          import json
          r=json.load(open('SO10_NONSUSY_GAUGE_ORBIT_V20_VERDICT.json'))
          assert r['n_failed']==0, r
          assert r['orbit']['phi_210_orbit_rank']==24
          assert r['orbit']['delta_breaking_inside_pati_salam']==9
          assert r['orbit']['combined_orbit_rank_goldstones']==33
          assert r['orbit']['combined_stabilizer_dimension']==12
          assert r['orbit']['so6_stabilizer_dimension']==8
          assert r['orbit']['so4_stabilizer_dimension']==4
          assert r['flag']['independent_of_susy_mass_matrices']
          assert not r['flag']['full_component_hessian_derived']
          PY
      - name: Upload verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: so10-nonsusy-gauge-orbit-verdict
          path: |
            SO10_NONSUSY_GAUGE_ORBIT_V20_VERDICT.json
            SO10_NONSUSY_GAUGE_ORBIT_V20.md
