name: so10-126-to-54-projector

on:
  workflow_dispatch:

concurrency:
  group: so10-126-to-54-projector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  so10-126-to-54-projector:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute 126 to 54 projector
        run: python so10_126_to_54_projector_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_so10_126_to_54_projector_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json, math
          r=json.load(open('SO10_126_TO_54_PROJECTOR_V20_VERDICT.json'))
          assert r['status']=='126_TO_54_PROJECTOR_EXPANDED__LOCKING_CG_COMBINATORIAL'
          assert r['n_failed']==0
          c=r['projector']['C_126_to_54']
          assert math.isfinite(c) and c>0
          assert abs(c-1.0)>1e-3
          assert r['projector']['self_dual']['rank_plus_i']==126
          assert r['projector']['self_dual']['rank_minus_i']==126
          assert r['flag']['126_to_54_fully_expanded']
          assert r['flag']['combinatorial_cg_not_published_table']
          assert not r['flag']['invented_unpublished_cg_values']
          assert not r['flag']['whole_model_excluded']
          assert r['locking_reeval']['all_phase_one_massive']
          assert r['locking_reeval']['all_phase_two_flat']
          PY
      - name: Upload 126 to 54 projector verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: so10-126-to-54-projector-verdict
          path: |
            SO10_126_TO_54_PROJECTOR_V20_VERDICT.json
            SO10_126_TO_54_PROJECTOR_V20.md
