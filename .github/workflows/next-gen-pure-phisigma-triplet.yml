name: next-gen-pure-phisigma-triplet

on:
  pull_request:
    paths:
      - 'next_gen_triplet_pure_phisigma_gate_v20.py'
      - 'test_next_gen_triplet_pure_phisigma_gate_v20.py'
      - '.github/workflows/next-gen-pure-phisigma-triplet.yml'
  push:
    branches: [main]
    paths:
      - 'next_gen_triplet_pure_phisigma_gate_v20.py'
      - 'test_next_gen_triplet_pure_phisigma_gate_v20.py'
      - '.github/workflows/next-gen-pure-phisigma-triplet.yml'
  workflow_dispatch:

jobs:
  next-gen-pure-phisigma-triplet:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath pytest

      - name: Compile integration modules
        run: >-
          python -m py_compile
          next_gen_triplet_pure_phisigma_gate_v20.py
          test_next_gen_triplet_pure_phisigma_gate_v20.py

      - name: Run six-coupling insertion tests
        run: >-
          python -m pytest -q
          test_next_gen_triplet_pure_phisigma_gate_v20.py

      - name: Generate authoritative integration report
        run: python next_gen_triplet_pure_phisigma_gate_v20.py

      - name: Assert family insertion and fail-closed scope
        run: |
          python - <<'PY'
          import json

          report = json.load(open('NEXT_GEN_TRIPLET_PURE_PHISIGMA_GATE_V20.json'))
          assert report['n_failed'] == 0, report['failures']
          assert report['normalization_and_legacy_map']['maximum_full_block_residual'] < 1.0e-10
          assert report['flag']['complete_PhiSigma_quartic_triplet_family_inserted'] is True
          assert report['flag']['complete_PhiSigma_quartic_all_component_family_inserted'] is False
          assert report['flag']['complete_component_potential'] is False
          assert report['flag']['physical_triplet_spectrum_complete'] is False
          assert report['flag']['exact_unique_proton_lifetime'] is False
          assert report['flag']['whole_model_validated'] is False
          assert report['flag']['empirical_discovery'] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: next-gen-pure-phisigma-triplet
          path: |
            NEXT_GEN_TRIPLET_PURE_PHISIGMA_GATE_V20.json
            NEXT_GEN_TRIPLET_PURE_PHISIGMA_GATE_V20.md
