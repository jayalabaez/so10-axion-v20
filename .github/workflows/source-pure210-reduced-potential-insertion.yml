name: source-pure210-reduced-potential-insertion

on:
  pull_request:
    paths:
      - 'source_pure210_reduced_potential_insertion_v20.py'
      - 'test_source_pure210_reduced_potential_insertion_v20.py'
      - 'source_210_quartic_norm_identity_v20.py'
      - 'so10_210_source_quartic_basis_v20.py'
      - 'nonsusy_reduced_hessian_v20.py'
      - 'reduced_quartic_copositivity_bfb_v20.py'
      - '.github/workflows/source-pure210-reduced-potential-insertion.yml'
  push:
    branches: [main]
    paths:
      - 'source_pure210_reduced_potential_insertion_v20.py'
      - 'test_source_pure210_reduced_potential_insertion_v20.py'
      - 'source_210_quartic_norm_identity_v20.py'
      - '.github/workflows/source-pure210-reduced-potential-insertion.yml'
  workflow_dispatch:

concurrency:
  group: source-pure210-reduced-insertion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  insertion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy scipy mpmath
      - name: Focused insertion tests
        run: python -m unittest -v test_source_pure210_reduced_potential_insertion_v20.py
      - name: Emit insertion report
        run: python source_pure210_reduced_potential_insertion_v20.py --write
      - name: Assert honest scientific state
        run: |
          python - <<'PY'
          import json
          r=json.load(open('SOURCE_PURE210_REDUCED_POTENTIAL_INSERTION_V20.json'))
          assert r['n_failed']==0 and r['overall_state']=='BLOCKED', r
          assert r['flags']['source_pure210_inserted_into_reduced_P210'], r
          assert r['reduced_quartic']['spectral_source_patched']['positive_definite'], r
          assert r['reduced_quartic']['copositive_source_patched'], r
          assert r['singlet_span']['bfb']['nonnegative'], r
          assert r['flags']['reduced_hessian_soft_rematch_open'], r
          assert not r['flags']['whole_model_validated'], r
          assert not r['flags']['g1_closed'], r
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-pure210-reduced-potential-insertion
          path: |
            SOURCE_PURE210_REDUCED_POTENTIAL_INSERTION_V20.json
            SOURCE_PURE210_REDUCED_POTENTIAL_INSERTION_V20.md
