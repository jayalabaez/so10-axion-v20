name: gauge-scalar-interference-4x4

on:
  workflow_dispatch:

concurrency:
  group: gauge-scalar-interference-4x4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gauge-scalar-interference-4x4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute gauge-scalar 4x4 interference
        run: python gauge_scalar_interference_4x4_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_gauge_scalar_interference_4x4_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('GAUGE_SCALAR_INTERFERENCE_4x4_V20_VERDICT.json'))
          assert r['status']=='GAUGE_SCALAR_INTERFERENCE_WITH_PHYSICAL_4x4_MIXINGS'
          assert r['n_failed']==0
          assert r['basis']==['T_10','Tbar_10','T_126','Tprime_126']
          assert 0 < r['n_excluded_by_ps_mu_K0'] < r['n_scenarios']
          assert 0 < r['n_excluded_by_constructive_SK_e_pi0_from_ps'] < r['n_scenarios']
          assert r['flag']['gauge_scalar_interference_with_4x4_mixings']
          assert r['flag']['physical_eigenvector_fractions_used']
          assert r['flag']['tprime_included_in_interference']
          assert r['flag']['relative_phase_is_envelope_not_derived']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload 4x4 interference verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauge-scalar-interference-4x4-verdict
          path: |
            GAUGE_SCALAR_INTERFERENCE_4x4_V20_VERDICT.json
            GAUGE_SCALAR_INTERFERENCE_4x4_V20.md
