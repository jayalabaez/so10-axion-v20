name: g-singlet-6x6-cw

on:
  workflow_dispatch:

concurrency:
  group: g-singlet-6x6-cw-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  g-singlet-6x6-cw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute G[1,1,0] 6x6 CW
        run: python g_singlet_6x6_cw_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_g_singlet_6x6_cw_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('G_SINGLET_6x6_CW_V20_VERDICT.json'))
          assert r['status']=='CAL_G_SOURCE_CORRECTED__SCALAR_CW_WITHDRAWN', r['status']
          assert r['n_failed']==0
          assert r['spectrum']['n_modes']==6
          assert r['spectrum']['n_modes_in_cw']==0
          assert r['flag']['scalar_CW_contribution_withdrawn']
          assert r['g_singlet_cw']['n_entries']==0
          assert r['flag']['cal_G_eq102_transcribed']
          assert r['flag']['chiral_5x5_null_verified_as_susy_diagnostic']
          assert r['flag']['direct_nonsusy_singlet_hessian_required']
          assert not r['flag']['g_singlet_6x6_complete']
          assert not r['flag']['soft_gaugino_overlap_subtracted']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          assert not r['flag']['whole_model_validated']
          PY
      - name: Upload G-singlet CW verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g-singlet-6x6-cw-verdict
          path: |
            G_SINGLET_6x6_CW_V20_VERDICT.json
            G_SINGLET_6x6_CW_V20.md
