name: coupled-cross-two-scale-audit

on:
  push:
    branches:
      - agent/coupled-p-delta-backreaction-scan
  pull_request:
    paths:
      - coupled_p_delta_backreaction_scan_v20.py
      - coupled_cross_two_scale_audit_v20.py
      - .github/workflows/coupled-cross-two-scale-audit.yml
  workflow_dispatch:

jobs:
  coupled-cross-two-scale-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile audit
        run: python -m py_compile coupled_p_delta_backreaction_scan_v20.py coupled_cross_two_scale_audit_v20.py
      - name: Execute two-scale Noether audit
        run: python coupled_cross_two_scale_audit_v20.py > /tmp/coupled-cross-two-scale.log
      - name: Print audit
        run: cat COUPLED_CROSS_TWO_SCALE_AUDIT_V20.json
      - uses: actions/upload-artifact@v4
        with:
          name: coupled-cross-two-scale-audit
          path: |
            COUPLED_CROSS_TWO_SCALE_AUDIT_V20.json
            COUPLED_CROSS_TWO_SCALE_AUDIT_V20.md
