name: current-main-full-reaudit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: current-main-full-reaudit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-direct-tensor-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - name: Execute corrected tensor chain
        run: |
          python direct_phi_h_sigmabar_tensor_v20.py
          python direct_phi_h_sigmabar_td_crosscheck_v20.py
          python mixed_210_126_10_cw_v20.py
          python g_singlet_6x6_cw_v20.py
          python mixed_210_126_10_hilbert_hessian_v20.py
          python cal_g_soft_mode_classification_v20.py
          python cal_g_portal_decision_v20.py
          python lambda_lock_cal_g_lift_v20.py
          python tau_p_hessian_residual_closure_v20.py
          python tau_p_ultimate_residual_checklist_v20.py
          python susy_matrix_scalar_contamination_audit_v20.py
          python efjx_cgc_physical_normalization_gate_v20.py
          python phi210_h10_sigmabar126_s_cgc_derivation_v20.py --write
          python latest_main_residual_integration_v20.py
          python final_scalar_theory_gate_v20.py
          python irreducible_gap_closure_contract_v20.py
          python repository_blocker_inventory_v20.py
      - name: Focused tests
        run: |
          python -m unittest -v \
            test_direct_phi_h_sigmabar_tensor_v20.py \
            test_direct_phi_h_sigmabar_td_crosscheck_v20.py \
            test_mixed_210_126_10_cw_v20.py \
            test_g_singlet_6x6_cw_v20.py \
            test_mixed_210_126_10_hilbert_hessian_v20.py \
            test_cal_g_soft_mode_classification_v20.py \
            test_cal_g_portal_decision_v20.py \
            test_lambda_lock_cal_g_lift_v20.py \
            test_tau_p_hessian_residual_closure_v20.py \
            test_tau_p_ultimate_residual_checklist_v20.py \
            test_susy_matrix_scalar_contamination_audit_v20.py \
            test_scalar_alpha_flavour_nonuniqueness_v20.py \
            test_efjx_cgc_physical_normalization_gate_v20.py \
            test_phi210_h10_sigmabar126_s_cgc_derivation_v20.py \
            test_latest_main_residual_integration_v20.py \
            test_final_scalar_theory_gate_v20.py \
            test_irreducible_gap_closure_contract_v20.py \
            test_repository_blocker_inventory_v20.py
      - name: Assert honest correction
        run: |
          python - <<'PY'
          import json
          d=json.load(open('DIRECT_PHI_H_SIGMABAR_TENSOR_V20.json'))
          x=json.load(open('DIRECT_PHI_H_SIGMABAR_TD_CROSSCHECK_V20.json'))
          e=json.load(open('EFJX_CGC_PHYSICAL_NORMALIZATION_GATE_V20.json'))
          mc=json.load(open('MIXED_210_126_10_CW_V20_VERDICT.json'))
          gc=json.load(open('G_SINGLET_6x6_CW_V20_VERDICT.json'))
          m=json.load(open('MIXED_210_126_10_HILBERT_HESSIAN_V20.json'))
          c=json.load(open('CAL_G_SOFT_MODE_CLASSIFICATION_V20.json'))
          o=json.load(open('CAL_G_PORTAL_DECISION_V20.json'))
          w=json.load(open('LAMBDA_LOCK_CAL_G_LIFT_V20.json'))
          t=json.load(open('TAU_P_HESSIAN_RESIDUAL_CLOSURE_V20_VERDICT.json'))
          s=json.load(open('SUSY_MATRIX_SCALAR_CONTAMINATION_AUDIT_V20.json'))
          p=json.load(open('PHI210_H10_SIGMABAR126_S_CGC_DERIVATION_V20.json'))
          l=json.load(open('LATEST_MAIN_RESIDUAL_INTEGRATION_V20.json'))
          z=json.load(open('FINAL_SCALAR_THEORY_GATE_V20.json'))
          k=json.load(open('IRREDUCIBLE_GAP_CLOSURE_CONTRACT_V20.json'))
          r=json.load(open('REPOSITORY_BLOCKER_INVENTORY_V20.json'))
          assert d['n_failed']==0 and d['overall_state']=='BLOCKED', d
          assert d['representation']['tensor_map_shape']==[10,126], d
          assert d['singlet_basis']['generic_orbit_rank']==33, d
          assert d['flags']['canonical_126_kinetic_basis_constructed'], d
          assert d['flags']['closed_analytic_portal_spectrum_derived'], d
          assert d['analytic_match']['max_abs_singular_value_residual'] < 1e-12, d
          assert d['canonical_normalization']['sigma_kinetic_gram_max_abs_residual'] < 1e-12, d
          assert d['flags']['efjx_cgc_route_invalidated'], d
          assert not d['flags']['old_8p8e29_bound_valid'], d
          assert x['n_failed']==0 and x['overall_state']=='BLOCKED', x
          assert x['max_abs_residual'] < 1e-12, x
          assert x['flags']['published_gamma_TD_magnitudes_matched'], x
          assert x['canonical_dictionary']=={'P':'p','A':'sqrt(3)*a','W':'sqrt(6)*omega'}, x
          assert e['n_failed']==0 and e['overall_state']=='BLOCKED', e
          assert e['flags']['exact_EFJX_gauge_response_known'], e
          assert not e['flags']['exact_EFJX_gamma_response_known'], e
          assert e['flags']['efjx_cgc_route_invalidated'], e
          assert not e['flags']['physical_CGC_normalization_derived'], e
          assert mc['flag']['scalar_CW_contribution_withdrawn'] and not mc['flag']['mixed_210_126_10_in_cw'], mc
          assert gc['flag']['scalar_CW_contribution_withdrawn'] and gc['g_singlet_cw']['n_entries']==0, gc
          assert m['flag']['imported_susy_hessian_withdrawn'] and not m['flag']['mixed_210_126_10_complete'], m
          assert c['flag']['cal_G_susy_gaugino_diagnostic_only'] and not c['flag']['cal_G_soft_mode_classified'], c
          assert o['flag']['cal_G_susy_gaugino_target_withdrawn'] and not o['flag']['cal_G_portal_decision_resolved'], o
          assert w['flag']['cal_G_susy_gaugino_target_withdrawn'] and not w['flag']['selected_lambda_lock_raised_to_cal_G_lift'], w
          assert t['flag']['imported_susy_hessian_withdrawn'] and not t['flag']['full_component_hessian_residual_closed'], t
          assert s['n_failed']==0 and s['counts']['n_remaining']==0, s
          assert s['flag']['all_known_susy_matrix_scalar_paths_withdrawn'], s
          assert p['joint_physical_constraint']['withdrawn'], p
          assert p['joint_physical_constraint']['c_norm_needed_for_negative_portal_natural_window'] is None, p
          assert l['n_failed']==0, l
          assert l['valid_new_closures']['direct_Phi_H_Sigmabar_10x126_tensor_map'], l
          assert l['flag']['all_susy_matrix_scalar_closures_withdrawn'], l
          assert l['flag']['all_susy_matrix_scalar_CW_paths_withdrawn'], l
          assert l['dependency_audit']['susy_matrix_contamination_n_remaining']==0, l
          assert l['invalidated_selected_point_claims']['EFJX_gauge_response_is_lambda4_gamma_response'], l
          assert l['invalidated_selected_point_claims']['c_norm_needed_is_8p8e29'], l
          assert z['overall_state']=='BLOCKED', z
          assert r['overall_state']=='BLOCKED', r
          assert k['overall_state']=='BLOCKED' and k['n_open']==8, k
          assert not e['flags']['whole_model_validated'], e
          assert not e['flags']['whole_model_excluded'], e
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-direct-tensor-correction
          path: |
            DIRECT_PHI_H_SIGMABAR_TENSOR_V20.json
            DIRECT_PHI_H_SIGMABAR_TENSOR_V20.md
            DIRECT_PHI_H_SIGMABAR_TD_CROSSCHECK_V20.json
            DIRECT_PHI_H_SIGMABAR_TD_CROSSCHECK_V20.md
            EFJX_CGC_PHYSICAL_NORMALIZATION_GATE_V20.json
            EFJX_CGC_PHYSICAL_NORMALIZATION_GATE_V20.md
            MIXED_210_126_10_CW_V20_VERDICT.json
            G_SINGLET_6x6_CW_V20_VERDICT.json
            MIXED_210_126_10_HILBERT_HESSIAN_V20.json
            CAL_G_SOFT_MODE_CLASSIFICATION_V20.json
            CAL_G_PORTAL_DECISION_V20.json
            LAMBDA_LOCK_CAL_G_LIFT_V20.json
            TAU_P_HESSIAN_RESIDUAL_CLOSURE_V20_VERDICT.json
            SUSY_MATRIX_SCALAR_CONTAMINATION_AUDIT_V20.json
            PHI210_H10_SIGMABAR126_S_CGC_DERIVATION_V20.json
            PHI210_H10_SIGMABAR126_S_CGC_DERIVATION_V20.md
            LATEST_MAIN_RESIDUAL_INTEGRATION_V20.json
            FINAL_SCALAR_THEORY_GATE_V20.json
            IRREDUCIBLE_GAP_CLOSURE_CONTRACT_V20.json
            REPOSITORY_BLOCKER_INVENTORY_V20.json

  full-reaudit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - name: Execute canonical scalar and tensor gates
        run: |
          python quartic_soft_betas_v20.py
          python mixed_rep_invariant_floor_audit_v20.py
          python mixed_rep_invariant_exact_witness_v20.py
          python so10_cubic_operator_signed_audit_v20.py
          python mixed_rep_enlarged_floor_basis_v20.py
          python nonsusy_reduced_hessian_v20.py
          python ew_portal_rescue_bound_v20.py
          python so10_nonsusy_gauge_orbit_v20.py
          python direct_phi_h_sigmabar_tensor_v20.py
          python direct_phi_h_sigmabar_td_crosscheck_v20.py
          python mixed_210_126_10_cw_v20.py
          python g_singlet_6x6_cw_v20.py
          python mixed_210_126_10_hilbert_hessian_v20.py
          python cal_g_soft_mode_classification_v20.py
          python cal_g_portal_decision_v20.py
          python lambda_lock_cal_g_lift_v20.py
          python tau_p_hessian_residual_closure_v20.py
          python tau_p_ultimate_residual_checklist_v20.py
          python susy_matrix_scalar_contamination_audit_v20.py
          python scalar_proton_falsification_gate_v20.py
          python efjx_cgc_physical_normalization_gate_v20.py
          python phi210_h10_sigmabar126_s_cgc_derivation_v20.py --write
          python latest_main_residual_integration_v20.py
          python current_main_repair_closure_v20.py
          python final_scalar_theory_gate_v20.py
          python irreducible_gap_closure_contract_v20.py
          python repository_blocker_inventory_v20.py
      - run: python replicate.py
      - run: python validate_release_v20.py
      - run: python falsify_v20.py
      - run: python extensive_confirm_falsify_v20.py
      - run: python -m unittest discover -v -p 'test_*.py'
      - name: Assert final honest state
        run: |
          python - <<'PY'
          import json
          d=json.load(open('DIRECT_PHI_H_SIGMABAR_TENSOR_V20.json'))
          x=json.load(open('DIRECT_PHI_H_SIGMABAR_TD_CROSSCHECK_V20.json'))
          e=json.load(open('EFJX_CGC_PHYSICAL_NORMALIZATION_GATE_V20.json'))
          mc=json.load(open('MIXED_210_126_10_CW_V20_VERDICT.json'))
          gc=json.load(open('G_SINGLET_6x6_CW_V20_VERDICT.json'))
          m=json.load(open('MIXED_210_126_10_HILBERT_HESSIAN_V20.json'))
          c=json.load(open('CAL_G_SOFT_MODE_CLASSIFICATION_V20.json'))
          o=json.load(open('CAL_G_PORTAL_DECISION_V20.json'))
          w=json.load(open('LAMBDA_LOCK_CAL_G_LIFT_V20.json'))
          t=json.load(open('TAU_P_HESSIAN_RESIDUAL_CLOSURE_V20_VERDICT.json'))
          s=json.load(open('SUSY_MATRIX_SCALAR_CONTAMINATION_AUDIT_V20.json'))
          p=json.load(open('PHI210_H10_SIGMABAR126_S_CGC_DERIVATION_V20.json'))
          l=json.load(open('LATEST_MAIN_RESIDUAL_INTEGRATION_V20.json'))
          z=json.load(open('FINAL_SCALAR_THEORY_GATE_V20.json'))
          k=json.load(open('IRREDUCIBLE_GAP_CLOSURE_CONTRACT_V20.json'))
          r=json.load(open('REPOSITORY_BLOCKER_INVENTORY_V20.json'))
          assert d['n_failed']==0 and d['representation']['tensor_map_shape']==[10,126], d
          assert d['flags']['canonical_126_kinetic_basis_constructed'], d
          assert d['flags']['closed_analytic_portal_spectrum_derived'], d
          assert x['n_failed']==0 and x['max_abs_residual'] < 1e-12, x
          assert x['flags']['published_gamma_TD_magnitudes_matched'], x
          assert e['flags']['efjx_cgc_route_invalidated'], e
          assert not e['flags']['exact_EFJX_gamma_response_known'], e
          assert mc['flag']['scalar_CW_contribution_withdrawn'], mc
          assert gc['flag']['scalar_CW_contribution_withdrawn'], gc
          assert m['flag']['imported_susy_hessian_withdrawn'], m
          assert c['flag']['cal_G_susy_gaugino_diagnostic_only'], c
          assert o['flag']['cal_G_susy_gaugino_target_withdrawn'], o
          assert w['flag']['cal_G_susy_gaugino_target_withdrawn'], w
          assert t['flag']['imported_susy_hessian_withdrawn'], t
          assert s['n_failed']==0 and s['counts']['n_remaining']==0, s
          assert p['joint_physical_constraint']['withdrawn'], p
          assert not p['flag']['old_8p8e29_bound_valid'], p
          assert l['n_failed']==0, l
          assert l['valid_new_closures']['direct_Phi_H_Sigmabar_10x126_tensor_map'], l
          assert l['flag']['all_susy_matrix_scalar_closures_withdrawn'], l
          assert l['flag']['all_susy_matrix_scalar_CW_paths_withdrawn'], l
          assert z['overall_state']=='BLOCKED', z
          assert k['overall_state']=='BLOCKED' and k['n_open']==8, k
          assert r['overall_state']=='BLOCKED', r
          assert not z['flags']['whole_model_validated'], z
          assert not z['flags']['whole_model_excluded'], z
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-main-scalar-proton-reaudit
          path: |
            DIRECT_PHI_H_SIGMABAR_TENSOR_V20.json
            DIRECT_PHI_H_SIGMABAR_TENSOR_V20.md
            DIRECT_PHI_H_SIGMABAR_TD_CROSSCHECK_V20.json
            DIRECT_PHI_H_SIGMABAR_TD_CROSSCHECK_V20.md
            EFJX_CGC_PHYSICAL_NORMALIZATION_GATE_V20.json
            EFJX_CGC_PHYSICAL_NORMALIZATION_GATE_V20.md
            MIXED_210_126_10_CW_V20_VERDICT.json
            G_SINGLET_6x6_CW_V20_VERDICT.json
            MIXED_210_126_10_HILBERT_HESSIAN_V20.json
            CAL_G_SOFT_MODE_CLASSIFICATION_V20.json
            CAL_G_PORTAL_DECISION_V20.json
            LAMBDA_LOCK_CAL_G_LIFT_V20.json
            TAU_P_HESSIAN_RESIDUAL_CLOSURE_V20_VERDICT.json
            SUSY_MATRIX_SCALAR_CONTAMINATION_AUDIT_V20.json
            PHI210_H10_SIGMABAR126_S_CGC_DERIVATION_V20.json
            PHI210_H10_SIGMABAR126_S_CGC_DERIVATION_V20.md
            LATEST_MAIN_RESIDUAL_INTEGRATION_V20.json
            FINAL_SCALAR_THEORY_GATE_V20.json
            IRREDUCIBLE_GAP_CLOSURE_CONTRACT_V20.json
            REPOSITORY_BLOCKER_INVENTORY_V20.json
