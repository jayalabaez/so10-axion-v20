name: current-main-full-reaudit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: current-main-full-reaudit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-direct-tensor-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra poppler-utils
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - name: Execute corrected tensor chain
        run: |
          python direct_phi_h_sigmabar_tensor_v20.py
          python direct_phi_h_sigmabar_td_crosscheck_v20.py
          python direct_phi_h_sigmabar_portal_m2_block_v20.py --write
          python mixed_210_126_10_cw_v20.py
          python g_singlet_6x6_cw_v20.py
          python mixed_210_126_10_hilbert_hessian_v20.py
          python cal_g_soft_mode_classification_v20.py
          python cal_g_portal_decision_v20.py
          python lambda_lock_cal_g_lift_v20.py
          python tau_p_hessian_residual_closure_v20.py
          python tau_p_ultimate_residual_checklist_v20.py
          python susy_matrix_scalar_contamination_audit_v20.py
          python efjx_cgc_physical_normalization_gate_v20.py
          python phi210_h10_sigmabar126_s_cgc_derivation_v20.py --write
          python latest_main_residual_integration_v20.py
          python final_scalar_theory_gate_v20.py
          python irreducible_gap_closure_contract_v20.py
          python repository_blocker_inventory_v20.py
          python exact_x_symmetry_consistency_gate_v20.py
          python gauged_u1x_scalar_contract_v20.py --write
          python g1_exact_declared_symmetry_character_census_v20.py --write
          python exact_gauged_u1x_stationarity_rank_certificate_v20.py --write
          python gauged_u1x_g2_derivative_audit_v20.py --write
          python exact_gauged_u1x_physical_quotient_v20.py --write
          python exact_gauged_u1x_g3_pd_rank_certificate_v20.py --recompute-heavy --write
          python exact_gauged_u1x_g3_a_square_recoupling_v20.py --recompute --write
          python exact_gauged_u1x_g3_sos_bfb_stationarity_v20.py --recompute --write
          python exact_gauged_u1x_g3_global_counterexample_v20.py --write
