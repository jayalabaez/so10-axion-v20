name: live-g2-canonical-486-field-chart

on:
  workflow_dispatch:
  pull_request:
    paths:
      - live_g2_canonical_486_field_chart_v20.py
      - test_live_g2_canonical_486_field_chart_v20.py
      - live_g2_arbitrary_component_potential_values_v20.py
      - live_g1_g8_gate_ledger_v20.py
      - test_live_g1_g8_gate_ledger_v20.py
      - .github/workflows/live-g2-canonical-486-field-chart.yml
  push:
    branches: [main]
    paths:
      - live_g2_canonical_486_field_chart_v20.py
      - test_live_g2_canonical_486_field_chart_v20.py
      - live_g2_arbitrary_component_potential_values_v20.py
      - live_g1_g8_gate_ledger_v20.py
      - test_live_g1_g8_gate_ledger_v20.py
      - .github/workflows/live-g2-canonical-486-field-chart.yml

jobs:
  canonical-486-field-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest mpmath
      - name: Compile chart and ledger
        run: |
          python -m py_compile \
            live_g2_canonical_486_field_chart_v20.py \
            test_live_g2_canonical_486_field_chart_v20.py \
            live_g1_g8_gate_ledger_v20.py \
            test_live_g1_g8_gate_ledger_v20.py
      - name: Run chart and ledger tests
        run: |
          python -m pytest -q \
            test_live_g2_canonical_486_field_chart_v20.py \
            test_live_g1_g8_gate_ledger_v20.py
      - name: Generate certificates
        run: |
          python live_g2_canonical_486_field_chart_v20.py --write
          python live_g1_g8_gate_ledger_v20.py
      - name: Assert canonical chart and fail-closed scope
        run: |
          python - <<'PY'
          import json

          chart=json.load(open('LIVE_G2_CANONICAL_486_FIELD_CHART_V20.json'))
          assert chart['n_failed']==0, chart['failures']
          assert chart['audit']['dimensions']['total']==486
          assert chart['audit']['dimensions']['symmetric_Hessian_entries']==118341
          assert chart['audit']['coordinate_name_count']==486
          assert chart['audit']['deterministic_roundtrip_residual'] < 1e-12
          assert chart['audit']['random_roundtrip_residual'] < 1e-12
          assert chart['audit']['deterministic_kinetic_residual'] < 1e-12
          assert chart['audit']['random_kinetic_residual'] < 1e-10
          assert chart['audit']['sigma_chirality_residual'] < 1e-12
          assert chart['audit']['all_64_direction_roundtrip_residual'] < 1e-10
          assert chart['audit']['generic_gauge_orbit_rank']==45
          assert chart['audit']['gauge_norm_invariance_residual'] < 1e-10
          assert chart['flags']['canonical_486_real_chart_closed']
          assert not chart['flags']['complete_486_gradient']
          assert not chart['flags']['complete_486x486_Hessian']
          assert not chart['flags']['G2_closed']
          assert not chart['flags']['whole_model_validated']

          ledger=json.load(open('LIVE_G1_G8_GATE_LEDGER_V20.json'))
          assert ledger['n_failed']==0, ledger['failures']
          assert ledger['model_contract_id']=='historical_option_c_no_x_v20'
          assert ledger['authoritative_for_manuscript'] is False
          assert ledger['supersedes_for_current_status'] is False
          assert ledger['summary']['closed']==['G1']
          assert ledger['gates']['G2']['status']=='PARTIAL'
          assert ledger['gates']['G2']['corrections']['canonical_field_chart_closed']
          assert len(ledger['gates']['G2']['open_scope'])==3
          assert ledger['flags']['historical_option_c_g2_canonical_field_chart_complete']
          assert not ledger['flags']['authoritative_manuscript_g1_closed']
          assert not ledger['flags']['authoritative_manuscript_g2_closed']
          assert not ledger['flags']['g1_closed']
          assert not ledger['flags']['g2_value_layer_complete']
          assert not ledger['flags']['g2_canonical_field_chart_complete']
          assert not ledger['flags']['g2_complete_gradient']
          assert not ledger['flags']['g2_complete_Hessian']
          assert not ledger['flags']['g2_closed']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-g2-canonical-486-field-chart
          path: |
            LIVE_G2_CANONICAL_486_FIELD_CHART_V20.json
            LIVE_G2_CANONICAL_486_FIELD_CHART_V20.md
            LIVE_G1_G8_GATE_LEDGER_V20.json
            LIVE_G1_G8_GATE_LEDGER_V20.md
