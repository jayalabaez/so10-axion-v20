name: g1-exact-declared-symmetry-character-census

on:
  pull_request:
    paths:
      - 'g1_exact_declared_symmetry_character_census_v20.py'
      - 'test_g1_exact_declared_symmetry_character_census_v20.py'
      - 'exact_phi17_neutral_dressing_completion_v20.py'
      - 'test_exact_phi17_neutral_dressing_completion_v20.py'
      - 'nonsusy_z17_pq_phi17_dressing_completion_v20.py'
      - 'test_nonsusy_z17_pq_phi17_dressing_completion_v20.py'
      - 'exact_phi17_dressing_character_crosscheck_v20.py'
      - 'test_exact_phi17_dressing_character_crosscheck_v20.py'
      - 'exact_phi2_h_126dag_210_1050_channels_v20.py'
      - 'test_exact_phi2_h_126dag_210_1050_channels_v20.py'
      - 'exact_phi2_h126dag_selected_vacuum_projection_v20.py'
      - 'test_exact_phi2_h126dag_selected_vacuum_projection_v20.py'
      - '.github/workflows/g1-exact-declared-symmetry-character-census.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: g1-exact-declared-census-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-declared-census:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest numpy mpmath
      - name: Compile exact census and projection gates
        run: |
          python -m py_compile \
            g1_exact_declared_symmetry_character_census_v20.py \
            exact_phi17_neutral_dressing_completion_v20.py \
            nonsusy_z17_pq_phi17_dressing_completion_v20.py \
            exact_phi17_dressing_character_crosscheck_v20.py \
            exact_phi2_h_126dag_210_1050_channels_v20.py \
            exact_phi2_h126dag_selected_vacuum_projection_v20.py
      - name: Run exact census and projection tests
        run: |
          python -m pytest -q \
            test_g1_exact_declared_symmetry_character_census_v20.py \
            test_exact_phi17_neutral_dressing_completion_v20.py \
            test_nonsusy_z17_pq_phi17_dressing_completion_v20.py \
            test_exact_phi17_dressing_character_crosscheck_v20.py \
            test_exact_phi2_h_126dag_210_1050_channels_v20.py \
            test_exact_phi2_h126dag_selected_vacuum_projection_v20.py
      - name: Emit exact certificates
        run: |
          python g1_exact_declared_symmetry_character_census_v20.py --write
          python exact_phi17_neutral_dressing_completion_v20.py --write
          python nonsusy_z17_pq_phi17_dressing_completion_v20.py --write
          python exact_phi17_dressing_character_crosscheck_v20.py --write
          python exact_phi2_h_126dag_210_1050_channels_v20.py --write
          python exact_phi2_h126dag_selected_vacuum_projection_v20.py --write
      - name: Assert exact but fail-closed scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              path = Path(name)
              assert path.is_file(), f'missing certificate {name}'
              data = json.loads(path.read_text(encoding='utf-8'))
              print(f'{name}: status={data.get("status")} n_failed={data.get("n_failed")} overall={data.get("overall_state")}')
              return data

          d = load('G1_EXACT_DECLARED_SYMMETRY_CHARACTER_CENSUS_V20.json')
          assert d['n_failed'] == 0 and d['overall_state'] == 'PARTIAL', d['failures']
          assert d['model_contract_id'] == 'gauged_u1x_phi17_v20'
          assert d['counts']['charge_and_so10_allowed_multidegrees'] == 34, d['counts']
          assert d['counts']['hermitian_conjugacy_orbits'] == 28, d['counts']
          assert d['counts']['total_potential_orbit_multiplicity'] == 44, d['counts']
          assert d['counts']['total_real_potential_parameters'] == 51, d['counts']
          assert d['anchors']['P2_H_126dag'] == 2, d['anchors']
          assert not d['closure']['explicit_component_tensor_subset_integration_closed'], d['closure']
          assert not d['flags']['g1_closed'], d['flags']

          d = load('EXACT_PHI17_NEUTRAL_DRESSING_COMPLETION_V20.json')
          assert d['n_failed'] == 0, d['failures']
          assert d['catalogue_census']['required_dressing_count'] == 15, d['catalogue_census']
          assert d['catalogue_census']['missing_count'] == 7, d['catalogue_census']

          d = load('EXACT_PHI17_DRESSING_CHARACTER_CROSSCHECK_V20.json')
          assert d['n_failed'] == 0, d['failures']
          assert d['model_contract_id'] == 'historical_option_c_no_x_v20'
          assert d['authoritative_for_manuscript'] is False
          assert d['flags']['all_seven_multiplicity_one'], d['flags']

          d = load('EXACT_PHI2_H_126DAG_210_1050_CHANNELS_V20.json')
          assert d['n_failed'] == 0, d['failures']
          assert d['closure']['multiplicity_two_tensor_family_closed'], d['closure']
          assert not d['closure']['G1_closed'], d['closure']

          d = load('EXACT_PHI2_H126DAG_SELECTED_VACUUM_PROJECTION_V20.json')
          assert d['n_failed'] == 0, d['failures']
          assert d['flags']['canonical_210_1050_projectors_reused'], d['flags']
          assert d['flags']['selected_H_zero_stationarity_preserved'], d['flags']
          assert d['channels']['210']['H_210_block']['rank'] == 3, d['channels']['210']
          assert d['channels']['1050']['H_210_block']['rank'] == 7, d['channels']['1050']
          assert not d['flags']['full_multifield_hessian'], d['flags']
          assert not d['flags']['whole_model_validated'], d['flags']
          print('g1-exact-declared-census assertions passed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-exact-declared-census-${{ matrix.python-version }}
          path: |
            G1_EXACT_DECLARED_SYMMETRY_CHARACTER_CENSUS_V20.json
            G1_EXACT_DECLARED_SYMMETRY_CHARACTER_CENSUS_V20.md
            EXACT_PHI17_NEUTRAL_DRESSING_COMPLETION_V20.json
            EXACT_PHI17_NEUTRAL_DRESSING_COMPLETION_V20.md
            NONSUSY_Z17_PQ_PHI17_DRESSING_COMPLETION_V20.json
            NONSUSY_Z17_PQ_PHI17_DRESSING_COMPLETION_V20.md
            EXACT_PHI17_DRESSING_CHARACTER_CROSSCHECK_V20.json
            EXACT_PHI17_DRESSING_CHARACTER_CROSSCHECK_V20.md
            EXACT_PHI2_H_126DAG_210_1050_CHANNELS_V20.json
            EXACT_PHI2_H_126DAG_210_1050_CHANNELS_V20.md
            EXACT_PHI2_H126DAG_SELECTED_VACUUM_PROJECTION_V20.json
            EXACT_PHI2_H126DAG_SELECTED_VACUUM_PROJECTION_V20.md
