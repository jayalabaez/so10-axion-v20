name: promote-paw-split-reduced-amplitudes

on:
  pull_request:
    paths:
      - 'promote_paw_split_reduced_amplitudes_v20.py'
      - 'test_promote_paw_split_reduced_amplitudes_v20.py'
      - 'source_pure210_reduced_potential_insertion_v20.py'
      - 'pure_210_ps_singlet_quartic_polynomials_v20.py'
      - 'nonsusy_reduced_hessian_v20.py'
      - '.github/workflows/promote-paw-split-reduced-amplitudes.yml'
  push:
    branches: [main]
    paths:
      - 'promote_paw_split_reduced_amplitudes_v20.py'
      - 'test_promote_paw_split_reduced_amplitudes_v20.py'
      - '.github/workflows/promote-paw-split-reduced-amplitudes.yml'
  workflow_dispatch:

concurrency:
  group: promote-paw-split-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy scipy mpmath
      - name: Focused promotion tests
        run: python -m unittest -v test_promote_paw_split_reduced_amplitudes_v20.py
      - name: Emit promotion report
        run: python promote_paw_split_reduced_amplitudes_v20.py --write
      - name: Assert honest scientific state
        run: |
          python - <<'PY'
          import json
          r=json.load(open('PROMOTE_PAW_SPLIT_REDUCED_AMPLITUDES_V20.json'))
          assert r['n_failed']==0 and r['overall_state']=='BLOCKED', r
          assert r['flags']['paw_split_promoted_into_reduced_amplitudes'], r
          assert len(r['promoted_fields'])==7 and 'P_210' not in r['promoted_fields'], r
          assert r['promoted_hessian_lam4_0']['positive_semidefinite'], r
          assert r['flags']['linear_cg_px_cross_for_Delta_H10'], r
          assert not r['flags']['isotropic_P_cross_proxy_only'], r
          assert r['flags']['isotropic_residual_S_Phi17_only'], r
          assert not r['flags']['mixed_field_cg_invented'], r
          assert not r['flags']['whole_model_validated'], r
          assert not r['flags']['g1_closed'], r
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promote-paw-split-reduced-amplitudes
          path: |
            PROMOTE_PAW_SPLIT_REDUCED_AMPLITUDES_V20.json
            PROMOTE_PAW_SPLIT_REDUCED_AMPLITUDES_V20.md
