name: live-g2-all64-component-potential

on:
  pull_request:
    paths:
      - 'live_g2_all64_component_potential_v20.py'
      - 'test_live_g2_all64_component_potential_v20.py'
      - 'live_g1_tensor_closure_ledger_v20.py'
      - 'g1_exact_declared_symmetry_character_census_v20.py'
      - 'exact_*_v20.py'
      - '.github/workflows/live-g2-all64-component-potential.yml'
  push:
    branches: [main]
    paths:
      - 'live_g2_all64_component_potential_v20.py'
      - 'test_live_g2_all64_component_potential_v20.py'
      - 'live_g1_tensor_closure_ledger_v20.py'
      - 'g1_exact_declared_symmetry_character_census_v20.py'
      - 'exact_*_v20.py'
      - '.github/workflows/live-g2-all64-component-potential.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all64-value-evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile evaluator and tests
        run: python -m py_compile live_g2_all64_component_potential_v20.py test_live_g2_all64_component_potential_v20.py
      - name: Execute fail-closed report
        run: python live_g2_all64_component_potential_v20.py --write
      - name: Run focused regression suite
        run: python -m pytest -q test_live_g2_all64_component_potential_v20.py
      - name: Lock non-overclaiming flags
        run: |
          python - <<'PY'
          import live_g2_all64_component_potential_v20 as gate
          report = gate.build_report()
          assert report['n_failed'] == 0, report['failures']
          assert report['counts']['base_families'] == 18
          assert report['counts']['undressed_directions'] == 34
          assert report['counts']['live_directions'] == 64
          assert report['counts']['real_parameters'] == 91
          assert report['flags']['complete_G2_component_potential_value_evaluator']
          assert report['flags']['complete_G2_gradient'] is False
          assert report['flags']['complete_G2_Hessian'] is False
          assert report['flags']['global_vacuum'] is False
          assert report['flags']['whole_model_validated'] is False
          assert report['flags']['empirical_discovery'] is False
          PY
