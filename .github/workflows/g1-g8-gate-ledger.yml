name: g1-g8-gate-ledger

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "g1_g8_gate_ledger_v20.py"
      - "test_g1_g8_gate_ledger_v20.py"
      - "authoritative_full_model_gate_v20.py"
      - "test_authoritative_full_model_gate_v20.py"
      - "publication_referee_gate_v20.py"
      - "test_publication_referee_gate_v20.py"
      - "nonsusy_sm_triplet_branching_census_v20.py"
      - "nonsusy_triplet_component_ledger_v20.py"
      - "promote_210n_tensor_basis_uniqueness_v20.py"
      - "mixed_rep_enlarged_floor_basis_v20.py"
      - "direct_phi_h_sigmabar_portal_m2_block_v20.py"
      - "nonsusy_reduced_hessian_v20.py"
      - "gauge_fixing_goldstone_eating_v20.py"
      - "mixed_rep_hilbert_bfb_completion_v20.py"
      - "triplet_proxy_contamination_audit_v20.py"
      - "nonsusy_charge_allowed_mt_v20.py"
      - "yukawa_rge_2loop_v20.py"
      - "proton_decay_falsification_gate_v20.py"
      - "ULTIMATE_THEORY_GATE_V20_VERDICT.json"
      - ".github/workflows/g1-g8-gate-ledger.yml"
  push:
    branches: [main]
    paths:
      - "g1_g8_gate_ledger_v20.py"
      - "test_g1_g8_gate_ledger_v20.py"
      - "authoritative_full_model_gate_v20.py"
      - "test_authoritative_full_model_gate_v20.py"
      - "publication_referee_gate_v20.py"
      - "test_publication_referee_gate_v20.py"
      - "nonsusy_sm_triplet_branching_census_v20.py"
      - "nonsusy_triplet_component_ledger_v20.py"
      - "promote_210n_tensor_basis_uniqueness_v20.py"
      - "mixed_rep_enlarged_floor_basis_v20.py"
      - "direct_phi_h_sigmabar_portal_m2_block_v20.py"
      - "nonsusy_reduced_hessian_v20.py"
      - "gauge_fixing_goldstone_eating_v20.py"
      - "mixed_rep_hilbert_bfb_completion_v20.py"
      - "triplet_proxy_contamination_audit_v20.py"
      - "nonsusy_charge_allowed_mt_v20.py"
      - "yukawa_rge_2loop_v20.py"
      - "proton_decay_falsification_gate_v20.py"
      - "ULTIMATE_THEORY_GATE_V20_VERDICT.json"
      - ".github/workflows/g1-g8-gate-ledger.yml"

concurrency:
  group: g1-g8-gate-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authoritative-gate-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile gates
        run: |
          python -m py_compile \
            g1_g8_gate_ledger_v20.py \
            test_g1_g8_gate_ledger_v20.py \
            authoritative_full_model_gate_v20.py \
            test_authoritative_full_model_gate_v20.py \
            publication_referee_gate_v20.py \
            test_publication_referee_gate_v20.py \
            nonsusy_sm_triplet_branching_census_v20.py \
            nonsusy_triplet_component_ledger_v20.py
      - name: Run gate tests
        run: |
          python -m unittest -v \
            test_g1_g8_gate_ledger_v20.py \
            test_authoritative_full_model_gate_v20.py \
            test_publication_referee_gate_v20.py \
            test_nonsusy_sm_triplet_branching_census_v20.py \
            test_nonsusy_triplet_component_ledger_v20.py
      - name: Generate G1-G8 ledger
        run: python g1_g8_gate_ledger_v20.py
      - name: Generate canonical full-model gate
        run: python authoritative_full_model_gate_v20.py
      - name: Generate publication referee package
        run: python publication_referee_gate_v20.py
      - name: Assert fail-closed scope
        run: |
          python - <<'PY'
          import json
          ledger=json.load(open('G1_G8_GATE_LEDGER_V20.json'))
          full=json.load(open('AUTHORITATIVE_FULL_MODEL_GATE_V20.json'))
          ref=json.load(open('PUBLICATION_REFEREE_GATE_V20.json'))
          assert ledger['n_failed']==0, ledger['failures']
          assert ledger['overall_state']=='BLOCKED'
          assert ledger['summary']['n_closed']==0
          assert ledger['gates']['G1']['status']=='OPEN'
          assert ledger['gates']['G7']['status']=='OPEN'
          assert ledger['gates']['G4']['corrections']['exact_gauge_goldstones']==33
          assert not ledger['gates']['G4']['corrections']['thirty_seven_physical_null_modes']
          assert ledger['feasibility']['complete_closure_program_is_well_defined']
          assert not ledger['feasibility']['all_gates_closable_from_current_repo_evidence']
          assert not ledger['feasibility']['guarantee_model_passes_all_gates']
          assert full['n_failed']==0, full['failures']
          assert full['overall_state']=='BLOCKED'
          assert full['flag']['authoritative_full_model_gate']
          assert not full['flag']['legacy_ultimate_gate_authoritative']
          assert not full['classification']['whole_model_validated']
          assert not full['classification']['whole_model_excluded']
          assert ref['n_failed']==0, ref['failures']
          assert ref['overall_state']=='BLOCKED'
          assert not ref['flag']['theory_proven']
          assert ref['flag']['ready_for_honest_submission_as_blocked_program']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-g8-authoritative-gates
          path: |
            G1_G8_GATE_LEDGER_V20.json
            G1_G8_GATE_LEDGER_V20.md
            AUTHORITATIVE_FULL_MODEL_GATE_V20.json
            AUTHORITATIVE_FULL_MODEL_GATE_V20.md
            PUBLICATION_REFEREE_GATE_V20.json
            PUBLICATION_REFEREE_GATE_V20.md
            NONSUSY_SM_TRIPLET_BRANCHING_CENSUS_V20.json
            NONSUSY_SM_TRIPLET_BRANCHING_CENSUS_V20.md
