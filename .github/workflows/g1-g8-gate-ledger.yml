          python exact_gauged_u1x_g3_su5_phi_orbit_lemma_v20.py --write
          python exact_gauged_u1x_g3_su5_phi_local_component_v20.py --write
          python exact_gauged_u1x_g3_su5_phi_su3_slice_v20.py --write
          python exact_gauged_u1x_g3_su5_equality_orbit_v20.py --write
          python exact_gauged_u1x_g3_su5_chiral_global_gap_reduction_v20.py --write
