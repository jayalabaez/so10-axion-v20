name: exact-g1-small-families

on:
  pull_request:
    paths:
      - 'exact_phi2_hdagh_channel_family_v20.py'
      - 'test_exact_phi2_hdagh_channel_family_v20.py'
      - 'exact_h10_self_quartic_family_v20.py'
      - 'test_exact_h10_self_quartic_family_v20.py'
      - 'exact_phi_hdag_sigmabar_cubic_audit_v20.py'
      - 'test_exact_phi_hdag_sigmabar_cubic_audit_v20.py'
      - '.github/workflows/exact-phi2-hdagh-channel-family.yml'

jobs:
  exact-g1-small-families:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy mpmath pytest
      - name: Compile gates
        run: |
          python -m py_compile exact_phi2_hdagh_channel_family_v20.py test_exact_phi2_hdagh_channel_family_v20.py
          python -m py_compile exact_h10_self_quartic_family_v20.py test_exact_h10_self_quartic_family_v20.py
          python -m py_compile exact_phi_hdag_sigmabar_cubic_audit_v20.py test_exact_phi_hdag_sigmabar_cubic_audit_v20.py
      - name: Run exact family tests
        run: |
          pytest -q test_exact_phi2_hdagh_channel_family_v20.py
          pytest -q test_exact_h10_self_quartic_family_v20.py
          pytest -q test_exact_phi_hdag_sigmabar_cubic_audit_v20.py
      - name: Generate fresh certificates
        run: |
          python exact_phi2_hdagh_channel_family_v20.py > /tmp/exact_phi2_hdagh_stdout.json
          python exact_h10_self_quartic_family_v20.py > /tmp/exact_h10_self_quartic_stdout.json
          python exact_phi_hdag_sigmabar_cubic_audit_v20.py > /tmp/exact_phi_hdag_sigmabar_stdout.json
      - name: Assert closure and fail-closed scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          phi = json.loads(Path('EXACT_PHI2_HDAGH_CHANNEL_FAMILY_V20.json').read_text())
          assert phi['n_failed'] == 0, phi['failures']
          assert phi['flag']['phi2_hdagh_channel_count_closed'] is True
          assert phi['flag']['complete_mixed_invariant_ring'] is False

          h10 = json.loads(Path('EXACT_H10_SELF_QUARTIC_FAMILY_V20.json').read_text())
          assert h10['n_failed'] == 0, h10['failures']
          assert h10['flag']['h10_self_quartic_count_closed'] is True
          assert h10['flag']['h10_isolated_quartic_BFB_cone_closed'] is True
          assert h10['flag']['complete_mixed_invariant_ring'] is False

          cubic = json.loads(Path('EXACT_PHI_HDAG_SIGMABAR_CUBIC_AUDIT_V20.json').read_text())
          assert cubic['n_failed'] == 0, cubic['failures']
          assert cubic['flag']['operator_exists_and_is_declared_symmetry_allowed'] is True
          assert cubic['flag']['operator_catalogue_currently_incomplete'] is True
          assert cubic['flag']['p_DeltaR_tadpole_from_operator'] is False
          assert cubic['flag']['p_DeltaR_mixed_Hessian_changed_for_nonzero_coefficient'] is True
          assert cubic['flag']['complete_mixed_invariant_ring'] is False
          assert cubic['flag']['whole_model_validated'] is False
          assert cubic['flag']['empirical_discovery'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exact-g1-small-families
          path: |
            EXACT_PHI2_HDAGH_CHANNEL_FAMILY_V20.json
            EXACT_PHI2_HDAGH_CHANNEL_FAMILY_V20.md
            EXACT_H10_SELF_QUARTIC_FAMILY_V20.json
            EXACT_H10_SELF_QUARTIC_FAMILY_V20.md
            EXACT_PHI_HDAG_SIGMABAR_CUBIC_AUDIT_V20.json
            EXACT_PHI_HDAG_SIGMABAR_CUBIC_AUDIT_V20.md
