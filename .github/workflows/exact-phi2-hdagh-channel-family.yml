name: exact-g1-small-families

on:
  pull_request:
    paths:
      - 'exact_phi2_hdagh_channel_family_v20.py'
      - 'test_exact_phi2_hdagh_channel_family_v20.py'
      - 'exact_h10_self_quartic_family_v20.py'
      - 'test_exact_h10_self_quartic_family_v20.py'
      - 'exact_phi_hdag_sigmabar_cubic_audit_v20.py'
      - 'test_exact_phi_hdag_sigmabar_cubic_audit_v20.py'
      - 'exact_hsigma_holomorphic_charge_dressed_completion_v20.py'
      - 'test_exact_hsigma_holomorphic_charge_dressed_completion_v20.py'
      - 'nonsusy_z17_pq_hsigma_completion_v20.py'
      - 'test_nonsusy_z17_pq_hsigma_completion_v20.py'
      - 'exact_phi17_neutral_dressing_completion_v20.py'
      - 'test_exact_phi17_neutral_dressing_completion_v20.py'
      - 'nonsusy_z17_pq_phi17_dressing_completion_v20.py'
      - 'test_nonsusy_z17_pq_phi17_dressing_completion_v20.py'
      - 'nonsusy_z17_pq_potential_filter_v20.py'
      - 'test_nonsusy_z17_pq_potential_filter_v20.py'
      - '.github/workflows/exact-phi2-hdagh-channel-family.yml'

jobs:
  exact-g1-small-families:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy mpmath pytest
      - name: Compile available gates
        run: |
          set -euo pipefail
          for source in \
            exact_phi2_hdagh_channel_family_v20.py \
            test_exact_phi2_hdagh_channel_family_v20.py \
            exact_h10_self_quartic_family_v20.py \
            test_exact_h10_self_quartic_family_v20.py \
            exact_phi_hdag_sigmabar_cubic_audit_v20.py \
            test_exact_phi_hdag_sigmabar_cubic_audit_v20.py \
            exact_hsigma_holomorphic_charge_dressed_completion_v20.py \
            test_exact_hsigma_holomorphic_charge_dressed_completion_v20.py \
            nonsusy_z17_pq_hsigma_completion_v20.py \
            test_nonsusy_z17_pq_hsigma_completion_v20.py \
            exact_phi17_neutral_dressing_completion_v20.py \
            test_exact_phi17_neutral_dressing_completion_v20.py \
            nonsusy_z17_pq_phi17_dressing_completion_v20.py \
            test_nonsusy_z17_pq_phi17_dressing_completion_v20.py \
            nonsusy_z17_pq_potential_filter_v20.py \
            test_nonsusy_z17_pq_potential_filter_v20.py; do
            if [ -f "$source" ]; then python -m py_compile "$source"; fi
          done
      - name: Run available exact-family tests
        run: |
          set -euo pipefail
          for test_file in \
            test_exact_phi2_hdagh_channel_family_v20.py \
            test_exact_h10_self_quartic_family_v20.py \
            test_exact_phi_hdag_sigmabar_cubic_audit_v20.py \
            test_exact_hsigma_holomorphic_charge_dressed_completion_v20.py \
            test_nonsusy_z17_pq_hsigma_completion_v20.py \
            test_exact_phi17_neutral_dressing_completion_v20.py \
            test_nonsusy_z17_pq_phi17_dressing_completion_v20.py \
            test_nonsusy_z17_pq_potential_filter_v20.py; do
            if [ -f "$test_file" ]; then pytest -q "$test_file"; fi
          done
      - name: Generate available certificates
        run: |
          set -euo pipefail
          if [ -f exact_phi2_hdagh_channel_family_v20.py ]; then
            python exact_phi2_hdagh_channel_family_v20.py > /tmp/exact_phi2_hdagh_stdout.json
          fi
          if [ -f exact_h10_self_quartic_family_v20.py ]; then
            python exact_h10_self_quartic_family_v20.py > /tmp/exact_h10_self_quartic_stdout.json
          fi
          if [ -f exact_phi_hdag_sigmabar_cubic_audit_v20.py ]; then
            python exact_phi_hdag_sigmabar_cubic_audit_v20.py > /tmp/exact_phi_hdag_sigmabar_stdout.json
          fi
          if [ -f exact_hsigma_holomorphic_charge_dressed_completion_v20.py ]; then
            python exact_hsigma_holomorphic_charge_dressed_completion_v20.py --write > /tmp/exact_hsigma_holomorphic_stdout.json
          fi
          if [ -f nonsusy_z17_pq_hsigma_completion_v20.py ]; then
            python nonsusy_z17_pq_hsigma_completion_v20.py --write > /tmp/nonsusy_hsigma_completion_stdout.json
          fi
          if [ -f exact_phi17_neutral_dressing_completion_v20.py ]; then
            python exact_phi17_neutral_dressing_completion_v20.py --write > /tmp/exact_phi17_dressing_stdout.json
          fi
          if [ -f nonsusy_z17_pq_phi17_dressing_completion_v20.py ]; then
            python nonsusy_z17_pq_phi17_dressing_completion_v20.py --write > /tmp/nonsusy_phi17_dressing_stdout.json
          fi
          if [ -f nonsusy_z17_pq_potential_filter_v20.py ]; then
            python nonsusy_z17_pq_potential_filter_v20.py > /tmp/nonsusy_filter_stdout.json
          fi
      - name: Assert all available certificates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              path = Path(name)
              return json.loads(path.read_text()) if path.exists() else None

          report = load('EXACT_PHI2_HDAGH_CHANNEL_FAMILY_V20.json')
          if report:
              assert report['n_failed'] == 0, report['failures']
              assert report['flag']['phi2_hdagh_channel_count_closed'] is True
              assert report['flag']['complete_mixed_invariant_ring'] is False

          report = load('EXACT_H10_SELF_QUARTIC_FAMILY_V20.json')
          if report:
              assert report['n_failed'] == 0, report['failures']
              assert report['flag']['h10_self_quartic_count_closed'] is True
              assert report['flag']['h10_isolated_quartic_BFB_cone_closed'] is True
              assert report['flag']['complete_mixed_invariant_ring'] is False

          report = load('EXACT_PHI_HDAG_SIGMABAR_CUBIC_AUDIT_V20.json')
          if report:
              assert report['n_failed'] == 0, report['failures']
              assert report['flag']['operator_exists_and_is_declared_symmetry_allowed'] is True
              historical = report['flag'].get('operator_catalogue_currently_incomplete', False)
              corrected = report['flag'].get('operator_catalogue_corrected', False)
              assert historical ^ corrected
              assert report['flag']['complete_mixed_invariant_ring'] is False

          report = load('EXACT_HSIGMA_HOLOMORPHIC_CHARGE_DRESSED_COMPLETION_V20.json')
          if report:
              assert report['n_failed'] == 0, report['failures']
              assert report['flags']['unique_Hdag2_Sigma2_54_family_closed'] is True
              assert report['flags']['two_Phi17_dressed_cubic_companions_closed'] is True
              assert report['flags']['complete_mixed_invariant_ring'] is False

          report = load('NONSUSY_Z17_PQ_HSIGMA_COMPLETION_V20.json')
          if report:
              assert report['n_failed'] == 0, report['failures']
              assert report['flags']['three_closed_families_registered'] is True
              assert report['flags']['complete_mixed_invariant_ring'] is False

          report = load('EXACT_PHI17_NEUTRAL_DRESSING_COMPLETION_V20.json')
          if report:
              assert report['n_failed'] == 0, report['failures']
              assert report['catalogue_census']['required_dressing_count'] == 15
              assert report['catalogue_census']['already_present_count'] == 8
              assert report['catalogue_census']['missing_count'] == 7
              assert report['flags']['neutral_Phi17_dressing_theorem_closed'] is True
              assert report['flags']['complete_mixed_invariant_ring'] is False

          report = load('NONSUSY_Z17_PQ_PHI17_DRESSING_COMPLETION_V20.json')
          if report:
              assert report['n_failed'] == 0, report['failures']
              assert report['flags']['all_fifteen_dressings_registered'] is True
              assert report['flags']['seven_missing_classes_appended'] is True
              assert report['flags']['complete_mixed_invariant_ring'] is False

          report = load('NONSUSY_Z17_PQ_POTENTIAL_FILTER_V20.json')
          if report:
              assert report['n_failed'] == 0, report['failures']
              if report['flag'].get('mixed_dagger_cubic_retained'):
                  assert '210_H 10_H_dag 126bar_H' in report['allowed_feeding_M_T']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exact-g1-small-families
          if-no-files-found: error
          path: |
            EXACT_PHI2_HDAGH_CHANNEL_FAMILY_V20.json
            EXACT_PHI2_HDAGH_CHANNEL_FAMILY_V20.md
            EXACT_H10_SELF_QUARTIC_FAMILY_V20.json
            EXACT_H10_SELF_QUARTIC_FAMILY_V20.md
            EXACT_PHI_HDAG_SIGMABAR_CUBIC_AUDIT_V20.json
            EXACT_PHI_HDAG_SIGMABAR_CUBIC_AUDIT_V20.md
            EXACT_HSIGMA_HOLOMORPHIC_CHARGE_DRESSED_COMPLETION_V20.json
            EXACT_HSIGMA_HOLOMORPHIC_CHARGE_DRESSED_COMPLETION_V20.md
            NONSUSY_Z17_PQ_HSIGMA_COMPLETION_V20.json
            NONSUSY_Z17_PQ_HSIGMA_COMPLETION_V20.md
            EXACT_PHI17_NEUTRAL_DRESSING_COMPLETION_V20.json
            EXACT_PHI17_NEUTRAL_DRESSING_COMPLETION_V20.md
            NONSUSY_Z17_PQ_PHI17_DRESSING_COMPLETION_V20.json
            NONSUSY_Z17_PQ_PHI17_DRESSING_COMPLETION_V20.md
            NONSUSY_Z17_PQ_POTENTIAL_FILTER_V20.json
            NONSUSY_Z17_PQ_POTENTIAL_FILTER_V20.md
