name: next-gen-g1-g6-progress-30

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "next_gen_g1_g6_progress_30_gate_v20.py"
      - "test_next_gen_g1_g6_progress_30_gate_v20.py"
      - "exact_portal_norm_square_triplet_channel_v20.py"
      - "next_gen_triplet_portal_norm_square_gate_v20.py"
      - "next_gen_g1_g6_progress_gate_v20.py"
      - ".github/workflows/next-gen-g1-g6-progress-30.yml"
  push:
    branches: [main]
    paths:
      - "next_gen_g1_g6_progress_30_gate_v20.py"
      - "test_next_gen_g1_g6_progress_30_gate_v20.py"
      - "exact_portal_norm_square_triplet_channel_v20.py"
      - "next_gen_triplet_portal_norm_square_gate_v20.py"
      - "next_gen_g1_g6_progress_gate_v20.py"
      - ".github/workflows/next-gen-g1-g6-progress-30.yml"

concurrency:
  group: next-gen-g1-g6-progress-30-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  consolidated-progress-30-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile progress gate
        run: |
          python -m py_compile \
            next_gen_g1_g6_progress_30_gate_v20.py \
            test_next_gen_g1_g6_progress_30_gate_v20.py
      - name: Run progress gate tests
        run: python -m unittest -v test_next_gen_g1_g6_progress_30_gate_v20.py
      - name: Generate consolidated progress report
        run: python next_gen_g1_g6_progress_30_gate_v20.py
      - name: Assert exact progress and blocked scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('NEXT_GEN_G1_G6_PROGRESS_30_GATE_V20.json'))
          assert r['n_failed']==0, r['failures']
          assert r['model_contract_id']=='gauged_u1x_phi17_v20'
          assert r['overall_state']=='BLOCKED'
          assert not r['contract_consistent']
          assert r['n_closed_subproblems']==30
          assert all(r['closed_subproblems'].values())
          assert all(r['gate_states'][g]=='BLOCKED' for g in ('G1','G2','G6','G7','G8'))
          assert r['flag']['authoritative_next_gen_G1_G6_progress_30_gate']
          assert r['flag']['all_recorded_exact_subproblems_closed']
          assert r['flag']['exact_X_G1_G2_scoped_subtheorems_complete']
          assert not r['flag']['historical_option_C_authoritative']
          assert r['flag']['G6_diagnostics_are_scoped_not_gate_closure']
          assert r['flag']['exact_portal_norm_square_channel_closed']
          assert r['flag']['exact_quartic_t2bar_t4bar_mixing_inserted']
          assert r['authoritative_triplet_structure']['exact_portal_norm_square']['positive_sector_rank']==1
          assert not r['flag']['G1_closed']
          assert not r['flag']['G6_closed']
          assert not r['flag']['physical_triplet_spectrum_complete']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_validated']
          assert not r['flag']['whole_model_excluded']
          assert not r['flag']['empirical_discovery']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-gen-g1-g6-progress-30
          path: |
            NEXT_GEN_G1_G6_PROGRESS_30_GATE_V20.json
            NEXT_GEN_G1_G6_PROGRESS_30_GATE_V20.md
