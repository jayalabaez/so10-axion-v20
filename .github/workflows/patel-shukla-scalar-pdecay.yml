name: patel-shukla-scalar-pdecay

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  patel-shukla-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute Patel-Shukla scalar channel calculator
        run: python patel_shukla_scalar_pdecay_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_patel_shukla_scalar_pdecay_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('PATEL_SHUKLA_SCALAR_PDECAY_V20_VERDICT.json'))
          assert r['status']=='PATEL_SHUKLA_SCALAR_CHANNELS_COMPUTED__VACUUM_M_T_OPEN'
          assert r['n_failed']==0
          assert r['flag']['published_patel_shukla_templates_applied']
          assert r['flag']['pq_theta_T_zero_adopted']
          assert not r['flag']['complete_so10_scalar_potential']
          assert not r['flag']['numeric_triplet_spectrum_derived']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          assert r['flag']['conditional_parameter_points_excluded']
          assert r['channel_scan']['flag']['MI_alpha0p1_10_H_mu_K0_passes']
          assert r['channel_scan']['flag']['MI_alpha0p01_10_H_mu_K0_excluded']
          assert r['map_onto_triplet_ledger']['eigenvalues_still_null']
          PY
      - name: Upload Patel-Shukla channel verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patel-shukla-scalar-pdecay-verdict
          path: |
            PATEL_SHUKLA_SCALAR_PDECAY_V20_VERDICT.json
            PATEL_SHUKLA_SCALAR_PDECAY_V20.md
