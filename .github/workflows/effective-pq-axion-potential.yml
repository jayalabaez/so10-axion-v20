name: effective-pq-axion-potential

on:
  pull_request:
    paths:
      - effective_pq_axion_potential_v20.py
      - test_effective_pq_axion_potential_v20.py
      - selected_vacuum_neutral_phase_gauge_quotient_v20.py
      - diagonal_210_radial_cubic_ps_singlet_v20.py
      - .github/workflows/effective-pq-axion-potential.yml
  workflow_dispatch:

concurrency:
  group: effective-pq-axion-potential-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  effective-pq-axion-potential:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute effective PQ axion potential
        run: python effective_pq_axion_potential_v20.py --write
      - name: Focused regression tests
        run: python -m unittest -v test_effective_pq_axion_potential_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('EFFECTIVE_PQ_AXION_POTENTIAL_V20.json'))
          assert r['status']=='EFFECTIVE_PQ_AXION_POTENTIAL_FLAT_AT_TREE__UV_KAPPA_OPEN'
          assert r['n_failed']==0
          assert r['overall_state']=='BLOCKED'
          assert r['phase_sector']['tree_level_V_eff_a']==0.0
          a=r['A_kappa_scale']['A_kappa_GeV2']
          assert abs(r['phase_sector']['m2_heavy_GeV2']-5*a)<1e-6*max(5*a,1)
          assert not r['flags']['uv_kappa_determined']
          assert not r['flags']['whole_model_validated']
          PY
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effective-pq-axion-potential
          path: |
            EFFECTIVE_PQ_AXION_POTENTIAL_V20.json
            EFFECTIVE_PQ_AXION_POTENTIAL_V20.md
