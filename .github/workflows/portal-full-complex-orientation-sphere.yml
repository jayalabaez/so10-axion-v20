name: portal-full-complex-orientation-sphere

on:
  pull_request:
    paths:
      - "portal_full_complex_orientation_sphere_v20.py"
      - "test_portal_full_complex_orientation_sphere_v20.py"
      - "portal_family_orientation_map_v20.py"
      - "portal_constraint_ray_v20.py"
      - "portal_boundary_heavy_spectrum_v20.py"
      - "channel_fcnc_rates_v20.py"
      - "na62_pointwise_limit_v20.py"
      - "twist_massless_limit_v20.py"
      - "portal_tensors_abcd_v20.py"
      - "physical_cf_matching_v20.py"
      - ".github/workflows/portal-full-complex-orientation-sphere.yml"
  workflow_dispatch:

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Sample full complex orientation sphere
        run: python portal_full_complex_orientation_sphere_v20.py
      - name: Orientation-sphere regressions
        run: python -m unittest -v test_portal_full_complex_orientation_sphere_v20.py
      - name: Upload orientation-sphere verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-full-complex-orientation-sphere
          path: |
            PORTAL_FULL_COMPLEX_ORIENTATION_SPHERE_V20_VERDICT.json
            PORTAL_FULL_COMPLEX_ORIENTATION_SPHERE_V20.md
