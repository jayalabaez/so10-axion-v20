name: portal-full-complex-orientation-sphere

on:
  workflow_dispatch:

concurrency:
  group: portal-full-complex-orientation-sphere-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Sample full complex orientation sphere
        run: python portal_full_complex_orientation_sphere_v20.py
      - name: Orientation-sphere regressions
        run: python -m unittest -v test_portal_full_complex_orientation_sphere_v20.py
      - name: Upload orientation-sphere verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-full-complex-orientation-sphere
          path: |
            PORTAL_FULL_COMPLEX_ORIENTATION_SPHERE_V20_VERDICT.json
            PORTAL_FULL_COMPLEX_ORIENTATION_SPHERE_V20.md
