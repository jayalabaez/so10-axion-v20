name: replicate-and-falsify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Golden anchors + independent audit
        run: |
          python -c "import json,pathlib; g=json.loads(pathlib.Path('golden/expected_anchors_v20.json').read_text()); light=(3*2+5*2*(2-6),3*16+5*16*(2-6),3*16+5*16*(8-216)); assert list(light)==g['anomalies']['light']"
          python audit_v20_errors.py
      - name: v20 engine
        run: python so10_axion_v20_engine.py --output so10_axion_v20_verdict.json
      - name: Unit tests
        run: python -m unittest discover -v
      - name: Adversarial falsification suite
        run: python falsify_v20.py
      - name: Referee next-step packages
        run: python run_v20_referee_next.py
      - name: Extensive confirm/falsify campaign
        run: python extensive_confirm_falsify_v20.py
      - name: Next physics analysis
        run: python next_physics_analysis_v20.py
      - name: Literature sweep ~150 ueV
        run: python literature_sweep_150uev_v20.py
      - name: Home/public 37 GHz roadmap + GRAVITAS retarget
        run: |
          python home_public_37ghz_search_v20.py
          python gravitas_axion_v20_37ghz.py
          python public_data_indirect_audit_v20.py
          python full_fermion_matching_v20.py
          python tan_beta_profile_v20.py
          python reanalysis_portal_beta_v20.py
      - name: Verify canonical profile artifacts
        run: |
          git diff --exit-code -- \
            TAN_BETA_PROFILE_V20_VERDICT.json \
            TAN_BETA_PROFILE_V20.md
      - name: Upload falsification verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falsification-verdict
          path: |
            FALSIFICATION_VERDICT.json
            v20_referee_next_verdict.json
            V20_REFEREE_NEXT_STEPS.md
            EXTENSIVE_CONFIRM_FALSIFY_VERDICT.json
            EXTENSIVE_CONFIRM_FALSIFY.md
            NEXT_PHYSICS_ANALYSIS_VERDICT.json
            NEXT_PHYSICS_ANALYSIS.md
            LITERATURE_SWEEP_150UEV_VERDICT.json
            LITERATURE_SWEEP_150UEV.md
            HOME_PUBLIC_37GHZ_SEARCH_VERDICT.json
            HOME_PUBLIC_37GHZ_SEARCH.md
            GRAVITAS_AXION_V20_37GHZ.md
            PUBLIC_DATA_INDIRECT_AUDIT_VERDICT.json
            PUBLIC_DATA_INDIRECT_AUDIT.md
            FULL_FERMION_MATCHING_V20_VERDICT.json
            FULL_FERMION_MATCHING_V20.md
            TAN_BETA_PROFILE_V20_VERDICT.json
            TAN_BETA_PROFILE_V20.md
            V20_PORTAL_BETA_REANALYSIS_VERDICT.json
            V20_PORTAL_BETA_REANALYSIS.md
            outputs/gravitas_axion_v20_37ghz/
