          assert candidate['flags']['full_448_PSD_feasibility_certified']
          assert candidate['flags']['strict_local_minimum_certified']
          assert not candidate['flags']['selected_vacuum_global_minimum_certified']
          assert candidate['flags']['selected_vacuum_global_minimum_disproved']
          assert candidate['flags']['exact_lower_energy_field_witness_certified']
          assert candidate['flags']['constructive_candidate_rejected_for_G3']
          assert not candidate['flags']['selected_vacuum_unique_modulo_symmetry']
          assert not candidate['flags']['G3_closed']
          assert g3['status']=='G3_SELECTED_VACUUM_REJECTED_BY_EXACT_GLOBAL_COUNTEREXAMPLE'
          assert g3['overall_state']=='OPEN'
          assert g3['flags']['G3_fixed_vacuum_strict_minimum_certified']
          assert g3['flags']['G3_selected_vacuum_global_no_go_certified']
          assert g3['flags']['exact_lower_energy_field_witness_certified']
