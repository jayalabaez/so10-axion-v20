name: replicate-and-falsify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Golden anchors + independent audit
        run: |
          python -c "import json,pathlib; g=json.loads(pathlib.Path('golden/expected_anchors_v20.json').read_text()); light=(3*2+5*2*(2-6),3*16+5*16*(2-6),3*16+5*16*(8-216)); assert list(light)==g['anomalies']['light']"
          python audit_v20_errors.py
      - name: v20 engine
        run: python so10_axion_v20_engine.py --output so10_axion_v20_verdict.json
      - name: Precompute clean-checkout unit-test artifacts
        run: python prepare_validation_artifacts_v20.py --pre-unit
      - name: Unit tests + scoped attestation
        run: |
          python -m unittest discover -v
          python -c "import json,os,pathlib,unittest; n=unittest.defaultTestLoader.discover('.').countTestCases(); payload={'passed':True,'tests_discovered':n,'commit_sha':os.getenv('GITHUB_SHA',''),'workflow_run_id':os.getenv('GITHUB_RUN_ID',''),'scope':'CURRENT_WORKFLOW_RUN'}; pathlib.Path('CURRENT_UNIT_TEST_ATTESTATION.json').write_text(json.dumps(payload,indent=2)+'\n',encoding='utf-8')"
      - name: Adversarial falsification suite
        run: python falsify_v20.py
      - name: Referee next-step packages
        run: python run_v20_referee_next.py
      - name: Extensive confirm/falsify campaign
        run: python extensive_confirm_falsify_v20.py
      - name: Semantic tan(beta) profile certificate
        run: python verify_tan_beta_profile_semantics.py
      - name: Next physics analysis
        run: python next_physics_analysis_v20.py
      - name: Literature sweep ~150 ueV
        run: python literature_sweep_150uev_v20.py
      - name: NRAO archival 37 GHz inventory (fixture; optional live)
        run: |
          python nrao_37ghz_archival_inventory_v20.py
          python -m unittest -v test_nrao_37ghz_archival_inventory_v20.py
      - name: Home/public 37 GHz roadmap + GRAVITAS retarget
        run: |
          python home_public_37ghz_search_v20.py
          python gravitas_axion_v20_37ghz.py
          python public_data_indirect_audit_v20.py
          python full_fermion_matching_v20.py
          python tan_beta_profile_v20.py
          python reanalysis_portal_beta_v20.py
      - name: Portal tensors + physical C_f + global flavour
        run: |
          python portal_tensors_abcd_v20.py
          python physical_cf_matching_v20.py
          python global_flavour_fit_v20.py
      - name: CMB, diagnostic RG, FCNC limits, portal maps, and strict re-audit
        run: |
          python cmb_public_data_pipeline_v20.py
          python empirical_roadmap_lock_v20.py
          python next_phenomenology_lock_v20.py
          python push_phenomenology_limits_v20.py
          python common_scale_so10_yukawa_v20.py
          python two_loop_so10_210_yukawa_v20.py
          python channel_fcnc_rates_v20.py
          python na62_pointwise_limit_v20.py
          python twist_massless_limit_v20.py
          python portal_constraint_ray_v20.py
          python portal_boundary_heavy_spectrum_v20.py
          python portal_family_orientation_map_v20.py
          python portal_full_complex_orientation_sphere_v20.py
          python theory_certification_math_v20.py
          python pati_salam_yukawa_matching_v20.py
          python portal_yukawa_posterior_v20.py
          python haloscope_37ghz_limit_compare_v20.py
          python uv_vacuum_alignment_v20.py
          python yukawa_rge_2loop_v20.py
          python fcnc_exact_likelihood_v20.py
          python strict_rg_audit_v20.py
          python close_open_gaps_v20.py
          python integrate_full_complex_orientation_v20.py
      - name: Full scientific validity matrix
        run: python theory_validation_matrix_v20.py --expect-conditional
      - name: Final honest verdict + ultimate approval gate
        run: |
          python theory_confirmation_verdict_v20.py
          python ultimate_theory_gate_v20.py
          python ultimate_theory_gate_v20.py --expect-full-block --no-write
      - name: Upload falsification verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falsification-verdict
          path: |
            V20_ERROR_AUDIT.json
            VALIDATION_EXECUTION_V20_VERDICT.json
            VALIDATION_EXECUTION_V20.md
            CURRENT_UNIT_TEST_ATTESTATION.json
            THEORY_VALIDATION_MATRIX_V20_VERDICT.json
            THEORY_VALIDATION_MATRIX_V20.md
            FALSIFICATION_VERDICT.json
            v20_referee_next_verdict.json
            V20_REFEREE_NEXT_STEPS.md
            EXTENSIVE_CONFIRM_FALSIFY_VERDICT.json
            EXTENSIVE_CONFIRM_FALSIFY.md
            NEXT_PHYSICS_ANALYSIS_VERDICT.json
            NEXT_PHYSICS_ANALYSIS.md
            LITERATURE_SWEEP_150UEV_VERDICT.json
            LITERATURE_SWEEP_150UEV.md
            NRAO_37GHZ_ARCHIVAL_INVENTORY_V20_VERDICT.json
            NRAO_37GHZ_ARCHIVAL_INVENTORY_V20.md
            outputs/nrao_37ghz_archival_inventory/
            HOME_PUBLIC_37GHZ_SEARCH_VERDICT.json
            HOME_PUBLIC_37GHZ_SEARCH.md
            GRAVITAS_AXION_V20_37GHZ.md
            PUBLIC_DATA_INDIRECT_AUDIT_VERDICT.json
            PUBLIC_DATA_INDIRECT_AUDIT.md
            FULL_FERMION_MATCHING_V20_VERDICT.json
            FULL_FERMION_MATCHING_V20.md
            TAN_BETA_PROFILE_V20_VERDICT.json
            TAN_BETA_PROFILE_V20.md
            V20_PORTAL_BETA_REANALYSIS_VERDICT.json
            V20_PORTAL_BETA_REANALYSIS.md
            PORTAL_TENSORS_ABCD_V20_VERDICT.json
            PORTAL_TENSORS_ABCD_V20.md
            PHYSICAL_CF_MATCHING_V20_VERDICT.json
            PHYSICAL_CF_MATCHING_V20.md
            GLOBAL_FLAVOUR_FIT_V20_VERDICT.json
            GLOBAL_FLAVOUR_FIT_V20.md
            CMB_PUBLIC_PIPELINE_V20_VERDICT.json
            CMB_PUBLIC_PIPELINE_V20.md
            EMPIRICAL_ROADMAP_LOCK_V20_VERDICT.json
            EMPIRICAL_ROADMAP_LOCK_V20.md
            NEXT_PHENOMENOLOGY_LOCK_V20_VERDICT.json
            NEXT_PHENOMENOLOGY_LOCK_V20.md
            PUSH_PHENOMENOLOGY_LIMITS_V20_VERDICT.json
