name: replicate-and-falsify

on:
  workflow_dispatch:

concurrency:
  group: replicate-and-falsify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Golden anchors + independent audit
        run: |
          python -c "import json,pathlib; g=json.loads(pathlib.Path('golden/expected_anchors_v20.json').read_text()); light=(3*2+5*2*(2-6),3*16+5*16*(2-6),3*16+5*16*(8-216)); assert list(light)==g['anomalies']['light']"
          python audit_v20_errors.py
      - name: v20 engine
        run: python so10_axion_v20_engine.py --output so10_axion_v20_verdict.json
      - name: Precompute clean-checkout unit-test artifacts
        run: python prepare_validation_artifacts_v20.py --pre-unit
      - name: Adversarial falsification suite
        run: python falsify_v20.py
      - name: Referee next-step packages
        run: python run_v20_referee_next.py
      - name: Extensive confirm/falsify campaign
        run: python extensive_confirm_falsify_v20.py
      - name: Semantic tan(beta) profile certificate
        run: python verify_tan_beta_profile_semantics.py
      - name: Next physics analysis
        run: python next_physics_analysis_v20.py
      - name: Literature sweep ~150 ueV
        run: python literature_sweep_150uev_v20.py
      - name: NRAO archival 37 GHz inventory (fixture; optional live)
        run: |
          python nrao_37ghz_archival_inventory_v20.py
          python nrao_37ghz_software_ceiling_v20.py
          python -m unittest -v test_nrao_37ghz_archival_inventory_v20.py test_nrao_37ghz_software_ceiling_v20.py
      - name: Home/public 37 GHz roadmap + GRAVITAS retarget
        run: |
          python home_public_37ghz_search_v20.py
          python gravitas_axion_v20_37ghz.py
          python public_data_indirect_audit_v20.py
          python full_fermion_matching_v20.py
          python tan_beta_profile_v20.py
          python reanalysis_portal_beta_v20.py
      - name: Portal tensors + physical C_f + global flavour
        run: |
          python portal_tensors_abcd_v20.py
          python physical_cf_matching_v20.py
          python global_flavour_fit_v20.py
      - name: CMB, diagnostic RG, FCNC limits, portal maps, and strict re-audit
        run: |
          python cmb_public_data_pipeline_v20.py
          python empirical_roadmap_lock_v20.py
          python next_phenomenology_lock_v20.py
          python push_phenomenology_limits_v20.py
          python common_scale_so10_yukawa_v20.py
          python two_loop_so10_210_yukawa_v20.py
          python channel_fcnc_rates_v20.py
          python na62_pointwise_limit_v20.py
          python twist_massless_limit_v20.py
          python portal_constraint_ray_v20.py
          python portal_boundary_heavy_spectrum_v20.py
          python portal_family_orientation_map_v20.py
          python portal_full_complex_orientation_sphere_v20.py
          python theory_certification_math_v20.py
          python pati_salam_yukawa_matching_v20.py
          python portal_yukawa_posterior_v20.py
          python haloscope_37ghz_limit_compare_v20.py
          python uv_vacuum_alignment_v20.py
          python yukawa_rge_2loop_v20.py
          python fcnc_exact_likelihood_v20.py
          python strict_rg_audit_v20.py
          python close_open_gaps_v20.py
          python integrate_full_complex_orientation_v20.py
      - name: Rebuild authoritative contract and gate chain
        run: |
          python exact_x_symmetry_consistency_gate_v20.py
          python sarah_pyrate_210n_model_file_v20.py
          python gauged_u1x_scalar_contract_v20.py --write
          python g1_exact_declared_symmetry_character_census_v20.py --write
          python exact_gauged_u1x_stationarity_rank_certificate_v20.py --write
          python gauged_u1x_g2_derivative_audit_v20.py --write
          python exact_gauged_u1x_physical_quotient_v20.py --write
          python exact_gauged_u1x_g3_pd_rank_certificate_v20.py --recompute-heavy --write
          python exact_gauged_u1x_g3_a_square_recoupling_v20.py --recompute --write
          python exact_gauged_u1x_g3_sos_bfb_stationarity_v20.py --recompute --write
          python exact_gauged_u1x_g3_global_counterexample_v20.py --write
          python exact_gauged_u1x_g3_su5_max_negative_zero_residual_bound_v20.py --write
          python exact_gauged_u1x_g3_su5_max_negative_full_residual_bound_v20.py --write
          python exact_gauged_u1x_g3_su5_max_negative_rank1_su3_slice_v20.py --write
          python gauged_u1x_g3_sos_candidate_v20.py --recompute-heavy --write
          python gauged_u1x_g3_stability_v20.py --write
          python gauged_u1x_g3_corrected_common_kernel_v20.py --recompute-heavy --write
          python g1_g8_gate_ledger_v20.py --write
          python g1_g8_execution_roadmap_v20.py --write
          python authoritative_full_model_gate_v20.py
          python -m pytest -q \
            test_gauged_u1x_scalar_contract_v20.py \
            test_gauged_u1x_g2_derivative_audit_v20.py \
            test_exact_gauged_u1x_stationarity_rank_certificate_v20.py \
            test_exact_gauged_u1x_physical_quotient_v20.py \
            test_exact_gauged_u1x_g3_pd_rank_certificate_v20.py \
            test_exact_gauged_u1x_g3_a_square_recoupling_v20.py \
            test_exact_gauged_u1x_g3_sos_bfb_stationarity_v20.py \
            test_exact_gauged_u1x_g3_global_counterexample_v20.py \
            test_exact_gauged_u1x_g3_su5_max_negative_zero_residual_bound_v20.py \
            test_exact_gauged_u1x_g3_su5_max_negative_full_residual_bound_v20.py \
            test_exact_gauged_u1x_g3_su5_max_negative_rank1_su3_slice_v20.py \
            test_gauged_u1x_g3_sos_candidate_v20.py \
            test_gauged_u1x_g3_stability_v20.py \
            test_gauged_u1x_g3_corrected_common_kernel_v20.py \
            test_replicate_v20.py
      - name: Assert native static model is not promoted without external execution
        run: |
          python - <<'PY'
          import json
          r=json.load(open('EXACT_X_SYMMETRY_CONSISTENCY_GATE_V20.json'))
          s=r['executable_scaffold_contract']
          e=r['external_model_validation']
          assert r['n_failed']==0 and r['overall_state']=='BLOCKED', r
          assert r['static_contract_consistent'] is True, r
          assert r['blocker']=='AUTHORITATIVE_GAUGED_U1X_EXTERNAL_SARAH_EXECUTION_REQUIRED', r
          assert s['model_syntax_class']=='sarah_native', s
          assert not s['legacy_pseudo_sarah_grammar'] and s['tool_native_sarah_syntax'], s
          assert s['statically_executable_model_contract'], s
          assert not e['valid'], e
          assert not e['checks']['captured_process_log_is_hash_bound'], e
          assert r['repository_external_input_manifest']['valid'], r
          PY
      - name: Assert exact G3 global counterexample rejects selected candidate
        run: |
          python - <<'PY'
          import json
          pd=json.load(open('EXACT_GAUGED_U1X_G3_PD_RANK_CERTIFICATE_V20.json'))
          sos=json.load(open('EXACT_GAUGED_U1X_G3_SOS_BFB_STATIONARITY_V20.json'))
          gc=json.load(open('EXACT_GAUGED_U1X_G3_GLOBAL_COUNTEREXAMPLE_V20.json'))
          kb=json.load(open('EXACT_GAUGED_U1X_G3_KERNEL_QUARTIC_BOUND_V20.json'))
          rr=json.load(open('EXACT_GAUGED_U1X_G3_REPLACEMENT_STATIONARY_ORBIT_V20.json'))
          sf=json.load(open('EXACT_GAUGED_U1X_G3_SU5_DELTA_PD_SOS_V20.json'))
          sh=json.load(open('EXACT_GAUGED_U1X_G3_SU5_DELTA_HSX_EXTENSION_V20.json'))
          shx=json.load(open('EXACT_GAUGED_U1X_G3_SU5_DELTA_HSX_EXACT_HESSIAN_V20.json'))
          sp=json.load(open('EXACT_GAUGED_U1X_G3_SU5_PHI_ORBIT_LEMMA_V20.json'))
          spl=json.load(open('EXACT_GAUGED_U1X_G3_SU5_PHI_LOCAL_COMPONENT_V20.json'))
          ssu3=json.load(open('EXACT_GAUGED_U1X_G3_SU5_PHI_SU3_SLICE_V20.json'))
          se=json.load(open('EXACT_GAUGED_U1X_G3_SU5_EQUALITY_ORBIT_V20.json'))
          sg=json.load(open('EXACT_GAUGED_U1X_G3_SU5_CHIRAL_GLOBAL_GAP_REDUCTION_V20.json'))
          sff=json.load(open('EXACT_GAUGED_U1X_G3_SU5_FIXED_F_OFFKERNEL_BOUND_V20.json'))
          max_negative=json.load(open('EXACT_GAUGED_U1X_G3_SU5_MAX_NEGATIVE_ZERO_RESIDUAL_BOUND_V20.json'))
          max_negative_full=json.load(open('EXACT_GAUGED_U1X_G3_SU5_MAX_NEGATIVE_FULL_RESIDUAL_BOUND_V20.json'))
          rank1_su3=json.load(open('EXACT_GAUGED_U1X_G3_SU5_MAX_NEGATIVE_RANK1_SU3_SLICE_V20.json'))
          ag=json.load(open('EXACT_GAUGED_U1X_G3_ALTERNATIVE_GLOBAL_SOS_AUDIT_V20.json'))
          fg=json.load(open('FINAL_G3_ACCEPTANCE_GATE_V20.json'))
          candidate=json.load(open('GAUGED_U1X_G3_SOS_CANDIDATE_V20.json'))
          g3=json.load(open('GAUGED_U1X_G3_STABILITY_V20.json'))
          assert pd['flags']['direct_exact_source_binding']
          assert pd['flags']['proof_grade_P_plus_Delta_PSD']
          assert pd['flags']['proof_grade_full_rank_448']
          assert pd['flags']['strict_transverse_Hessian_positive_certified']
          assert pd['exact_full_kernel_argument']['exact_full_Hessian_rank']==448
          assert not pd['flags']['global_minimum_certified']
          assert not pd['flags']['G3_closed']
          assert sos['flags']['complete_potential_BFB_exactly_certified']
          assert sos['flags']['selected_vacuum_stationarity_exactly_certified']
          assert not sos['flags']['selected_vacuum_global_minimum_certified']
          assert not sos['flags']['selected_vacuum_unique_modulo_symmetry']
          assert not sos['flags']['G3_closed']
          assert gc['n_failed']==0 and gc['flags']['lower_energy_field_witness_exactly_certified']
          assert gc['flags']['selected_vacuum_global_minimum_disproved']
          assert not gc['flags']['G3_closed'] and not gc['flags']['whole_model_excluded']
          assert kb['n_failed']==0 and kb['flags']['fixed_P_strict_local_global_no_go_exact']
          assert kb['flags']['fixed_P_branch_closed_negative'] and not kb['flags']['G3_closed']
          assert rr['n_failed']==0 and rr['flags']['replacement_full_stationarity_exact']
          assert not rr['flags']['replacement_target_gauge_symmetry_correct']
          assert not rr['flags']['replacement_strict_local_minimum_proof_grade']
          assert sf['n_failed']==0 and sf['scope']['Phi_Sigma_global_minimum_exact']
          assert sf['scope']['Phi_Sigma_Hessian_rank_429_nullity_33_exact']
          assert sf['scope']['SO10_to_SM_stabilizer_dimension_exact']
          assert not sf['scope']['full_486_field_stationarity']
          assert not sf['scope']['global_orbit_uniqueness'] and not sf['scope']['G3_closed']
          assert sh['n_failed']==0 and sh['flag']['chiral_H_exact_stationary_candidate_constructed']
          assert sh['flag']['full_quartic_BFB_certified'] and not sh['flag']['full_global_minimum_certified']
          assert sh['chiral_H_candidate']['exact_orbit']['SO10_plus_U1X_plus_PQ_rank']==38
          assert sh['live_full_gradient_and_quotient_Hessian']['transverse_dimension']==448
          assert not sh['live_full_gradient_and_quotient_Hessian']['proof_grade']
          assert shx['status']=='EXACT_FULL_HESSIAN_RANK_448_NULLITY_38_CERTIFIED'
          assert shx['overall_state']=='CLOSED_FULL_LOCAL_HESSIAN_SUBPROBLEM'
          assert all(shx['flags'][name] for name in ('exact_rank_448','exact_nullity_38','exact_PSD','strict_quotient','proof_grade','source_binding'))
          assert not shx['G3_closed']
          assert sp['n_failed']==0 and sp['status']=='LITERAL_SINGLE_ORBIT_LEMMA_REFUTED__SIGNED_GLOBAL_LEMMA_OPEN'
          assert sp['scope']['literal_plus_orbit_only_statement_refuted']
          assert not sp['scope']['corrected_signed_two_orbit_theorem_proved']
          assert not sp['scope']['G3_closed']
          assert spl['n_failed']==0 and spl['status']=='EXACT_LOCAL_COMPONENT_THEOREM_CLOSED__DISTANT_COMPONENTS_OPEN'
          assert spl['scope']['signed_orbit_locally_isolated']
          assert not spl['scope']['disconnected_distant_components_excluded']
          assert not spl['scope']['G3_closed']
          assert ssu3['n_failed']==0 and ssu3['status']=='EXACT_COMPLETE_SU3_FIXED_SLICE_CLASSIFIED__GENERIC_GLOBAL_OPEN'
          assert ssu3['scope']['complete_16_real_dimensional_SU3_fixed_space_classified']
          assert ssu3['scope']['all_nonzero_slice_solutions_are_signed_Kahler_squares']
          assert not ssu3['scope']['corrected_signed_global_orbit_theorem_proved']
          assert se['n_failed']==0 and not se['remaining_global_lemma']['proved']
          assert not se['scope']['global_equality_orbit_classification_complete']
          assert sg['n_failed']==0 and not sg['flags']['lower_witness_found']
          assert not sg['flags']['beta_1_over_20_global_minimum_certified']
          assert not sg['final_acceptance_test']['currently_passes']
          assert sff['n_failed']==0 and sff['status']=='EXACT_FIXED_F_FULL_OFFKERNEL_BETA_GAP_CERTIFIED'
          assert sff['scope']['global_gap_nonnegative_on_full_fixed_F_stratum']
          assert sff['checks']['full_fixed_F_equality_orbit_exact']
          assert sff['scope']['equality_is_selected_SU5_flag_orbit']
          assert not sff['scope']['arbitrary_Phi_proved']
          assert max_negative['n_failed']==0, max_negative['failures']
          assert max_negative['status']=='EXACT_PURE_DELTA_MAX_NEGATIVE_MIXED_ZERO_ROUTE_EXCLUDED'
          assert max_negative['overall_state']=='CLOSED_PURE_DELTA_MAX_NEGATIVE_MIXED_ZERO_STRATUM__ARBITRARY_PHI_OPEN'
          assert max_negative['model_contract_id']=='gauged_u1x_phi17_v20'
          assert max_negative['scope']['strongest_all_zero_max_negative_route_excluded'] is True
          assert max_negative['scope']['strongest_pure_Delta_mixed_zero_max_negative_route_excluded'] is True
          assert max_negative['scope']['normalized_affine_stratum_requires_u_gt_0_v_gt_0'] is True
          assert max_negative['scope']['u_zero_and_v_zero_boundaries_closed_separately'] is True
          assert max_negative['checks']['live_HSX_and_PD_coefficients_bound_exactly'] is True
          assert max_negative['checks']['N_and_C00_C11_contraction_identities_computed_exactly'] is True
          assert max_negative['checks']['u_zero_and_v_zero_radial_boundaries_closed_exactly'] is True
          assert max_negative['scope']['nonzero_residual_cancellations_excluded'] is False
          assert max_negative['scope']['arbitrary_Phi_global_gap_proved'] is False
          assert max_negative['scope']['G3_closed'] is False
          assert max_negative_full['n_failed']==0, max_negative_full['failures']
          assert max_negative_full['status']=='EXACT_MAX_NEGATIVE_FULL_RESIDUAL_PURE_DELTA_BOUND_CERTIFIED'
          assert max_negative_full['overall_state']=='CLOSED_MAX_NEGATIVE_PURE_DELTA_ARBITRARY_PHI_SUBPROBLEM'
          assert max_negative_full['model_contract_id']=='gauged_u1x_phi17_v20'
          assert max_negative_full['scope']['Phi_arbitrary_real_210'] is True
          assert max_negative_full['scope']['nonzero_Phi_Sigma_residuals_covered'] is True
          assert max_negative_full['scope']['nonzero_chiral_Phi_H_residual_covered'] is True
          assert max_negative_full['scope']['restricted_gap_global_minimum']=='1/5000'
          assert max_negative_full['scope']['arbitrary_Sigma_orientation_proved'] is False
          assert max_negative_full['scope']['G3_closed'] is False
          assert rank1_su3['n_failed']==0 and rank1_su3['failed_checks']==[]
          assert rank1_su3['status']=='EXACT_RANK1_SU3_DANGEROUS_SLICE_BOUND_CERTIFIED'
          assert rank1_su3['overall_state']=='CLOSED_RANK1_SU3_SLICE__ARBITRARY_RANK1_PHI_OPEN'
          assert rank1_su3['model_contract_id']=='gauged_u1x_phi17_v20'
          assert rank1_su3['scope']['H_fixed_to_h_minus'] is True
          assert rank1_su3['scope']['Phi_restricted_to_four_real_SU3_fixed_variables'] is True
          assert rank1_su3['scope']['Phi_slice_real_dimension']==4
          assert rank1_su3['scope']['full_SU3_fixed_space_real_dimension']==16
          assert rank1_su3['scope']['full_SU3_fixed_space_proved'] is False
          assert rank1_su3['scope']['arbitrary_real_Phi'] is False
          assert rank1_su3['scope']['arbitrary_max_negative_Sigma'] is False
          assert rank1_su3['scope']['G3_closed'] is False
          assert rank1_su3['scope']['whole_model_excluded'] is False
          assert rank1_su3['checks']['arbitrary_rank1_Phi_proved'] is False
          assert rank1_su3['checks']['arbitrary_Sigma35_proved'] is False
          assert rank1_su3['checks']['G3_closed'] is False
          assert rank1_su3['SOS']['strict_anchor_lower_bound']=='3/200'
          assert rank1_su3['radial_patch']['restricted_global_minimum']=='1/5000'
          assert ag['n_failed']==0 and ag['overall_state']=='G3_GLOBAL_ALTERNATIVE_OPEN'
