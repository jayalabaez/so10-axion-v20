            EXACT_GAUGED_U1X_G3_A_SQUARE_RECOUPLING_V20.md
            EXACT_GAUGED_U1X_G3_SOS_BFB_STATIONARITY_V20.json
            EXACT_GAUGED_U1X_G3_SOS_BFB_STATIONARITY_V20.md
            EXACT_GAUGED_U1X_G3_GLOBAL_COUNTEREXAMPLE_V20.json
            EXACT_GAUGED_U1X_G3_GLOBAL_COUNTEREXAMPLE_V20.md
            EXACT_GAUGED_U1X_G3_KERNEL_QUARTIC_BOUND_V20.json
            EXACT_GAUGED_U1X_G3_KERNEL_QUARTIC_BOUND_V20.md
            EXACT_GAUGED_U1X_G3_REPLACEMENT_STATIONARY_ORBIT_V20.json
            EXACT_GAUGED_U1X_G3_REPLACEMENT_STATIONARY_ORBIT_V20.md
            EXACT_GAUGED_U1X_G3_SU5_DELTA_PD_SOS_V20.json
            EXACT_GAUGED_U1X_G3_SU5_DELTA_PD_SOS_V20.md
            EXACT_GAUGED_U1X_G3_SU5_DELTA_HSX_EXTENSION_V20.json
            EXACT_GAUGED_U1X_G3_SU5_DELTA_HSX_EXTENSION_V20.md
