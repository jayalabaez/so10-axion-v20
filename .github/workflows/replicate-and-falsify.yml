        run: python theory_validation_matrix_v20.py --expect-blocked
      - name: Final honest verdict + ultimate approval gate
        run: |
          python theory_confirmation_verdict_v20.py --expect-blocked
          python ultimate_theory_gate_v20.py --expect-blocked
          python ultimate_theory_gate_v20.py --expect-blocked --no-write
