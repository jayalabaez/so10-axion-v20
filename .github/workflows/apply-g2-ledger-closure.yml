name: apply-g2-ledger-closure

on:
  push:
    branches:
      - agent/g2-complete-remaining-five
    paths:
      - scripts/apply_g2_ledger_closure.py
      - .github/workflows/apply-g2-ledger-closure.yml

permissions:
  contents: write

concurrency:
  group: apply-g2-ledger-closure
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply fail-closed 18-family ledger integration
        run: python scripts/apply_g2_ledger_closure.py
      - name: Compile patched integration files
        run: |
          python -m py_compile \
            live_g2_derivative_coverage_ledger_v20.py \
            test_live_g2_derivative_coverage_ledger_v20.py
      - name: Remove temporary patch and snapshot infrastructure
        run: |
          git rm scripts/apply_g2_ledger_closure.py
          git rm .github/workflows/apply-g2-ledger-closure.yml
          git rm -f .github/workflows/g2-current-source-snapshot.yml
      - name: Commit integrated G2 closure gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            live_g2_derivative_coverage_ledger_v20.py \
            test_live_g2_derivative_coverage_ledger_v20.py \
            .github/workflows/live-g2-derivative-coverage-ledger.yml
          git commit -m "Integrate all 18 exact G2 derivative families"
          git push origin HEAD:${GITHUB_REF_NAME}
