name: selected-vacuum-dim7-high-complexity-wave1

on:
  pull_request:
    paths:
      - selected_vacuum_dim7_high_complexity_wave1_v20.py
      - test_selected_vacuum_dim7_high_complexity_wave1_v20.py
      - .github/workflows/selected-vacuum-dim7-high-complexity-wave1.yml
  workflow_dispatch:

concurrency:
  group: selected-vacuum-dim7-high-wave1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dim7-high-wave1-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile high-complexity wave 1
        run: |
          python -m compileall -q \
            selected_vacuum_dim7_high_complexity_wave1_v20.py \
            test_selected_vacuum_dim7_high_complexity_wave1_v20.py
      - name: Execute high-complexity wave 1
        run: python selected_vacuum_dim7_high_complexity_wave1_v20.py --write
      - name: Verify generated report
        run: python -m unittest -v test_selected_vacuum_dim7_high_complexity_wave1_v20.py
      - name: Assert honest result
        run: |
          python - <<'PY'
          import json
          r=json.load(open('SELECTED_VACUUM_DIM7_HIGH_COMPLEXITY_WAVE1_V20.json'))
          w=r['wave1']; f=r['flags']
          assert r['n_failed']==0 and r['overall_state']=='BLOCKED', r
          assert len(w['representatives'])==2, r
          assert w['total_metric_graphs']==11934, r
          assert w['total_graph_coefficient_evaluations']==11934, r
          assert len(r['remaining_high_complexity_representatives'])==3, r
          assert f['wave1_complete'], r
          assert f['nonzero_dimension7_phase_channel_found']==bool(w['nonzero_representatives']), r
          assert not f['stationarity_rebuilt'], r
          assert not f['selected_vacuum_fully_stabilized'], r
          assert not f['whole_model_validated'], r
          assert not f['whole_model_excluded'], r
          for row in w['nonzero_representatives']:
              assert row['maximum_abs_coefficient'] > 1e-10, row
              for record in row['phase_rank_records']:
                  assert record['rank_with_kappa']==2, record
                  assert record['null_is_PQ_1_1_minus2'], record
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-vacuum-dim7-high-complexity-wave1
          path: |
            SELECTED_VACUUM_DIM7_HIGH_COMPLEXITY_WAVE1_V20.json
            SELECTED_VACUUM_DIM7_HIGH_COMPLEXITY_WAVE1_V20.md
