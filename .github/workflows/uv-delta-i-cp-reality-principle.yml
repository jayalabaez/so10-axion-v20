name: uv-delta-i-cp-reality-principle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  uv-delta-i-cp-reality-principle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute δ_i UV principle
        run: python uv_delta_i_cp_reality_principle_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_uv_delta_i_cp_reality_principle_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('DELTA_I_UV_PRINCIPLE_V20_VERDICT.json'))
          assert r['status']=='DELTA_I_FIXED_UNDER_CP_REALITY__SOFT_SCALE_AND_TAU_OPEN'
          assert r['n_failed']==0
          assert r['rephasing']['rank']==2
          assert r['rephasing']['n_physical_continuous']==1
          assert r['rephasing']['all_demos_ok']
          assert abs(r['uv_principle']['selected']['delta_phys'])<1e-15
          assert r['uv_principle']['selected']['cp_conserving']
          assert r['flag']['unique_delta_i_under_cp_reality_principle']
          assert not r['flag']['unique_delta_i_model_independent']
          assert not r['flag']['unique_soft_scale']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload δ_i UV principle verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uv-delta-i-cp-reality-principle-verdict
          path: |
            DELTA_I_UV_PRINCIPLE_V20_VERDICT.json
            DELTA_I_UV_PRINCIPLE_V20.md
