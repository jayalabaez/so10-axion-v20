name: SUSY V36 redesign campaign

on:
  push:
    paths:
      - "susy_v36_redesign_campaign.py"
      - "test_susy_v36_redesign_campaign.py"
      - "SUSY_V36_REDESIGN_CAMPAIGN.json"
      - "SUSY_V36_REDESIGN_CAMPAIGN.md"
      - "SUSY_V36_G1_EFT_CANDIDATE.json"
      - "SUSY_V36_VACUUM_QUALITY_CONTRACT.json"
      - "SUSY_V36_MATCHING_CONTRACT.json"
      - "SUSY_V36_G1_G8_GATE_LEDGER.json"
      - "SUSY_V36_SARAH_RGE_ATTESTATION.json"
      - "models/PSZ4RZ66SUSYV36/**"
      - "tools/validate-susy-v36-redesign.wls"
      - ".github/workflows/susy-v36-redesign.yml"
  pull_request:
    paths:
      - "susy_v36_redesign_campaign.py"
      - "test_susy_v36_redesign_campaign.py"
      - "SUSY_V36_REDESIGN_CAMPAIGN.json"
      - "SUSY_V36_REDESIGN_CAMPAIGN.md"
      - "SUSY_V36_G1_EFT_CANDIDATE.json"
      - "SUSY_V36_VACUUM_QUALITY_CONTRACT.json"
      - "SUSY_V36_MATCHING_CONTRACT.json"
      - "SUSY_V36_G1_G8_GATE_LEDGER.json"
      - "SUSY_V36_SARAH_RGE_ATTESTATION.json"
      - "models/PSZ4RZ66SUSYV36/**"
      - "tools/validate-susy-v36-redesign.wls"
      - ".github/workflows/susy-v36-redesign.yml"
  workflow_dispatch:

jobs:
  verify-v36:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -B susy_v36_redesign_campaign.py --check
      - run: python -m pytest -q test_susy_v36_redesign_campaign.py
