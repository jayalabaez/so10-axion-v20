name: exact-phisigma-all-component-projectors

on:
  pull_request:
    paths:
      - 'exact_phisigma_all_component_projectors_v20.py'
      - 'test_exact_phisigma_all_component_projectors_v20.py'
      - '.github/workflows/exact-phisigma-all-component-projectors.yml'
  push:
    branches: [main]
    paths:
      - 'exact_phisigma_all_component_projectors_v20.py'
      - 'test_exact_phisigma_all_component_projectors_v20.py'
      - '.github/workflows/exact-phisigma-all-component-projectors.yml'
  workflow_dispatch:

jobs:
  exact-phisigma-all-component-projectors:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath pytest

      - name: Compile all-component modules
        run: >-
          python -m py_compile
          exact_phisigma_all_component_projectors_v20.py
          test_exact_phisigma_all_component_projectors_v20.py

      - name: Run arbitrary-component and full-operator tests
        run: >-
          python -m pytest -q
          test_exact_phisigma_all_component_projectors_v20.py

      - name: Generate all-component certificate
        run: python exact_phisigma_all_component_projectors_v20.py

      - name: Assert all-component closure and fail-closed scope
        run: |
          python - <<'PY'
          import json

          report = json.load(open('EXACT_PHISIGMA_ALL_COMPONENT_PROJECTORS_V20.json'))
          assert report['n_failed'] == 0, report['failures']
          assert report['full_126_background_certificate']['coefficient_matrix_count'] == 36
          assert report['flag']['all_PhiSigma_quartic_all_component_Clebsches_complete'] is True
          assert report['flag']['complete_component_potential'] is False
          assert report['flag']['unique_full_vacuum'] is False
          assert report['flag']['physical_full_Hessian_complete'] is False
          assert report['flag']['physical_threshold_spectrum_complete'] is False
          assert report['flag']['exact_unique_proton_lifetime'] is False
          assert report['flag']['whole_model_validated'] is False
          assert report['flag']['empirical_discovery'] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exact-phisigma-all-component-projectors
          path: |
            EXACT_PHISIGMA_ALL_COMPONENT_PROJECTORS_V20.json
            EXACT_PHISIGMA_ALL_COMPONENT_PROJECTORS_V20.md
            EXACT_PHISIGMA_ALL_COMPONENT_PROJECTORS_V20.npz
