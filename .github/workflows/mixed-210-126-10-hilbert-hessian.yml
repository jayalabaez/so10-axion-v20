name: mixed-210-126-10-hilbert-hessian

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mixed-210-126-10-hilbert-hessian:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute mixed 210–126–10 Hilbert Hessian fill
        run: python mixed_210_126_10_hilbert_hessian_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_mixed_210_126_10_hilbert_hessian_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('MIXED_210_126_10_HILBERT_HESSIAN_V20_VERDICT.json'))
          assert r['status']=='MIXED_210_126_10_COMPLETE_AT_HILBERT__PQ_NULLS_DOCUMENTED'
          assert r['n_failed']==0
          assert r['mixed_spectra']['n_blocks']==7
          assert r['mixed_spectra']['all_physical_positive']
          assert r['mixed_spectra']['n_pq_null_modes']>=1
          assert r['flag']['mixed_210_126_10_complete']
          assert r['flag']['pq_gamma_set_to_zero']
          assert not r['flag']['live_sarah_or_pyrate_executable_run']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload mixed Hilbert Hessian verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixed-210-126-10-hilbert-hessian-verdict
          path: |
            MIXED_210_126_10_HILBERT_HESSIAN_V20_VERDICT.json
            MIXED_210_126_10_HILBERT_HESSIAN_V20.md
