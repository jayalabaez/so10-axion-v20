name: mixed-210-126-10-cw

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mixed-210-126-10-cw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute mixed 210-126-10 CW
        run: python mixed_210_126_10_cw_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_mixed_210_126_10_cw_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('MIXED_210_126_10_CW_V20_VERDICT.json'))
          assert r['status']=='MIXED_210_126_10_MASSES_IN_CW__G_SINGLET_AND_FERMION_OPEN'
          assert r['n_failed']==0
          assert r['spectra']['n_blocks']==6
          assert r['flag']['mixed_210_126_10_in_cw']
          assert r['flag']['E_F_J_X_included']
          assert r['flag']['one_loop_stability_conditional']
          assert not r['flag']['g_singlet_6x6_complete']
          assert not r['flag']['fermion_tower_complete']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload mixed CW verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixed-210-126-10-cw-verdict
          path: |
            MIXED_210_126_10_CW_V20_VERDICT.json
            MIXED_210_126_10_CW_V20.md
