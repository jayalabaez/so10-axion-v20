name: mixed-210-126-10-cw

on:
  workflow_dispatch:

concurrency:
  group: mixed-210-126-10-cw-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mixed-210-126-10-cw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute mixed 210-126-10 CW
        run: python mixed_210_126_10_cw_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_mixed_210_126_10_cw_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('MIXED_210_126_10_CW_V20_VERDICT.json'))
          assert r['status']=='AULAKH_EFJX_SOURCE_CORRECTED__SCALAR_CW_WITHDRAWN', r['status']
          assert r['n_failed']==0
          assert r['spectra']['n_blocks']==4
          assert r['flag']['scalar_CW_contribution_withdrawn']
          assert r['flag']['incorrect_gamma_alias_removed']
          assert r['flag']['E_F_J_X_gauge_gaugino_diagnostic_only']
          assert r['flag']['direct_nonsusy_hessian_required']
          assert not r['flag']['mixed_210_126_10_in_cw']
          assert not r['flag']['E_F_J_X_included']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          assert not r['flag']['whole_model_validated']
          PY
      - name: Upload mixed CW verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixed-210-126-10-cw-verdict
          path: |
            MIXED_210_126_10_CW_V20_VERDICT.json
            MIXED_210_126_10_CW_V20.md
