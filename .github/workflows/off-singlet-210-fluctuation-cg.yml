name: off-singlet-210-fluctuation-cg

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  off-singlet-210-fluctuation-cg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute off-singlet 210 fluctuation CG
        run: python off_singlet_210_fluctuation_cg_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_off_singlet_210_fluctuation_cg_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('OFF_SINGLET_210_FLUCTUATION_CG_V20_VERDICT.json'))
          assert r['status']=='OFF_SINGLET_210_FLUCTUATION_CG_THRESHOLDS_BUILT__MIXED_126_10_OPEN'
          assert r['n_failed']==0
          assert len(r['unmixed_210_thresholds'])==8
          assert len(r['mixed_R_octet']['masses_GeV'])==2
          assert r['flag']['off_singlet_fluctuation_cg_thresholds']
          assert r['flag']['aulakh_table1_unmixed_transcribed']
          assert not r['flag']['mixed_210_126_10_complete']
          assert not r['flag']['full_oscillator_basis']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload off-singlet 210 CG verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: off-singlet-210-fluctuation-cg-verdict
          path: |
            OFF_SINGLET_210_FLUCTUATION_CG_V20_VERDICT.json
            OFF_SINGLET_210_FLUCTUATION_CG_V20.md
