name: live-g2-corrected-value-layer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - live_g2_arbitrary_component_potential_values_v20.py
      - test_live_g2_arbitrary_component_potential_values_v20.py
      - live_g2_component_potential_v20.py
      - test_live_g2_component_potential_v20.py
      - live_g2_pr155_correction_audit_v20.py
      - test_live_g2_pr155_correction_audit_v20.py
      - live_g1_g8_gate_ledger_v20.py
      - test_live_g1_g8_gate_ledger_v20.py
      - live_g1_tensor_closure_ledger_v20.py
      - .github/workflows/live-g2-component-potential.yml
  push:
    branches: [main]
    paths:
      - live_g2_arbitrary_component_potential_values_v20.py
      - test_live_g2_arbitrary_component_potential_values_v20.py
      - live_g2_component_potential_v20.py
      - test_live_g2_component_potential_v20.py
      - live_g2_pr155_correction_audit_v20.py
      - test_live_g2_pr155_correction_audit_v20.py
      - live_g1_g8_gate_ledger_v20.py
      - test_live_g1_g8_gate_ledger_v20.py
      - .github/workflows/live-g2-component-potential.yml

jobs:
  live-g2-corrected-value-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest mpmath
      - name: Compile corrected G2, audit, and ledger
        run: |
          python -m py_compile \
            live_g2_arbitrary_component_potential_values_v20.py \
            test_live_g2_arbitrary_component_potential_values_v20.py \
            live_g2_component_potential_v20.py \
            test_live_g2_component_potential_v20.py \
            live_g2_pr155_correction_audit_v20.py \
            test_live_g2_pr155_correction_audit_v20.py \
            live_g1_g8_gate_ledger_v20.py \
            test_live_g1_g8_gate_ledger_v20.py
      - name: Run corrected value-layer, audit, and ledger tests
        run: |
          python -m pytest -q \
            test_live_g2_arbitrary_component_potential_values_v20.py \
            test_live_g2_component_potential_v20.py \
            test_live_g2_pr155_correction_audit_v20.py \
            test_live_g1_g8_gate_ledger_v20.py
      - name: Generate corrected certificates
        run: |
          python live_g2_arbitrary_component_potential_values_v20.py --write
          python live_g2_component_potential_v20.py --write
          python live_g2_pr155_correction_audit_v20.py --write
          python live_g1_g8_gate_ledger_v20.py
      - name: Assert fail-closed scope
        run: |
          python - <<'PY'
          import json

          values=json.load(open('LIVE_G2_ARBITRARY_COMPONENT_POTENTIAL_VALUES_V20.json'))
          assert values['n_failed']==0, values['failures']
          assert values['counts']=={
              'Hermitian_orbits':48,
              'invariant_directions':64,
              'real_parameters':91,
              'base_families':18,
          }, values['counts']
          assert values['flags']['all_64_arbitrary_component_values_callable']
          assert values['flags']['real_Hermitian_potential_assembled']
          assert not values['flags']['field_gradient_complete']
          assert not values['flags']['field_Hessian_complete']
          assert not values['flags']['G2_closed']

          audit=json.load(open('LIVE_G2_PR155_CORRECTION_AUDIT_V20.json'))
          assert audit['n_failed']==0, audit['failures']
          assert audit['flags']['PR155_G2_closed_claim_rejected']
          assert audit['derivative_scope']['historical_probe_dimension']==8
          assert audit['derivative_scope']['complete_real_field_dimension']==486
          assert audit['derivative_scope']['complete_symmetric_Hessian_entries']==118341
          assert not audit['flags']['G2_closed']

          g2=json.load(open('LIVE_G2_COMPONENT_POTENTIAL_V20.json'))
          assert g2['n_failed']==0, g2['failures']
          assert g2['counts']['complete_real_field_dimension']==486
          assert g2['flags']['g2_value_layer_complete']
          assert not g2['flags']['g2_complete_field_gradient']
          assert not g2['flags']['g2_complete_field_Hessian']
          assert not g2['flags']['g2_closed']
          assert not g2['flags']['g3_closed']
          assert not g2['flags']['whole_model_validated']

          ledger=json.load(open('LIVE_G1_G8_GATE_LEDGER_V20.json'))
          assert ledger['n_failed']==0, ledger['failures']
          assert ledger['summary']['closed']==['G1']
          assert ledger['gates']['G2']['status']=='PARTIAL'
          assert ledger['gates']['G2']['corrections']['complete_real_field_dimension']==486
          assert not ledger['flags']['g2_closed']
          assert not ledger['flags']['whole_model_validated']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-g2-corrected-value-layer
          path: |
            LIVE_G2_ARBITRARY_COMPONENT_POTENTIAL_VALUES_V20.json
            LIVE_G2_ARBITRARY_COMPONENT_POTENTIAL_VALUES_V20.md
            LIVE_G2_COMPONENT_POTENTIAL_V20.json
            LIVE_G2_COMPONENT_POTENTIAL_V20.md
            LIVE_G2_PR155_CORRECTION_AUDIT_V20.json
            LIVE_G2_PR155_CORRECTION_AUDIT_V20.md
            LIVE_G1_G8_GATE_LEDGER_V20.json
            LIVE_G1_G8_GATE_LEDGER_V20.md
