name: literature-cg-triplet-matrix

on:
  workflow_dispatch:

concurrency:
  group: literature-cg-triplet-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  literature-cg-triplet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute literature CG triplet matrices
        run: python literature_cg_triplet_matrix_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_literature_cg_triplet_matrix_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('LITERATURE_CG_TRIPLET_MATRIX_V20_VERDICT.json'))
          assert r['status']=='LITERATURE_CG_TRIPLET_MATRICES_TRANSCRIBED__NONSUSY_POTENTIAL_OPEN'
          assert r['n_failed']==0
          assert r['flag']['literature_cg_transcribed']
          assert r['flag']['aulakh_cal_T_implemented']
          assert r['flag']['fukuyama_su5_M_triplet_implemented']
          assert not r['flag']['invented_unpublished_tensors']
          assert not r['flag']['identified_with_v20_nonsusy_potential']
          assert not r['flag']['complete_so10_scalar_potential']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          assert r['n_excluded_by_ps_mu_K0'] < r['n_scenarios']
          PY
      - name: Upload literature CG verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: literature-cg-triplet-matrix-verdict
          path: |
            LITERATURE_CG_TRIPLET_MATRIX_V20_VERDICT.json
            LITERATURE_CG_TRIPLET_MATRIX_V20.md
