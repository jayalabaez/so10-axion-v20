name: exact-126bar-self-quartic-basis

on:
  push:
    branches:
      - agent/complete-126bar-self-quartic-basis
  pull_request:
    paths:
      - exact_126bar_self_quartic_basis_v20.py
      - test_exact_126bar_self_quartic_basis_v20.py
      - .github/workflows/exact-126bar-self-quartic-basis.yml
  workflow_dispatch:

jobs:
  exact-126bar-self-quartic-basis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile exact gate
        run: python -m py_compile exact_126bar_self_quartic_basis_v20.py test_exact_126bar_self_quartic_basis_v20.py
      - name: Run representation and Hessian tests
        run: python -m pytest -q test_exact_126bar_self_quartic_basis_v20.py
      - name: Generate authoritative certificate
        run: python exact_126bar_self_quartic_basis_v20.py > /tmp/exact-126bar-self-quartic.log
      - name: Assert exact count, no-go and fail-closed scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('EXACT_126BAR_SELF_QUARTIC_BASIS_V20.json').read_text())
          assert report['n_failed'] == 0, report['failures']
          assert report['representation_result']['n_charge_neutral_self_quartics'] == 4
          assert report['delta_R_Hessian_audit']['obstruction_36_multiplicity'] == 36
          assert report['delta_R_Hessian_audit']['obstruction_2_multiplicity'] == 2
          assert report['flag']['mixed_210_126bar_channels_required'] is True
          assert report['flag']['complete_multifield_potential'] is False
          assert report['flag']['whole_model_validated'] is False
          assert report['flag']['empirical_discovery'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exact-126bar-self-quartic-basis
          path: |
            EXACT_126BAR_SELF_QUARTIC_BASIS_V20.json
            EXACT_126BAR_SELF_QUARTIC_BASIS_V20.md
