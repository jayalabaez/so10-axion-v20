name: live-g2-exact-phi-cubic-derivatives

on:
  workflow_dispatch:
  pull_request:
    paths:
      - live_g2_exact_phi_cubic_derivatives_v20.py
      - test_live_g2_exact_phi_cubic_derivatives_v20.py
      - live_g2_canonical_486_field_chart_v20.py
      - live_g2_arbitrary_component_potential_values_v20.py
      - .github/workflows/live-g2-exact-phi-cubic-derivatives.yml
  push:
    branches: [main]
    paths:
      - live_g2_exact_phi_cubic_derivatives_v20.py
      - test_live_g2_exact_phi_cubic_derivatives_v20.py
      - live_g2_canonical_486_field_chart_v20.py
      - live_g2_arbitrary_component_potential_values_v20.py
      - .github/workflows/live-g2-exact-phi-cubic-derivatives.yml

jobs:
  exact-phi-cubic-derivatives:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest mpmath
      - name: Compile exact cubic derivative adapter
        run: |
          python -m py_compile \
            live_g2_exact_phi_cubic_derivatives_v20.py \
            test_live_g2_exact_phi_cubic_derivatives_v20.py
      - name: Run exact cubic derivative tests
        run: python -m pytest -q test_live_g2_exact_phi_cubic_derivatives_v20.py
      - name: Generate certificate
        run: python live_g2_exact_phi_cubic_derivatives_v20.py --write
      - name: Assert exact coverage and fail-closed scope
        run: |
          python - <<'PY'
          import json
          d=json.load(open('LIVE_G2_EXACT_PHI_CUBIC_DERIVATIVES_V20.json'))
          assert d['n_failed']==0, d['failures']
          assert d['coverage']['base_family']=='B08_phi_cubic'
          assert d['coverage']['direction_count']==1
          assert d['coverage']['base_families_closed_total']==7
          assert d['coverage']['base_families_total']==18
          assert d['singlet_formula_audit']['operator_authoritative_residual'] < 1e-12
          assert d['singlet_formula_audit']['operator_formula_residual'] < 1e-12
          assert d['directional_reconstruction']['value_residual'] < 1e-9
          assert d['directional_reconstruction']['first_residual'] < 1e-8
          assert d['directional_reconstruction']['second_residual'] < 1e-7
          assert d['flags']['B08_derivative_adapter_closed']
          assert not d['flags']['all_64_direction_gradients_complete']
          assert not d['flags']['all_64_direction_Hessians_complete']
          assert not d['flags']['G2_closed']
          assert not d['flags']['whole_model_validated']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-g2-exact-phi-cubic-derivatives
          path: |
            LIVE_G2_EXACT_PHI_CUBIC_DERIVATIVES_V20.json
            LIVE_G2_EXACT_PHI_CUBIC_DERIVATIVES_V20.md
