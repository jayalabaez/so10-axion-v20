name: hodge-126bar-c-embedding-portal-lift

on:
  workflow_dispatch:

concurrency:
  group: hodge-126bar-c-embedding-portal-lift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hodge-embed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute Hodge C-embedding and portal lift
        run: python hodge_126bar_c_embedding_portal_lift_v20.py --write
      - name: Focused regression tests
        run: python -m unittest -v test_hodge_126bar_c_embedding_portal_lift_v20.py
      - name: Assert embedding and honesty flags
        run: |
          python - <<'PY'
          import json
          r=json.load(open('HODGE_126BAR_C_EMBEDDING_PORTAL_LIFT_V20.json'))
          assert r['n_failed']==0, r
          assert abs(r['frame']['trace_P_126bar']-252.0)<1e-6
          assert r['delta_r_check']['in_physical_subspace']
          assert r['portal']['inserted']
          assert not r['flags']['im_H_in_orbit_embedding']
          assert not r['flags']['full_component_hessian_complete']
          assert not r['flags']['whole_model_validated']
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hodge-126bar-c-embedding-portal-lift
          path: |
            HODGE_126BAR_C_EMBEDDING_PORTAL_LIFT_V20.json
            HODGE_126BAR_C_EMBEDDING_PORTAL_LIFT_V20.md
