name: lambda-lock-cal-g-lift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lambda-lock-cal-g-lift:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute λ_lock cal G lift
        run: python lambda_lock_cal_g_lift_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_lambda_lock_cal_g_lift_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('LAMBDA_LOCK_CAL_G_LIFT_V20_VERDICT.json'))
          assert r['status']=='LAMBDA_LOCK_CAL_G_LIFT_EXECUTED__TAU_P_OPEN'
          assert r['n_failed']==0
          assert r['flag']['selected_lambda_lock_raised_to_cal_G_lift']
          assert r['flag']['cal_G_soft_mode_cleared_at_raised_lock']
          assert r['flag']['selected_point_not_spoiled_by_lock_raise']
          assert abs(r['couplings']['lambda_lock_raised']) >= r['couplings']['lambda_lock_crit_abs']
          assert r['flag']['selected_lam4_still_below_gut_null_tol']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload λ_lock cal G lift verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lambda-lock-cal-g-lift-verdict
          path: |
            LAMBDA_LOCK_CAL_G_LIFT_V20_VERDICT.json
            LAMBDA_LOCK_CAL_G_LIFT_V20.md
