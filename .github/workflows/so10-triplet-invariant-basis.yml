name: so10-triplet-invariant-basis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  triplet-invariant-basis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute triplet / invariant-basis ledger
        run: python so10_triplet_invariant_basis_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_so10_triplet_invariant_basis_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('SO10_TRIPLET_INVARIANT_BASIS_V20_VERDICT.json'))
          assert r['status']=='SO10_TRIPLET_INVARIANT_BASIS_STRUCTURED__FULL_TENSORS_OPEN'
          assert r['n_failed']==0
          assert r['flag']['invariant_ledger_recorded']
          assert not r['flag']['complete_so10_scalar_potential']
          assert not r['flag']['hilbert_series_complete']
          assert not r['flag']['numeric_triplet_spectrum_derived']
          assert not r['flag']['exact_scalar_proton_decay']
          assert not r['flag']['whole_model_excluded']
          assert r['symbolic_triplet_mass_matrix']['eigenvalues_GeV'] is None
          assert r['conditional_bound_map']['conditional_exclusions']['M_T_equals_M_I_and_y_eff_1e-4']
          PY
      - name: Upload triplet / invariant-basis verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: so10-triplet-invariant-basis-verdict
          path: |
            SO10_TRIPLET_INVARIANT_BASIS_V20_VERDICT.json
            SO10_TRIPLET_INVARIANT_BASIS_V20.md
