name: tau-p-uv-vacuum-selection

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tau-p-uv-vacuum-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute τ_p UV vacuum-selection certificate
        run: python tau_p_uv_vacuum_selection_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_tau_p_uv_vacuum_selection_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('TAU_P_UV_VACUUM_SELECTION_V20_VERDICT.json'))
          assert r['status']=='TAU_P_UNIQUE_UNDER_REDUCED_UV_SELECTION__EXACT_UNIQUE_OPEN'
          assert r['n_failed']==0
          assert r['certificate']['selected_tau_e_years'] > 0
          assert r['certificate']['selected_passes_SK']
          assert r['flag']['tau_p_unique_under_reduced_uv_vacuum_selection']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          assert r['certificate']['residual_open']['exact_XY_mass_from_full_scalar_vacuum']
          PY
      - name: Upload τ_p vacuum-selection verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tau-p-uv-vacuum-selection-verdict
          path: |
            TAU_P_UV_VACUUM_SELECTION_V20_VERDICT.json
            TAU_P_UV_VACUUM_SELECTION_V20.md
