name: exact-hsigma-hermitian-family

on:
  pull_request:
    paths:
      - 'two_loop_thresholds_v20.py'
      - 'test_two_loop_thresholds_source_only_v20.py'
      - 'test_signed_triplet_chain_source_only_v20.py'
      - 'exact_hsigma_hermitian_family_closure_v20.py'
      - 'test_exact_hsigma_hermitian_family_closure_v20.py'
      - 'next_gen_triplet_hsigma_hermitian_family_gate_v20.py'
      - 'test_next_gen_triplet_hsigma_hermitian_family_gate_v20.py'
      - 'triplet_proxy_contamination_audit_v20.py'
      - '.github/workflows/exact-hsigma-hermitian-family.yml'
  push:
    branches: [main]
    paths:
      - 'two_loop_thresholds_v20.py'
      - 'test_two_loop_thresholds_source_only_v20.py'
      - 'test_signed_triplet_chain_source_only_v20.py'
      - 'exact_hsigma_hermitian_family_closure_v20.py'
      - 'test_exact_hsigma_hermitian_family_closure_v20.py'
      - 'next_gen_triplet_hsigma_hermitian_family_gate_v20.py'
      - 'test_next_gen_triplet_hsigma_hermitian_family_gate_v20.py'
      - 'triplet_proxy_contamination_audit_v20.py'
      - '.github/workflows/exact-hsigma-hermitian-family.yml'
  workflow_dispatch:

jobs:
  exact-hsigma-hermitian-family:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pytest

      - name: Compile exact family modules
        run: >-
          python -m py_compile
          two_loop_thresholds_v20.py
          test_two_loop_thresholds_source_only_v20.py
          test_signed_triplet_chain_source_only_v20.py
          exact_hsigma_hermitian_family_closure_v20.py
          next_gen_triplet_hsigma_hermitian_family_gate_v20.py
          test_exact_hsigma_hermitian_family_closure_v20.py
          test_next_gen_triplet_hsigma_hermitian_family_gate_v20.py

      - name: Run exact family and source-only chain tests
        run: >-
          python -m pytest -q
          test_two_loop_thresholds_source_only_v20.py
          test_signed_triplet_chain_source_only_v20.py
          test_exact_hsigma_hermitian_family_closure_v20.py
          test_next_gen_triplet_hsigma_hermitian_family_gate_v20.py

      - name: Generate exact family reports
        run: |
          python two_loop_thresholds_v20.py
          python exact_hsigma_hermitian_family_closure_v20.py
          python next_gen_triplet_hsigma_hermitian_family_gate_v20.py

      - name: Assert closure and fail-closed scope
        run: |
          python - <<'PY'
          import json

          thresholds = json.load(open('two_loop_thresholds_v20.json'))
          exact = json.load(open('EXACT_HSIGMA_HERMITIAN_FAMILY_CLOSURE_V20.json'))
          gate = json.load(open('NEXT_GEN_TRIPLET_HSIGMA_HERMITIAN_FAMILY_GATE_V20.json'))
          anchors = thresholds['regression_anchors']
          assert anchors['MI_one_ok'] and anchors['MGUT_one_ok'] and anchors['IU_one_ok'], anchors
          assert exact['n_failed'] == 0, exact['failures']
          assert gate['n_failed'] == 0, gate['failures']
          assert exact['flag']['all_HSigma_Hermitian_bilinear_quartics_complete'] is True
          assert gate['flag']['complete_HSigma_Hermitian_bilinear_family_inserted'] is True
          for report in (exact, gate):
              assert report['flag']['all_HSigma_invariants_complete'] is False
              assert report['flag']['complete_component_potential'] is False
              assert report['flag']['physical_triplet_spectrum_complete'] is False
              assert report['flag']['exact_unique_proton_lifetime'] is False
              assert report['flag']['whole_model_validated'] is False
              assert report['flag']['empirical_discovery'] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exact-hsigma-hermitian-family
          path: |
            two_loop_thresholds_v20.json
            EXACT_HSIGMA_HERMITIAN_FAMILY_CLOSURE_V20.json
            EXACT_HSIGMA_HERMITIAN_FAMILY_CLOSURE_V20.md
            NEXT_GEN_TRIPLET_HSIGMA_HERMITIAN_FAMILY_GATE_V20.json
            NEXT_GEN_TRIPLET_HSIGMA_HERMITIAN_FAMILY_GATE_V20.md
