name: nonsusy-reduced-hessian

on:
  workflow_dispatch:

concurrency:
  group: nonsusy-reduced-hessian-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nonsusy-reduced-hessian:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Complete reduced BFB operator pair
        run: python mixed_rep_hilbert_bfb_completion_v20.py
      - name: Audit signed SO10 cubics
        run: python so10_cubic_operator_signed_audit_v20.py
      - name: Test signed SO10 cubics
        run: python -m unittest -v test_so10_cubic_operator_signed_audit_v20.py
      - name: Emit signed guaranteed floor34
        run: python mixed_rep_enlarged_floor_basis_v20.py
      - name: Test signed guaranteed floor34
        run: python -m unittest -v test_mixed_rep_enlarged_floor_basis_v20.py
      - name: Execute physical-EW non-SUSY reduced Hessian
        run: python nonsusy_reduced_hessian_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_nonsusy_reduced_hessian_v20.py
      - name: Assert physical scope and historical-point failure
        run: |
          python - <<'PY'
          import json
          c=json.load(open('SO10_CUBIC_OPERATOR_SIGNED_AUDIT_V20.json'))
          b=json.load(open('MIXED_REP_ENLARGED_FLOOR_BASIS_V20.json'))
          r=json.load(open('NONSUSY_REDUCED_HESSIAN_V20_VERDICT.json'))
          assert c['n_failed']==0, c
          assert c['flag']['forbidden_210_10dag10_proved']
          assert c['counts']['net_reduction']==3
          assert b['n_failed']==0, b
          assert b['counts']['mechanical_augmented_total_before_signed_corrections']==37
          assert b['counts']['signed_guaranteed_floor_total']==34
          assert b['flag']['mechanical_floor37_rejected']
          assert b['flag']['canonical_signed_floor_34_emitted']
          assert not b['flag']['full_unfiltered_molien_haar_series']
          assert r['n_failed']==0, r
          assert r['enlarged_basis']['signed_guaranteed_floor_total']==34
          assert r['flag']['signed_floor34_used']
          assert r['flag']['mechanical_floor37_rejected']
          assert r['target_vevs_GeV']['H10_EW']==174.0
          assert r['flag']['physical_electroweak_10_vev_used']
          assert r['flag']['historical_equal_MI_10_vev_rejected']
          assert r['flag']['cross_quartics_from_radial_witness_included']
          assert r['flag']['arbitrary_precision_diagonalization_used']
          assert r['survival_benchmark']['positive_definite']
          assert 120.0 < r['survival_benchmark']['lightest_mass_GeV'] < 130.0
          assert r['historical_benchmark']['tachyonic']
          assert r['flag']['historical_selected_lam4_point_excluded']
          assert r['ew_portal_consistency']['historical_abs_lam4_over_bound'] > 1e25
          assert not r['flag']['uses_aulakh_or_msgut_component_matrices']
          assert not r['flag']['full_component_nonsusy_hessian']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonsusy-reduced-hessian-verdict
          path: |
            SO10_CUBIC_OPERATOR_SIGNED_AUDIT_V20.json
            SO10_CUBIC_OPERATOR_SIGNED_AUDIT_V20.md
            MIXED_REP_HILBERT_BFB_COMPLETION_V20_VERDICT.json
            MIXED_REP_HILBERT_BFB_COMPLETION_V20.md
            MIXED_REP_ENLARGED_FLOOR_BASIS_V20.json
            MIXED_REP_ENLARGED_FLOOR_BASIS_V20.md
            NONSUSY_REDUCED_HESSIAN_V20_VERDICT.json
            NONSUSY_REDUCED_HESSIAN_V20.md
