name: live-g2-exact-portal-family-derivatives

on:
  workflow_dispatch:
  pull_request:
    paths:
      - live_g2_exact_portal_family_derivatives_v20.py
      - test_live_g2_exact_portal_family_derivatives_v20.py
      - live_g2_exact_quadratic_family_derivatives_v20.py
      - live_g2_canonical_486_field_chart_v20.py
      - live_g2_arbitrary_component_potential_values_v20.py
      - .github/workflows/live-g2-exact-portal-family-derivatives.yml
  push:
    branches: [main]
    paths:
      - live_g2_exact_portal_family_derivatives_v20.py
      - test_live_g2_exact_portal_family_derivatives_v20.py
      - live_g2_exact_quadratic_family_derivatives_v20.py
      - live_g2_canonical_486_field_chart_v20.py
      - live_g2_arbitrary_component_potential_values_v20.py
      - .github/workflows/live-g2-exact-portal-family-derivatives.yml

concurrency:
  group: live-g2-portal-derivatives-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-portal-family-derivatives:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile derivative stack
        run: |
          python -m py_compile \
            live_g2_exact_quadratic_family_derivatives_v20.py \
            live_g2_exact_portal_family_derivatives_v20.py \
            test_live_g2_exact_portal_family_derivatives_v20.py
      - name: Run focused tests
        run: |
          python -m pytest -q \
            test_live_g2_exact_quadratic_family_derivatives_v20.py \
            test_live_g2_exact_portal_family_derivatives_v20.py
      - name: Generate portal derivative certificate
        run: python live_g2_exact_portal_family_derivatives_v20.py --write
      - name: Assert exact nonzero scope
        run: |
          python - <<'PY'
          import json

          report=json.load(open('LIVE_G2_EXACT_PORTAL_FAMILY_DERIVATIVES_V20.json'))
          assert report['n_failed']==0, report['failures']
          assert report['coverage']['base_families_closed']==[
              'Phi_Hdag_Sigmadag','Phi_Hdag_Sigma'
          ]
          assert report['coverage']['base_family_count_closed_here']==2
          assert report['coverage']['cumulative_base_family_count_with_parent']==7
          assert report['coverage']['base_family_count_total']==18
          assert report['coverage']['direction_count_closed_here']>0
          assert report['coverage']['parameter_count_closed_here']>0
          assert all(v>0 for v in report['coverage']['expected_direction_counts'].values())
          assert report['coverage']['expected_direction_counts']==report['coverage']['observed_direction_counts']
          assert report['portal_tensor']['shape']==[10,210,126]
          assert report['portal_tensor']['nonzero_entries']>0
          assert report['portal_tensor']['direct_Sigmadag_conjugation_residual']<1e-15
          assert report['maximum_base_support_residual']<1e-12
          assert report['maximum_direction_value_residual']<1e-10
          assert report['maximum_Hessian_asymmetry']<1e-12
          assert report['directional_reconstruction']['value_residual']<1e-9
          assert report['directional_reconstruction']['first_residual']<1e-8
          assert report['directional_reconstruction']['second_residual']<1e-7
          assert report['flags']['two_portal_base_derivative_adapters_closed']
          assert report['flags']['cumulative_seven_of_eighteen_base_adapters_closed']
          assert not report['flags']['all_64_direction_gradients_complete']
          assert not report['flags']['all_64_direction_Hessians_complete']
          assert not report['flags']['G2_closed']
          assert not report['flags']['whole_model_validated']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-g2-exact-portal-family-derivatives
          path: |
            LIVE_G2_EXACT_PORTAL_FAMILY_DERIVATIVES_V20.json
            LIVE_G2_EXACT_PORTAL_FAMILY_DERIVATIVES_V20.md
