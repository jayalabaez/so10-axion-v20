name: next-gen-triplet-portal-norm-square

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "exact_portal_norm_square_triplet_channel_v20.py"
      - "next_gen_triplet_portal_norm_square_gate_v20.py"
      - "test_next_gen_triplet_portal_norm_square_gate_v20.py"
      - "next_gen_triplet_45_channel_gate_v20.py"
      - ".github/workflows/next-gen-triplet-portal-norm-square.yml"
  push:
    branches: [main]
    paths:
      - "exact_portal_norm_square_triplet_channel_v20.py"
      - "next_gen_triplet_portal_norm_square_gate_v20.py"
      - "test_next_gen_triplet_portal_norm_square_gate_v20.py"
      - "next_gen_triplet_45_channel_gate_v20.py"
      - ".github/workflows/next-gen-triplet-portal-norm-square.yml"

concurrency:
  group: next-gen-triplet-portal-norm-square-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-portal-norm-square-nambu-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile exact integration modules
        run: |
          python -m py_compile \
            next_gen_triplet_portal_norm_square_gate_v20.py \
            test_next_gen_triplet_portal_norm_square_gate_v20.py
      - name: Run exact integration tests
        run: python -m unittest -v test_next_gen_triplet_portal_norm_square_gate_v20.py
      - name: Generate exact integration report
        run: python next_gen_triplet_portal_norm_square_gate_v20.py
      - name: Assert insertion and fail-closed scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('NEXT_GEN_TRIPLET_PORTAL_NORM_SQUARE_GATE_V20.json'))
          assert r['n_failed']==0, r['failures']
          assert r['overall_state']=='PARTIAL'
          assert r['flag']['authoritative_portal_norm_square_subgate']
          assert r['flag']['exact_quartic_t2bar_t4bar_mixing_inserted']
          assert r['benchmark']['exact_contribution']['positive_sector_rank']==1
          assert not r['flag']['all_PhiSigma_anisotropic_channels_complete']
          assert not r['flag']['complete_component_potential']
          assert not r['flag']['physical_triplet_spectrum_complete']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_validated']
          assert not r['flag']['whole_model_excluded']
          assert not r['flag']['empirical_discovery']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-gen-triplet-portal-norm-square
          path: |
            NEXT_GEN_TRIPLET_PORTAL_NORM_SQUARE_GATE_V20.json
            NEXT_GEN_TRIPLET_PORTAL_NORM_SQUARE_GATE_V20.md
