name: diagonal-sigmabar-m2-mixed-126-ps-singlet

on:
  pull_request:
    paths:
      - diagonal_sigmabar_m2_mixed_126_ps_singlet_v20.py
      - test_diagonal_sigmabar_m2_mixed_126_ps_singlet_v20.py
      - cg_normalized_mt_locking_mix_v20.py
      - so10_cubic_operator_signed_audit_v20.py
      - diagonal_h10_sigmabar_m2_isotropic_54_slots_v20.py
      - .github/workflows/diagonal-sigmabar-m2-mixed-126-ps-singlet.yml
  workflow_dispatch:

concurrency:
  group: mixed-126-ps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mixed-126-ps-singlet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Execute OPEN_MIXED_126 PS-singlet fill
        run: python diagonal_sigmabar_m2_mixed_126_ps_singlet_v20.py --write
      - name: Focused tests
        run: |
          python -m unittest -v \
            test_diagonal_sigmabar_m2_mixed_126_ps_singlet_v20.py \
            test_diagonal_h10_sigmabar_m2_isotropic_54_slots_v20.py
      - name: Assert honest scientific boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('DIAGONAL_SIGMABAR_M2_MIXED_126_PS_SINGLET_V20.json'))
          assert r['n_failed']==0, r
          assert r['overall_state']=='BLOCKED', r
          assert r['status']=='OPEN_MIXED_126_PS_SINGLET_PARTIAL_M2_FILLED__FULL_CG_OPEN', r
          assert r['flags']['OPEN_MIXED_126_ps_singlet_partial_filled'], r
          assert r['flags']['positive_hermitian_schur_C_seed_from_mixed_126'], r
          assert not r['flags']['full_tensor_CG_normalized'], r
          assert not r['flags']['invented_missing_cg'], r
          assert not r['flags']['whole_model_validated'], r
          assert r['seed']['delta_M2_GeV2']>0.0, r
          assert r['still_open']['OPEN_MIXED_120'], r
          assert r['still_open']['OPEN_MIXED_320'], r
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagonal-sigmabar-m2-mixed-126-ps-singlet
          path: |
            DIAGONAL_SIGMABAR_M2_MIXED_126_PS_SINGLET_V20.json
            DIAGONAL_SIGMABAR_M2_MIXED_126_PS_SINGLET_V20.md
