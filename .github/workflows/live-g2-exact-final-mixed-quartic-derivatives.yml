name: live-g2-exact-final-mixed-quartic-derivatives

on:
  workflow_dispatch:
  pull_request:
    paths:
      - exact_phi2_h_126dag_210_1050_channels_v20.py
      - exact_phisigma_126bar_minus_projectors_v20.py
      - exact_phisigma_casimir_projectors_v20.py
      - live_g1_tensor_closure_ledger_v20.py
      - live_g2_arbitrary_component_potential_values_v20.py
      - live_g2_canonical_486_field_chart_v20.py
      - live_g2_exact_quadratic_family_derivatives_v20.py
      - live_g2_exact_final_mixed_quartic_derivatives_v20.py
      - test_live_g2_exact_final_mixed_quartic_derivatives_v20.py
      - .github/workflows/live-g2-exact-final-mixed-quartic-derivatives.yml
  push:
    branches: [main]
    paths:
      - exact_phi2_h_126dag_210_1050_channels_v20.py
      - exact_phisigma_126bar_minus_projectors_v20.py
      - exact_phisigma_casimir_projectors_v20.py
      - live_g2_exact_final_mixed_quartic_derivatives_v20.py
      - test_live_g2_exact_final_mixed_quartic_derivatives_v20.py
      - .github/workflows/live-g2-exact-final-mixed-quartic-derivatives.yml

concurrency:
  group: live-g2-final-mixed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-final-mixed-quartic-derivatives:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile final mixed adapters
        run: |
          python -m py_compile \
            live_g2_exact_final_mixed_quartic_derivatives_v20.py \
            test_live_g2_exact_final_mixed_quartic_derivatives_v20.py
      - name: Run final mixed derivative tests
        run: python -m pytest -q test_live_g2_exact_final_mixed_quartic_derivatives_v20.py
      - name: Generate exact derivative certificate
        run: python live_g2_exact_final_mixed_quartic_derivatives_v20.py --write
      - name: Assert fail-closed 18-adapter boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('LIVE_G2_EXACT_FINAL_MIXED_QUARTIC_DERIVATIVES_V20.json'))
          assert r['n_failed']==0, r['failures']
          c=r['coverage']
          assert c['expected_direction_counts']=={
              'Phi2_Sigma_projectors':6,
              'Phi2_Hdag_Sigma_210_1050':2,
          }
          assert c['observed_direction_counts']==c['expected_direction_counts']
          assert c['direction_count_closed_here']==8
          assert c['parameter_count_closed_here']==10
          assert c['cumulative_base_family_count_with_parents']==18
          assert c['remaining_base_families']==0
          assert r['targeted_value_layer_audit']['maximum_residual']<2e-11
          assert r['maximum_Hessian_asymmetry']<1e-10
          assert r['directional_reconstruction']['second_residual']<1e-6
          assert r['flags']['all_eighteen_base_family_adapters_available']
          assert not r['flags']['G2_closed']
          assert not r['flags']['whole_model_validated']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-g2-exact-final-mixed-quartic-derivatives
          path: |
            LIVE_G2_EXACT_FINAL_MIXED_QUARTIC_DERIVATIVES_V20.json
            LIVE_G2_EXACT_FINAL_MIXED_QUARTIC_DERIVATIVES_V20.md
