name: cal-g-portal-decision

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cal-g-portal-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute cal G portal decision
        run: python cal_g_portal_decision_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_cal_g_portal_decision_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('CAL_G_PORTAL_DECISION_V20_VERDICT.json'))
          assert r['status']=='CAL_G_PORTAL_DECISION_RESOLVED__TAU_P_OPEN'
          assert r['n_failed']==0
          assert r['flag']['cal_G_portal_decision_resolved']
          assert not r['flag']['extra_new_portal_required']
          assert r['flag']['existing_lambda_lock_sufficient_in_principle']
          assert r['decision']['mu_crit_GeV']>0
          assert r['portals']['lambda_lock']['perturbative_O1_window']
          assert not r['portals']['lam4']['can_lift_cal_G_orth_inside_eq102']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload cal G portal decision verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal-g-portal-decision-verdict
          path: |
            CAL_G_PORTAL_DECISION_V20_VERDICT.json
            CAL_G_PORTAL_DECISION_V20.md
