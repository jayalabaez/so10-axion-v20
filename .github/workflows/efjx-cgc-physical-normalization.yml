name: efjx-cgc-physical-normalization

on:
  workflow_dispatch:

concurrency:
  group: efjx-cgc-physical-normalization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physical-cgc-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Extract E/F/J/X gamma-response matrices
        run: python efjx_cgc_physical_normalization_gate_v20.py
      - name: Run focused tests
        run: python -m unittest -v test_efjx_cgc_physical_normalization_gate_v20.py
      - name: Assert honest physical scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('EFJX_CGC_PHYSICAL_NORMALIZATION_GATE_V20.json'))
          assert r['overall_state']=='BLOCKED', r
          assert r['n_failed']==0, r
          assert r['flags']['exact_EFJX_gamma_response_known']
          assert r['flags']['proxy_cgc_ratio_invalid_as_physical_prediction']
          assert not r['flags']['physical_CGC_normalization_derived']
          assert not r['flags']['physical_EW_branch_revalidated']
          assert not r['flags']['whole_model_excluded']
          assert not r['flags']['whole_model_validated']
          PY
      - name: Upload normalization-gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efjx-cgc-physical-normalization
          path: |
            EFJX_CGC_PHYSICAL_NORMALIZATION_GATE_V20.json
            EFJX_CGC_PHYSICAL_NORMALIZATION_GATE_V20.md
