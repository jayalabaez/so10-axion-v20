name: so10-kronecker-mt2-audit

on:
  workflow_dispatch:

concurrency:
  group: so10-kronecker-mt-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kronecker-mt2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute signed operator filter
        run: python nonsusy_z17_pq_potential_filter_v20.py
      - name: Execute signed M_T squared proxy
        run: python nonsusy_charge_allowed_mt_v20.py
      - name: Execute Kronecker M_T squared audit
        run: python so10_kronecker_existence_mt_lock_v20.py
      - name: Focused regression tests
        run: |
          python -m unittest -v \
            test_nonsusy_z17_pq_potential_filter_v20.py \
            test_nonsusy_charge_allowed_mt_v20.py \
            test_so10_kronecker_existence_mt_lock_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('SO10_KRONECKER_MT_LOCK_V20_VERDICT.json'))
          assert r['status']=='SO10_KRONECKER_SIGNED__FORBIDDEN_CUBICS_OFF__LAMBDA4_CG_OPEN'
          assert r['n_failed']==0, r
          assert r['flag']['kronecker_resolved']
          assert r['flag']['forbidden_210_10dag10_removed']
          assert r['flag']['forbidden_10_126_S_removed']
          assert r['flag']['forbidden_cubic_contributions_locked_zero']
          assert r['flag']['lambda4_offdiag_allowed_but_CG_open']
          assert r['flag']['lambda4_offdiag_not_locked_zero']
          assert not r['flag']['physical_component_CG_complete']
          assert not r['flag']['physical_triplet_spectrum_complete']
          assert not r['flag']['whole_model_excluded']
          ops={o['name']:o for o in r['resolved_operators']}
          assert ops['210_H 10_H^dag 10_H']['status']=='SO10_FORBIDDEN'
          assert ops['10_H 126bar_H S']['status']=='SO10_FORBIDDEN'
          assert ops['10_H^2 S']['status']=='ALLOWED_CHARGE_AND_SO10'
          assert ops['210 · 10 · 126 · S']['status']=='ALLOWED_CHARGE_AND_SO10'
          audited=r['audited_mt2']
          assert audited['forbidden_cubic_contributions_zero']
          assert audited['lambda4_component_slot_preserved']
          assert audited['n_nonzero_lambda4_scenarios'] > 0
          PY
      - name: Upload Kronecker M_T2 verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: so10-kronecker-mt2-verdict
          path: |
            NONSUSY_Z17_PQ_POTENTIAL_FILTER_V20.json
            NONSUSY_CHARGE_ALLOWED_MT_V20_VERDICT.json
            SO10_KRONECKER_MT_LOCK_V20_VERDICT.json
            SO10_KRONECKER_MT_LOCK_V20.md
