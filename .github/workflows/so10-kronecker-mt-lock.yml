name: so10-kronecker-mt-lock

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  so10-kronecker-mt-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute Kronecker existence + M_T lock
        run: python so10_kronecker_existence_mt_lock_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_so10_kronecker_existence_mt_lock_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('SO10_KRONECKER_MT_LOCK_V20_VERDICT.json'))
          assert r['status']=='SO10_KRONECKER_RESOLVED__MT_MIX_LOCKED_OFF__CG_NORMS_OPEN'
          assert r['n_failed']==0
          assert r['flag']['kronecker_resolved']
          assert r['flag']['ten_126_S_so10_forbidden']
          assert r['flag']['mt_offdiag_locked_zero']
          assert r['flag']['aulakh_offdiag_not_imported_pq']
          assert not r['flag']['invented_unpublished_cg_normalizations']
          assert not r['flag']['whole_model_excluded']
          assert r['locked_mt']['all_M12_zero']
          ops={o['name']:o for o in r['resolved_operators']}
          assert ops['10_H 126bar_H S']['status']=='SO10_FORBIDDEN'
          assert ops['10_H^2 S']['status']=='ALLOWED_CHARGE_AND_SO10'
          PY
      - name: Upload Kronecker M_T lock verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: so10-kronecker-mt-lock-verdict
          path: |
            SO10_KRONECKER_MT_LOCK_V20_VERDICT.json
            SO10_KRONECKER_MT_LOCK_V20.md
