name: live-g2-exact-h10-self-quartic-derivatives

on:
  workflow_dispatch:
  pull_request:
    paths:
      - live_g2_exact_h10_self_quartic_derivatives_v20.py
      - test_live_g2_exact_h10_self_quartic_derivatives_v20.py
      - live_g2_exact_remaining_cubic_derivatives_v20.py
      - live_g2_exact_quadratic_family_derivatives_v20.py
      - live_g2_canonical_486_field_chart_v20.py
      - live_g2_arbitrary_component_potential_values_v20.py
      - .github/workflows/live-g2-exact-h10-self-quartic-derivatives.yml
  push:
    branches: [main]
    paths:
      - live_g2_exact_h10_self_quartic_derivatives_v20.py
      - test_live_g2_exact_h10_self_quartic_derivatives_v20.py
      - live_g2_exact_remaining_cubic_derivatives_v20.py
      - live_g2_exact_quadratic_family_derivatives_v20.py
      - live_g2_canonical_486_field_chart_v20.py
      - live_g2_arbitrary_component_potential_values_v20.py
      - .github/workflows/live-g2-exact-h10-self-quartic-derivatives.yml

concurrency:
  group: live-g2-h10-self-quartics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-h10-self-quartic-derivatives:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile derivative stack
        run: |
          python -m py_compile \
            live_g2_exact_quadratic_family_derivatives_v20.py \
            live_g2_exact_remaining_cubic_derivatives_v20.py \
            live_g2_exact_h10_self_quartic_derivatives_v20.py \
            test_live_g2_exact_h10_self_quartic_derivatives_v20.py
      - name: Run focused tests
        run: |
          python -m pytest -q \
            test_live_g2_exact_quadratic_family_derivatives_v20.py \
            test_live_g2_exact_h10_self_quartic_derivatives_v20.py
      - name: Generate exact H10 quartic certificate
        run: python live_g2_exact_h10_self_quartic_derivatives_v20.py --write
      - name: Assert authoritative nonzero scope
        run: |
          python - <<'PY'
          import json

          report=json.load(open('LIVE_G2_EXACT_H10_SELF_QUARTIC_DERIVATIVES_V20.json'))
          assert report['n_failed']==0, report['failures']
          assert report['coverage']['base_family']=='H_self_quartics'
          assert report['coverage']['base_family_count_closed_here']==1
          assert report['coverage']['cumulative_base_family_count_with_parents']==10
          assert report['coverage']['base_family_count_total']==18
          assert report['coverage']['remaining_base_families']==8
          assert report['coverage']['expected_direction_count']>0
          assert report['coverage']['expected_direction_count']==report['coverage']['observed_direction_count']
          assert report['coverage']['parameter_count_closed_here']>0
          assert report['coverage']['basis_indices']==[0,1]
          assert report['coverage']['basis_labels']==['I_1','I_54']
          assert report['coverage']['real_field_dimension']==486
          assert report['coverage']['Hessian_shape']==[486,486]
          assert report['maximum_base_support_residual']<1e-12
          assert report['maximum_direction_value_residual']<1e-10
          assert report['maximum_Hessian_asymmetry']<1e-12
          assert report['maximum_self_conjugate_imaginary_residual']<1e-10
          assert report['directional_reconstruction']['value_residual']<1e-9
          assert report['directional_reconstruction']['first_residual']<1e-8
          assert report['directional_reconstruction']['second_residual']<1e-7
          assert report['flags']['authoritative_H_self_quartic_adapter_closed']
          assert report['flags']['I1_projector_gradient_Hessian_exact']
          assert report['flags']['I54_projector_gradient_Hessian_exact']
          assert report['flags']['cumulative_ten_of_eighteen_base_adapters_closed']
          assert not report['flags']['all_64_direction_gradients_complete']
          assert not report['flags']['all_64_direction_Hessians_complete']
          assert not report['flags']['G2_closed']
          assert not report['flags']['whole_model_validated']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-g2-exact-h10-self-quartic-derivatives
          path: |
            LIVE_G2_EXACT_H10_SELF_QUARTIC_DERIVATIVES_V20.json
            LIVE_G2_EXACT_H10_SELF_QUARTIC_DERIVATIVES_V20.md
