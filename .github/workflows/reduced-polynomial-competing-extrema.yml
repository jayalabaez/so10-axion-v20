name: reduced-polynomial-competing-extrema

on:
  pull_request:
    paths:
      - reduced_polynomial_competing_extrema_v20.py
      - test_reduced_polynomial_competing_extrema_v20.py
      - nonsusy_reduced_hessian_v20.py
      - charge_allowed_potential_minimize_v20.py
      - .github/workflows/reduced-polynomial-competing-extrema.yml
  workflow_dispatch:

concurrency:
  group: reduced-polynomial-competing-extrema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reduced-polynomial-competing-extrema:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute competing-extrema census
        run: python reduced_polynomial_competing_extrema_v20.py --write
      - name: Focused regression tests
        run: python -m unittest -v test_reduced_polynomial_competing_extrema_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('REDUCED_POLYNOMIAL_COMPETING_EXTREMA_V20.json'))
          assert r['status']=='REDUCED_POLYNOMIAL_COMPETING_EXTREMA_CENSUSED__FULL_RING_OPEN'
          assert r['n_failed']==0
          assert r['overall_state']=='BLOCKED'
          assert r['flags']['selected_survival_locally_stable']
          assert r['flags']['historical_lam4_excluded_as_tachyonic']
          assert not r['flags']['full_invariant_ring_extrema']
          assert not r['flags']['whole_model_validated']
          PY
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reduced-polynomial-competing-extrema
          path: |
            REDUCED_POLYNOMIAL_COMPETING_EXTREMA_V20.json
            REDUCED_POLYNOMIAL_COMPETING_EXTREMA_V20.md
