name: uv-cp-phases-from-potential

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  uv-cp-phases-from-potential:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute UV CP phases from potential
        run: python uv_cp_phases_from_potential_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_uv_cp_phases_from_potential_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('UV_CP_PHASES_FROM_POTENTIAL_V20_VERDICT.json'))
          assert r['status']=='UV_CP_PHASES_FROM_POTENTIAL__UNIQUE_VACUUM_OPEN'
          assert r['n_failed']==0
          assert r['flag']['uv_cp_phases_from_potential']
          assert r['flag']['real_couplings_cp_conserving_vacuum']
          assert r['flag']['complex_coupling_phases_conditional']
          assert r['flag']['fed_into_xy_gauge_width']
          assert not r['flag']['unique_uv_cp_phases']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          assert abs(r['conditional_uv_point']['psi_10_minus_Delta'])>1e-3
          PY
      - name: Upload UV CP verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uv-cp-phases-from-potential-verdict
          path: |
            UV_CP_PHASES_FROM_POTENTIAL_V20_VERDICT.json
            UV_CP_PHASES_FROM_POTENTIAL_V20.md
