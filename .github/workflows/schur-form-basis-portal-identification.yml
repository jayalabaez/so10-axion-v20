name: schur-form-basis-portal-identification

on:
  pull_request:
    paths:
      - schur_form_basis_portal_identification_v20.py
      - test_schur_form_basis_portal_identification_v20.py
      - hodge_126bar_c_embedding_portal_lift_v20.py
      - extended_form_basis_hessian_imh_spectators_v20.py
      - direct_portal_mass2_schur_gate_v20.py
      - .github/workflows/schur-form-basis-portal-identification.yml
  workflow_dispatch:

concurrency:
  group: schur-form-basis-portal-identification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schur-form-basis-portal-identification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute Schur↔form portal identification
        run: python schur_form_basis_portal_identification_v20.py --write
      - name: Focused regression tests
        run: python -m unittest -v test_schur_form_basis_portal_identification_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('SCHUR_FORM_BASIS_PORTAL_IDENTIFICATION_V20.json'))
          assert r['status']=='SCHUR_FORM_PORTAL_IDENTIFIED__SPECTATORS_OUTSIDE_272'
          assert r['n_failed']==0
          assert r['overall_state']=='BLOCKED'
          assert r['flags']['cartesian_portal_basis_map_closed']
          assert not r['flags']['whole_model_validated']
          PY
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schur-form-basis-portal-identification
          path: |
            SCHUR_FORM_BASIS_PORTAL_IDENTIFICATION_V20.json
            SCHUR_FORM_BASIS_PORTAL_IDENTIFICATION_V20.md
