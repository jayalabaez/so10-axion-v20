name: g1-g8-execution-roadmap

on:
  push:
    branches:
      - agent/g1-g8-roadmap-ew-backreaction
  pull_request:
    paths:
      - g1_g8_execution_roadmap_v20.py
      - test_g1_g8_execution_roadmap_v20.py
      - exact_phi2_hdagh_channel_family_v20.py
      - test_exact_phi2_hdagh_channel_family_v20.py
      - .github/workflows/g1-g8-execution-roadmap.yml
  workflow_dispatch:

jobs:
  g1-g8-execution-roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy mpmath
      - name: Compile gates
        run: |
          python -m py_compile g1_g8_execution_roadmap_v20.py test_g1_g8_execution_roadmap_v20.py
          python -m py_compile exact_phi2_hdagh_channel_family_v20.py test_exact_phi2_hdagh_channel_family_v20.py
      - name: Test roadmap contracts
        run: python -m pytest -q test_g1_g8_execution_roadmap_v20.py
      - name: Test exact Phi2 HdagH channels
        run: python -m pytest -q test_exact_phi2_hdagh_channel_family_v20.py
      - name: Generate roadmap artifacts
        run: python g1_g8_execution_roadmap_v20.py --json G1_G8_EXECUTION_ROADMAP_V20.json > /tmp/g1-g8-roadmap.log
      - name: Generate exact Phi2 HdagH certificate
        run: python exact_phi2_hdagh_channel_family_v20.py > /tmp/exact-phi2-hdagh.log
      - name: Assert fail-closed roadmap and exact family
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roadmap = json.loads(Path('G1_G8_EXECUTION_ROADMAP_V20.json').read_text())
          assert roadmap['n_failed'] == 0, roadmap['failures']
          assert roadmap['gates']['G1']['status'] == 'OPEN'
          assert roadmap['gates']['G7']['status'] == 'OPEN'
          assert all(row['status'] != 'CLOSED' for row in roadmap['gates'].values())
          assert roadmap['dependencies']['G8'] == ['G3', 'G6', 'G7']
          assert 'empirical discovery' in roadmap['new_physics_policy']

          family = json.loads(Path('EXACT_PHI2_HDAGH_CHANNEL_FAMILY_V20.json').read_text())
          assert family['n_failed'] == 0, family['failures']
          assert family['flag']['phi2_hdagh_channel_count_closed'] is True
          assert family['flag']['all_three_all_component_tensor_maps_constructed'] is True
          assert family['flag']['complete_mixed_invariant_ring'] is False
          assert family['flag']['whole_model_validated'] is False
          assert family['flag']['empirical_discovery'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: g1-g8-execution-roadmap-and-phi2-hdagh
          path: |
            G1_G8_EXECUTION_ROADMAP_V20.json
            G1_G8_EXECUTION_ROADMAP_V20.md
            EXACT_PHI2_HDAGH_CHANNEL_FAMILY_V20.json
            EXACT_PHI2_HDAGH_CHANNEL_FAMILY_V20.md
