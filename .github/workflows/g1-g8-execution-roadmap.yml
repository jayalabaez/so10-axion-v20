          python -B exact_gauged_u1x_g2_mathematical_closure_v20.py
          python -B exact_hsigma_current_endomorphism_dimension6_stabilizer_v20.py
          python -B exact_gauged_u1x_g3_su5_eft_current_kernel_stabilized_global_v20.py
