            test_exact_gauged_u1x_g3_alternative_global_sos_audit_v20.py \
            test_exact_hsigma_current_endomorphism_dimension6_stabilizer_v20.py \
            test_exact_gauged_u1x_g3_su5_eft_current_kernel_stabilized_global_v20.py \
