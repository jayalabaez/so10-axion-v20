        run: |
          python g1_g8_execution_roadmap_v20.py --write > /tmp/g1-g8-roadmap.log
          python final_g3_acceptance_gate_v20.py --write > /tmp/final-g3.log
      - name: Assert fail-closed roadmap
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import g1_g8_gate_ledger_v20 as gate_ledger
          from corrected_rank1_endpoint_v21 import central_view, load_validated_publication
          report = json.loads(Path('G1_G8_EXECUTION_ROADMAP_V20.json').read_text())
          pd = json.loads(Path('EXACT_GAUGED_U1X_G3_PD_RANK_CERTIFICATE_V20.json').read_text())
          sos = json.loads(Path('EXACT_GAUGED_U1X_G3_SOS_BFB_STATIONARITY_V20.json').read_text())
