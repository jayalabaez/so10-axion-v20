          python -B corrected_rank1_publication_v21/verify_exact_gauged_u1x_g3_rank1_su4_corrected_fixed_endpoint_theorem_v21.py
          python -B corrected_rank1_endpoint_v21.py
          python exact_gauged_u1x_g3_alternative_global_sos_audit_v20.py --write
