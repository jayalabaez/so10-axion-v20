          python -B final_g4_eft_mathematical_gate_v20.py
          python -B final_g5_eft_mathematical_gate_v20.py
          python -B exact_eft_physical_scalar_spectrum_v20.py
          python -B final_g6_eft_mathematical_gate_v20.py
      - name: Test roadmap contracts
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            test_exact_gauged_u1x_g1_component_tensor_closure_v20.py \
            test_exact_gauged_u1x_g2_mathematical_closure_v20.py \
