name: SUSY V24 resolution frontier

on:
  push:
    paths:
      - "susy_v24_*.py"
      - "test_susy_v24_*.py"
      - "SUSY_V24_*.json"
      - "SUSY_V24_*.md"
      - "models/PSZ4RZ11SUSYV24/**"
      - "tools/validate-susy-v24-ps.wls"
      - ".github/workflows/susy-v24-resolution-frontier.yml"
  pull_request:
    paths:
      - "susy_v24_*.py"
      - "test_susy_v24_*.py"
      - "SUSY_V24_*.json"
      - "SUSY_V24_*.md"
      - "models/PSZ4RZ11SUSYV24/**"
      - "tools/validate-susy-v24-ps.wls"
      - ".github/workflows/susy-v24-resolution-frontier.yml"
  workflow_dispatch:

jobs:
  exact-frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Replay every frozen V24 producer
        run: |
          for producer in susy_v24_*.py; do
            python -B "$producer" --check
          done
      - name: Run the V24 tests
        run: python -m pytest -q -o "python_files=test_susy_v24_*.py"
