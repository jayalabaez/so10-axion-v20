name: apply-g3-patch-bundle

on:
  push:
    branches: [agent/g3-full-stationarity]
    paths:
      - .github/workflows/apply-g3-patch-bundle.yml
      - g3_patch_bundle.tar.gz.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/g3-full-stationarity
      - name: Apply bundled patch
        run: |
          base64 -d g3_patch_bundle.tar.gz.b64 | tar -xzf -
          rm -f g3_patch_bundle.tar.gz.b64 .github/workflows/apply-g3-patch-bundle.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Advance G3 with full-coordinate stationarity"
          git push origin HEAD:agent/g3-full-stationarity
