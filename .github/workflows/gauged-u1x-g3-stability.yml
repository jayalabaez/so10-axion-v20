concurrency:
  group: gauged-u1x-g3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixed-vacuum-stability-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile gauged-X G2/G3 audits
        run: |
          python -m py_compile \
            gauged_u1x_scalar_contract_v20.py \
            exact_gauged_u1x_stationarity_rank_certificate_v20.py \
