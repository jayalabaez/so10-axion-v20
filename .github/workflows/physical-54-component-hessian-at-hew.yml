name: physical-54-component-hessian-at-hew

on:
  pull_request:
    paths:
      - physical_54_component_hessian_at_hew_v20.py
      - test_physical_54_component_hessian_at_hew_v20.py
      - physical_h10_54_mass_block_from_deltar_v20.py
      - so10_126_to_54_projector_v20.py
      - direct_phi_h_sigmabar_tensor_v20.py
      - .github/workflows/physical-54-component-hessian-at-hew.yml
  workflow_dispatch:

concurrency:
  group: physical-54-hew-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  physical-54-hew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Execute physical 54 Hessian at hEW
        run: python physical_54_component_hessian_at_hew_v20.py --write
      - name: Focused tests
        run: python -m unittest -v test_physical_54_component_hessian_at_hew_v20.py
      - name: Assert honest scientific boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('PHYSICAL_54_COMPONENT_HESSIAN_AT_HEW_V20.json'))
          assert r['n_failed']==0, r
          assert r['overall_state']=='BLOCKED', r
          assert r['status']=='PHYSICAL_54_COMPONENT_HESSIAN_AT_HEW_EXECUTED__FULL_HESSIAN_OPEN', r
          assert r['flags']['OPEN_H10_54_exact_zero'], r
          assert r['flags']['OPEN_126_54_LOCKING_holomorphic_kernel_nonzero'], r
          assert not r['flags']['OPEN_126_54_LOCKING_positive_schur_seed'], r
          assert not r['flags']['H10_MI_proxy_used'], r
          assert not r['flags']['full_component_hessian_complete'], r
          assert not r['flags']['whole_model_validated'], r
          assert not r['flags']['whole_model_excluded'], r
          assert r['blocks']['OPEN_126_54_LOCKING']['n_nonzero_singular']==126, r
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-54-component-hessian-at-hew
          path: |
            PHYSICAL_54_COMPONENT_HESSIAN_AT_HEW_V20.json
            PHYSICAL_54_COMPONENT_HESSIAN_AT_HEW_V20.md
