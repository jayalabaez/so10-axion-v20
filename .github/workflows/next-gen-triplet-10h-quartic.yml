name: next-gen-triplet-10h-quartic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "exact_10h_holomorphic_quartic_triplet_v20.py"
      - "test_exact_10h_holomorphic_quartic_triplet_v20.py"
      - "next_gen_triplet_10h_quartic_gate_v20.py"
      - "test_next_gen_triplet_10h_quartic_gate_v20.py"
      - "next_gen_triplet_diagonal_baseline_gate_v20.py"
      - "next_gen_triplet_quadratic_gate_v20.py"
      - ".github/workflows/next-gen-triplet-10h-quartic.yml"
  push:
    branches: [main]
    paths:
      - "exact_10h_holomorphic_quartic_triplet_v20.py"
      - "test_exact_10h_holomorphic_quartic_triplet_v20.py"
      - "next_gen_triplet_10h_quartic_gate_v20.py"
      - "test_next_gen_triplet_10h_quartic_gate_v20.py"
      - "next_gen_triplet_diagonal_baseline_gate_v20.py"
      - "next_gen_triplet_quadratic_gate_v20.py"
      - ".github/workflows/next-gen-triplet-10h-quartic.yml"

concurrency:
  group: next-gen-triplet-10h-quartic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-10h-quartic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile exact 10H quartic modules
        run: |
          python -m py_compile \
            exact_10h_holomorphic_quartic_triplet_v20.py \
            test_exact_10h_holomorphic_quartic_triplet_v20.py \
            next_gen_triplet_10h_quartic_gate_v20.py \
            test_next_gen_triplet_10h_quartic_gate_v20.py
      - name: Run exact 10H quartic tests
        run: |
          python -m unittest -v \
            test_exact_10h_holomorphic_quartic_triplet_v20.py \
            test_next_gen_triplet_10h_quartic_gate_v20.py
      - name: Generate exact projection report
        run: python exact_10h_holomorphic_quartic_triplet_v20.py
      - name: Generate authoritative insertion report
        run: python next_gen_triplet_10h_quartic_gate_v20.py
      - name: Assert exact insertion and scope
        run: |
          python - <<'PY'
          import json
          p=json.load(open('EXACT_10H_HOLOMORPHIC_QUARTIC_TRIPLET_V20.json'))
          g=json.load(open('NEXT_GEN_TRIPLET_10H_QUARTIC_GATE_V20.json'))

          assert p['n_failed']==0, p['failures']
          assert p['overall_state']=='CLOSED_SUBPROBLEM'
          assert p['flag']['exact_10h_holomorphic_quartic_triplet_projection']
          assert p['flag']['exact_B_correction_formula_derived']
          assert not p['flag']['physical_Q_H0_derived']
          assert p['exact_result']['Hermitian_diagonal_shift_from_this_channel']==0.0

          assert g['n_failed']==0, g['failures']
          assert g['overall_state']=='PARTIAL'
          assert g['flag']['authoritative_10h_quartic_subgate']
          assert g['flag']['exact_second_10h_quartic_B_inserted']
          assert g['flag']['second_10h_quartic_diagonal_shift_zero']
          assert not g['flag']['physical_Q_H0_derived']
          assert not g['flag']['complete_component_potential']
          assert not g['flag']['physical_triplet_spectrum_complete']
          assert not g['flag']['exact_unique_proton_lifetime']
          assert not g['flag']['whole_model_validated']
          assert not g['flag']['whole_model_excluded']
          assert not g['flag']['empirical_discovery']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-gen-triplet-10h-quartic
          path: |
            EXACT_10H_HOLOMORPHIC_QUARTIC_TRIPLET_V20.json
            EXACT_10H_HOLOMORPHIC_QUARTIC_TRIPLET_V20.md
            NEXT_GEN_TRIPLET_10H_QUARTIC_GATE_V20.json
            NEXT_GEN_TRIPLET_10H_QUARTIC_GATE_V20.md
