name: mixed-rep-historical-ledger

on:
  workflow_dispatch:

concurrency:
  group: mixed-rep-hilbert-series-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  historical-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute historical mixed ledger
        run: python mixed_rep_hilbert_series_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_mixed_rep_hilbert_series_v20.py
      - name: Assert signed-audit scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('MIXED_REP_HILBERT_SERIES_V20.json'))
          assert r['status']=='HISTORICAL_MIXED_REP_LEDGER_EXECUTED__SIGNED_AUDIT_REQUIRED'
          assert r['n_failed']==0, r
          b=r['filtered_basis']
          assert b['historical_claimed_total']==25
          assert b['n_invariants_total']==25
          assert not b['complete_filtered_renorm_basis']
          assert b['signed_audit_required']
          invalid={row['name']:row for row in b['historical_invalid_entries']}
          assert invalid['210_H 10_H^dag 10_H']['canonical_status']=='SO10_FORBIDDEN'
          assert not r['flag']['mixed_rep_charge_so10_filtered_renorm_hilbert_closed']
          assert not r['flag']['mixed_rep_full_hilbert_series']
          assert not r['flag']['mixed_rep_unfiltered_molien_haar_series']
          assert r['flag']['historical_complete_claim_falsified']
          assert r['flag']['signed_audit_required']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload historical ledger verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixed-rep-historical-ledger-verdict
          path: |
            MIXED_REP_HILBERT_SERIES_V20.json
            MIXED_REP_HILBERT_SERIES_V20.md
