name: mixed-rep-hilbert-series

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mixed-rep-hilbert-series:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute mixed-rep filtered Hilbert series
        run: python mixed_rep_hilbert_series_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_mixed_rep_hilbert_series_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('MIXED_REP_HILBERT_SERIES_V20_VERDICT.json'))
          assert r['status']=='MIXED_REP_FILTERED_HILBERT_SERIES_CLOSED__UNFILTERED_MOLIEN_OPEN'
          assert r['n_failed']==0
          b=r['filtered_basis']
          assert b['complete_filtered_renorm_basis']
          assert b['n_invariants_total']>=20
          names={e['name'] for e in b['included']}
          assert '210 · 10 · 126 · S' in names
          assert '10_H 126bar_H S' not in names
          assert r['flag']['mixed_rep_charge_so10_filtered_renorm_hilbert_closed']
          assert r['flag']['mixed_rep_full_hilbert_series']
          assert not r['flag']['mixed_rep_unfiltered_molien_haar_series']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload mixed-rep Hilbert verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixed-rep-hilbert-series-verdict
          path: |
            MIXED_REP_HILBERT_SERIES_V20_VERDICT.json
            MIXED_REP_HILBERT_SERIES_V20.md
