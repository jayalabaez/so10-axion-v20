name: live-g1-g2-potential-values

on:
  pull_request:
    paths:
      - 'g1_exact_declared_symmetry_character_census_v20.py'
      - 'exact_unique_hsigma_chiral_quartics_v20.py'
      - 'live_g1_tensor_closure_ledger_v20.py'
      - 'live_g1_g8_gate_ledger_v20.py'
      - 'live_g2_arbitrary_component_potential_values_v20.py'
      - 'test_live_g2_arbitrary_component_potential_values_v20.py'
      - 'test_exact_unique_hsigma_chiral_quartics_v20.py'
      - 'test_live_g1_tensor_closure_ledger_v20.py'
      - 'test_live_g1_g8_gate_ledger_v20.py'
      - '.github/workflows/live-g1-closure.yml'
  push:
    branches: [main]
    paths:
      - 'g1_exact_declared_symmetry_character_census_v20.py'
      - 'exact_unique_hsigma_chiral_quartics_v20.py'
      - 'live_g1_tensor_closure_ledger_v20.py'
      - 'live_g1_g8_gate_ledger_v20.py'
      - 'live_g2_arbitrary_component_potential_values_v20.py'
      - 'test_live_g2_arbitrary_component_potential_values_v20.py'
      - 'test_exact_unique_hsigma_chiral_quartics_v20.py'
      - 'test_live_g1_tensor_closure_ledger_v20.py'
      - 'test_live_g1_g8_gate_ledger_v20.py'
      - '.github/workflows/live-g1-closure.yml'
  workflow_dispatch:

concurrency:
  group: live-g1-g2-values-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-g1-g2-values:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile G1 and G2 modules
        run: |
          python -m py_compile \
            live_g1_tensor_closure_ledger_v20.py \
            live_g1_g8_gate_ledger_v20.py \
            live_g2_arbitrary_component_potential_values_v20.py \
            test_live_g2_arbitrary_component_potential_values_v20.py
      - name: Execute exact live census and G1 closure
        run: |
          python g1_exact_declared_symmetry_character_census_v20.py > /tmp/g1-census.json
          python exact_unique_hsigma_chiral_quartics_v20.py > /tmp/g1-unique-quartics.json
          python live_g1_tensor_closure_ledger_v20.py > /tmp/g1-tensor-ledger.json
          python live_g1_g8_gate_ledger_v20.py --no-write > /tmp/g1-g8-ledger.json
      - name: Execute arbitrary-field G2 value compiler
        run: |
          python live_g2_arbitrary_component_potential_values_v20.py --write > /tmp/g2-values.json
      - name: Focused regression tests
        run: |
          python -m pytest -q \
            test_exact_unique_hsigma_chiral_quartics_v20.py \
            test_live_g1_tensor_closure_ledger_v20.py \
            test_live_g1_g8_gate_ledger_v20.py \
            test_live_g2_arbitrary_component_potential_values_v20.py
      - name: Independently assert G1 closure and G2 value layer
        run: |
          python - <<'PY'
          import json
          import live_g1_tensor_closure_ledger_v20 as g1
          import live_g1_g8_gate_ledger_v20 as gates

          r = g1.build_report()
          assert r['n_failed'] == 0, r
          assert len(r['operator_orbits']) == 48
          assert sum(row['multiplicity'] for row in r['operator_orbits']) == 64
          assert not r['missing_base_keys']
          assert not r['multiplicity_mismatches']

          q = gates.build_report()
          assert q['n_failed'] == 0, q
          assert q['summary']['closed'] == ['G1']
          assert q['gates']['G1']['status'] == 'CLOSED'
          assert q['gates']['G2']['status'] != 'CLOSED'
          assert not q['flags']['whole_model_validated']

          d=json.load(open('LIVE_G2_ARBITRARY_COMPONENT_POTENTIAL_VALUES_V20.json'))
          assert d['n_failed']==0, d['failures']
          assert d['counts']=={
              'Hermitian_orbits':48,
              'invariant_directions':64,
              'real_parameters':91,
              'base_families':18,
          }, d['counts']
          assert d['flags']['all_64_arbitrary_component_values_callable']
          assert d['flags']['all_91_real_parameters_compiled']
          assert d['flags']['real_Hermitian_potential_assembled']
          assert d['flags']['coefficient_Jacobian_exact']
          assert d['scaling_audit']['maximum_relative_residual'] < 1e-8
          assert not d['flags']['field_gradient_complete']
          assert not d['flags']['field_Hessian_complete']
          assert not d['flags']['G2_closed']
          assert not d['flags']['whole_model_validated']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-g1-g2-potential-values
          path: |
            LIVE_G2_ARBITRARY_COMPONENT_POTENTIAL_VALUES_V20.json
            LIVE_G2_ARBITRARY_COMPONENT_POTENTIAL_VALUES_V20.md
