name: tau-p-hessian-residual-closure

on:
  workflow_dispatch:

concurrency:
  group: tau-p-hessian-residual-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tau-p-hessian-residual-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute τ_p Hessian residual closure
        run: python tau_p_hessian_residual_closure_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_tau_p_hessian_residual_closure_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('TAU_P_HESSIAN_RESIDUAL_CLOSURE_V20_VERDICT.json'))
          assert r['status']=='TAU_P_HESSIAN_CLOSURE_WITHDRAWN__DIRECT_NONSUSY_HESSIAN_OPEN', r['status']
          assert r['n_failed']==0
          assert r['flag']['imported_susy_hessian_withdrawn']
          assert not r['flag']['hessian_residuals_folded_into_tau_p']
          assert not r['flag']['full_component_hessian_residual_closed']
          assert not r['flag']['tau_p_unique_under_hessian_closed_stack']
          assert not any(r['certificate']['hessian_residuals_closed'].values())
          assert r['certificate']['residual_still_open']['direct_component_mass_squared_matrix']
          assert r['certificate']['residual_still_open']['exact_unique_proton_lifetime']
          assert r['lifetime']['conditional_only']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          assert not r['flag']['whole_model_validated']
          assert r['lifetime']['selected_tau_e_years']>0
          PY
      - name: Upload τ_p Hessian closure verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tau-p-hessian-residual-closure-verdict
          path: |
            TAU_P_HESSIAN_RESIDUAL_CLOSURE_V20_VERDICT.json
            TAU_P_HESSIAN_RESIDUAL_CLOSURE_V20.md
