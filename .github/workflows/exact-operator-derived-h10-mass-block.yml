name: exact-operator-derived-h10-mass-block

on:
  workflow_dispatch:
  pull_request:
    paths:
      - exact_operator_derived_h10_mass_block_v20.py
      - test_exact_operator_derived_h10_mass_block_v20.py
      - exact_muD_482_schur_stability_v20.py
      - exact_phi2_hdagh_channel_family_v20.py
      - .github/workflows/exact-operator-derived-h10-mass-block.yml
  push:
    branches: [main]
    paths:
      - exact_operator_derived_h10_mass_block_v20.py
      - test_exact_operator_derived_h10_mass_block_v20.py
      - exact_muD_482_schur_stability_v20.py
      - exact_phi2_hdagh_channel_family_v20.py
      - .github/workflows/exact-operator-derived-h10-mass-block.yml

jobs:
  exact-operator-derived-h10-mass-block:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest
      - name: Compile
        run: |
          python -m py_compile \
            exact_operator_derived_h10_mass_block_v20.py \
            test_exact_operator_derived_h10_mass_block_v20.py
      - name: Run operator-derived H10 mass-block tests
        run: python -m pytest -q test_exact_operator_derived_h10_mass_block_v20.py
      - name: Generate certificate
        run: python exact_operator_derived_h10_mass_block_v20.py
      - name: Assert fail-closed scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('EXACT_OPERATOR_DERIVED_H10_MASS_BLOCK_V20.json'))
          assert r['n_failed']==0, r['failures']
          assert r['flag']['complete_operator_derived_H_mass_matrix']
          assert r['spectrum_stable_full']['zero_modes']==33
          assert r['spectrum_stable_full']['negative_modes']==0
          assert r['spectrum_stable_physical']['zero_modes']==0
          assert r['spectrum_stable_physical']['negative_modes']==0
          assert not r['flag']['hsigma_45_full_vector_complete']
          assert not r['flag']['nonzero_electroweak_backreaction']
          assert not r['flag']['whole_model_validated']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exact-operator-derived-h10-mass-block
          path: |
            EXACT_OPERATOR_DERIVED_H10_MASS_BLOCK_V20.json
            EXACT_OPERATOR_DERIVED_H10_MASS_BLOCK_V20.md
