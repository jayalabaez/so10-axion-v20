name: exact-complete-h10-mass-and-joint-schur

on:
  workflow_dispatch:
  pull_request:
    paths:
      - exact_operator_derived_h10_mass_block_v20.py
      - test_exact_operator_derived_h10_mass_block_v20.py
      - exact_complete_h10_selected_vacuum_mass_block_v20.py
      - test_exact_complete_h10_selected_vacuum_mass_block_v20.py
      - exact_joint_h10_cross_schur_stability_v20.py
      - test_exact_joint_h10_cross_schur_stability_v20.py
      - exact_muD_482_schur_stability_v20.py
      - exact_phi2_hdagh_channel_family_v20.py
      - exact_phi2_h126dag_selected_vacuum_projection_v20.py
      - exact_10h_squared_s_bterm_v20.py
      - exact_hsigma_holomorphic_charge_dressed_completion_v20.py
      - .github/workflows/exact-operator-derived-h10-mass-block.yml
  push:
    branches: [main]
    paths:
      - exact_operator_derived_h10_mass_block_v20.py
      - test_exact_operator_derived_h10_mass_block_v20.py
      - exact_complete_h10_selected_vacuum_mass_block_v20.py
      - test_exact_complete_h10_selected_vacuum_mass_block_v20.py
      - exact_joint_h10_cross_schur_stability_v20.py
      - test_exact_joint_h10_cross_schur_stability_v20.py
      - exact_muD_482_schur_stability_v20.py
      - exact_phi2_hdagh_channel_family_v20.py
      - exact_phi2_h126dag_selected_vacuum_projection_v20.py
      - exact_10h_squared_s_bterm_v20.py
      - exact_hsigma_holomorphic_charge_dressed_completion_v20.py
      - .github/workflows/exact-operator-derived-h10-mass-block.yml

jobs:
  exact-complete-h10-mass-and-joint-schur:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest mpmath
      - name: Compile
        run: |
          python -m py_compile \
            exact_operator_derived_h10_mass_block_v20.py \
            test_exact_operator_derived_h10_mass_block_v20.py \
            exact_complete_h10_selected_vacuum_mass_block_v20.py \
            test_exact_complete_h10_selected_vacuum_mass_block_v20.py \
            exact_joint_h10_cross_schur_stability_v20.py \
            test_exact_joint_h10_cross_schur_stability_v20.py
      - name: Run complete H10 and joint-Schur tests
        run: |
          python -m pytest -q \
            test_exact_operator_derived_h10_mass_block_v20.py \
            test_exact_complete_h10_selected_vacuum_mass_block_v20.py \
            test_exact_joint_h10_cross_schur_stability_v20.py
      - name: Generate certificates
        run: |
          python exact_operator_derived_h10_mass_block_v20.py
          python exact_complete_h10_selected_vacuum_mass_block_v20.py --write
          python exact_joint_h10_cross_schur_stability_v20.py --write
      - name: Assert fail-closed scope
        run: |
          python - <<'PY'
          import json

          r=json.load(open('EXACT_OPERATOR_DERIVED_H10_MASS_BLOCK_V20.json'))
          assert r['n_failed']==0, r['failures']
          assert r['flag']['complete_operator_derived_H_mass_matrix']
          assert r['spectrum_stable_full']['zero_modes']==33
          assert r['spectrum_stable_full']['negative_modes']==0
          assert not r['flag']['nonzero_electroweak_backreaction']

          r=json.load(open('EXACT_COMPLETE_H10_SELECTED_VACUUM_MASS_BLOCK_V20.json'))
          assert r['n_failed']==0, r['failures']
          assert r['model_contract_id']=='historical_option_c_no_x_v20'
          assert r['authoritative_for_manuscript'] is False
          assert r['model_wide_no_go_certified'] is False
          assert r['flags']['historical_option_c_H_only_quadratic_block_reproduced']
          assert not r['flags']['phi17_dressings_allowed_by_manuscript_u1x']
          assert r['stable_benchmark']['negative_modes']==0
          assert r['unstable_benchmark']['negative_modes']>0
          assert not r['flags']['complete_482_real_Hessian']
          assert not r['flags']['whole_model_validated']

          r=json.load(open('EXACT_JOINT_H10_CROSS_SCHUR_STABILITY_V20.json'))
          assert r['n_failed']==0, r['failures']
          assert r['model_contract_id']=='historical_option_c_no_x_v20'
          assert r['authoritative_for_manuscript'] is False
          assert r['model_wide_no_go_certified'] is False
          assert r['flags']['historical_six_real_coefficient_operator_gram_derived']
          assert r['flags']['historical_option_c_joint_local_bound_reproduced']
          assert r['benchmarks']['above']['spectrum']['full_zero_modes']==33
          assert r['benchmarks']['above']['spectrum']['full_negative_modes']==0
          assert r['benchmarks']['below']['spectrum']['physical_negative_modes']>=1
          assert not r['flags']['complete_G2_component_potential']
          assert not r['flags']['nonzero_electroweak_backreaction']
          assert not r['flags']['whole_model_validated']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exact-complete-h10-mass-and-joint-schur
          path: |
            EXACT_OPERATOR_DERIVED_H10_MASS_BLOCK_V20.json
            EXACT_OPERATOR_DERIVED_H10_MASS_BLOCK_V20.md
            EXACT_COMPLETE_H10_SELECTED_VACUUM_MASS_BLOCK_V20.json
            EXACT_COMPLETE_H10_SELECTED_VACUUM_MASS_BLOCK_V20.md
            EXACT_JOINT_H10_CROSS_SCHUR_STABILITY_V20.json
            EXACT_JOINT_H10_CROSS_SCHUR_STABILITY_V20.md
