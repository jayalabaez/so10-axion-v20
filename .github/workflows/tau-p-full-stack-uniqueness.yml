name: tau-p-selected-stack-conditional

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tau_p_full_stack_uniqueness_v20.py"
      - "test_tau_p_full_stack_uniqueness_v20.py"
      - "exact_xy_masses_component_vacuum_v20.py"
      - "residual_lam210_eta_intra_v20.py"
      - "triplet_proxy_contamination_audit_v20.py"
      - ".github/workflows/tau-p-full-stack-uniqueness.yml"
  push:
    branches: [main]
    paths:
      - "tau_p_full_stack_uniqueness_v20.py"
      - "test_tau_p_full_stack_uniqueness_v20.py"
      - "exact_xy_masses_component_vacuum_v20.py"
      - "residual_lam210_eta_intra_v20.py"
      - "triplet_proxy_contamination_audit_v20.py"
      - ".github/workflows/tau-p-full-stack-uniqueness.yml"

concurrency:
  group: tau-p-selected-stack-conditional-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tau-p-selected-stack-conditional:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run conditional-stack regression tests
        run: python -m unittest -v test_tau_p_full_stack_uniqueness_v20.py
      - name: Execute selected-stack report
        run: python tau_p_full_stack_uniqueness_v20.py
      - name: Assert withdrawn uniqueness and fail-closed scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('TAU_P_FULL_STACK_UNIQUENESS_V20_VERDICT.json'))
          assert r['status']=='TAU_P_SELECTED_STACK_CONDITIONAL__UNIQUE_LIFETIME_OPEN'
          assert r['n_failed']==0, r['failures']
          assert r['certificate']['conditional_only']
          assert r['certificate']['selected_tau_e_years']>0
          assert not r['flag']['tau_p_unique_under_full_uv_stack']
          assert not r['flag']['tau_p_unique_under_reduced_uv_vacuum_selection']
          assert not r['flag']['exact_XY_masses_used']
          assert not r['flag']['residual_spectrum_used']
          assert not r['flag']['physical_triplet_spectrum_complete']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          assert r['certificate']['residual_still_open']['direct_component_mass_squared_matrix']
          assert r['certificate']['residual_still_open']['full_component_hessian_and_competing_extrema']
          PY
      - name: Upload conditional selected-stack verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tau-p-selected-stack-conditional-verdict
          path: |
            TAU_P_FULL_STACK_UNIQUENESS_V20_VERDICT.json
            TAU_P_FULL_STACK_UNIQUENESS_V20.md
