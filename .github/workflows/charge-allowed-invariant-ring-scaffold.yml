name: charge-allowed-invariant-ring-scaffold

on:
  pull_request:
    paths:
      - charge_allowed_invariant_ring_scaffold_v20.py
      - test_charge_allowed_invariant_ring_scaffold_v20.py
      - nonsusy_z17_pq_potential_filter_v20.py
      - diagonal_h10_sigmabar_m2_channel_inventory_v20.py
      - .github/workflows/charge-allowed-invariant-ring-scaffold.yml
  workflow_dispatch:

concurrency:
  group: charge-allowed-invariant-ring-scaffold-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  charge-allowed-invariant-ring-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute ring scaffold
        run: python charge_allowed_invariant_ring_scaffold_v20.py --write
      - name: Focused regression tests
        run: python -m unittest -v test_charge_allowed_invariant_ring_scaffold_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('CHARGE_ALLOWED_INVARIANT_RING_SCAFFOLD_V20.json'))
          ring=json.load(open('FULL_MIXED_REP_INVARIANT_RING_V20.json'))
          assert r['status']=='CHARGE_ALLOWED_INVARIANT_RING_SCAFFOLD_READY__CG_OPEN'
          assert r['n_failed']==0
          assert r['overall_state']=='BLOCKED'
          assert ring['status']=='FULL_MIXED_REP_INVARIANT_RING_SCAFFOLD_READY__CG_OPEN'
          assert not ring['flags']['full_invariant_ring_complete']
          assert not ring['flags']['whole_model_validated']
          assert ring['independence']['status']=='OPEN'
          PY
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charge-allowed-invariant-ring-scaffold
          path: |
            CHARGE_ALLOWED_INVARIANT_RING_SCAFFOLD_V20.json
            CHARGE_ALLOWED_INVARIANT_RING_SCAFFOLD_V20.md
            FULL_MIXED_REP_INVARIANT_RING_V20.json
            FULL_MIXED_REP_INVARIANT_RING_V20.md
