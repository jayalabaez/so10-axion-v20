name: pq-null-lam4-portal-lift

on:
  workflow_dispatch:

concurrency:
  group: pq-null-lam4-portal-lift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pq-null-lam4-portal-lift:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute PQ-null λ₄ portal lift
        run: python pq_null_lam4_portal_lift_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_pq_null_lam4_portal_lift_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('PQ_NULL_LAM4_PORTAL_LIFT_V20_VERDICT.json'))
          assert r['status']=='PQ_NULL_EXACT_KERNEL_LIFTED_BY_LAM4__LIGHT_MASSES_DOCUMENTED'
          assert r['n_failed']==0
          assert r['baseline_gamma0']['efjx_exact_algebraic_nulls']==4
          assert r['lifted_selected_lam4']['efjx_exact_algebraic_nulls']==0
          assert r['flag']['pq_null_exact_kernel_lifted_by_lam4']
          assert r['flag']['lam4_portal_charge_allowed']
          assert not r['flag']['selected_lam4_clears_gut_null_tol']
          assert r['flag']['cal_G_soft_mode_documented']
          assert not r['flag']['live_sarah_or_pyrate_executable_run']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload PQ-null λ₄ lift verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pq-null-lam4-portal-lift-verdict
          path: |
            PQ_NULL_LAM4_PORTAL_LIFT_V20_VERDICT.json
            PQ_NULL_LAM4_PORTAL_LIFT_V20.md
