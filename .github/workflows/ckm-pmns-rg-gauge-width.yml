name: ckm-pmns-rg-gauge-width

on:
  workflow_dispatch:

concurrency:
  group: ckm-pmns-rg-gauge-width-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ckm-pmns-rg-gauge-width:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute CKM/PMNS RG gauge width
        run: python ckm_pmns_rg_gauge_width_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_ckm_pmns_rg_gauge_width_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('CKM_PMNS_RG_GAUGE_WIDTH_V20_VERDICT.json'))
          assert r['status']=='CKM_PMNS_RG_TO_GUT_IN_GAUGE_WIDTH__CP_TENSORS_OPEN'
          assert r['n_failed']==0
          assert r['flag']['ckm_pmns_rg_to_gut']
          assert r['flag']['gauge_width_uses_GUT_mixings']
          assert r['flag']['vud_stable_under_rg']
          assert abs(r['ckm_rg']['delta_rel_V_ud'])<0.05
          assert r['lifetimes']['passes_SK_e_pi0_GUT_flavour']
          assert not r['flag']['full_cp_xy_tensors']
          assert not r['flag']['two_loop_matrix_flavour_rge']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload CKM/PMNS RG verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckm-pmns-rg-gauge-width-verdict
          path: |
            CKM_PMNS_RG_GAUGE_WIDTH_V20_VERDICT.json
            CKM_PMNS_RG_GAUGE_WIDTH_V20.md
