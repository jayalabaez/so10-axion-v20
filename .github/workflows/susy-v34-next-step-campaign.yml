name: SUSY V34 next-step campaign

on:
  push:
    paths:
      - "susy_v34_next_step_campaign.py"
      - "test_susy_v34_next_step_campaign.py"
      - "SUSY_V34_NEXT_STEP_CAMPAIGN.json"
      - "SUSY_V34_NEXT_STEP_CAMPAIGN.md"
      - "SUSY_V34_G1_ANOMALY_INSTANTON_CLOSURE.json"
      - "SUSY_V34_G6_PROJECTED_RGE_THRESHOLD.json"
      - "SUSY_V34_NEW_PHYSICS_REPAIRS.json"
      - "SUSY_V34_G1_G8_GATE_LEDGER.json"
      - "SUSY_V33_DERIVATION_CAMPAIGN.json"
      - "SUSY_V33_EXACT_DERIVATIONS.json"
      - "SUSY_V33_SARAH_RGE_ATTESTATION.json"
      - "SUSY_V24_PS_VACUUM_RG_FRONTIER.json"
      - "SUSY_V31_RGE_FLAVOUR_COSMOLOGY_LEDGER.json"
      - ".github/workflows/susy-v34-next-step-campaign.yml"
  pull_request:
    paths:
      - "susy_v34_next_step_campaign.py"
      - "test_susy_v34_next_step_campaign.py"
      - "SUSY_V34_NEXT_STEP_CAMPAIGN.json"
      - "SUSY_V34_NEXT_STEP_CAMPAIGN.md"
      - "SUSY_V34_G1_ANOMALY_INSTANTON_CLOSURE.json"
      - "SUSY_V34_G6_PROJECTED_RGE_THRESHOLD.json"
      - "SUSY_V34_NEW_PHYSICS_REPAIRS.json"
      - "SUSY_V34_G1_G8_GATE_LEDGER.json"
      - "SUSY_V33_DERIVATION_CAMPAIGN.json"
      - "SUSY_V33_EXACT_DERIVATIONS.json"
      - "SUSY_V33_SARAH_RGE_ATTESTATION.json"
      - "SUSY_V24_PS_VACUUM_RG_FRONTIER.json"
      - "SUSY_V31_RGE_FLAVOUR_COSMOLOGY_LEDGER.json"
      - ".github/workflows/susy-v34-next-step-campaign.yml"
  workflow_dispatch:

jobs:
  verify-v34:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -B susy_v34_next_step_campaign.py --check
      - run: python -m pytest -q test_susy_v34_next_step_campaign.py
