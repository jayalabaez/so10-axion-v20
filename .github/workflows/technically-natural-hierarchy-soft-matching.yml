name: technically-natural-hierarchy-soft-matching

on:
  pull_request:
    paths:
      - technically_natural_hierarchy_soft_matching_v20.py
      - test_technically_natural_hierarchy_soft_matching_v20.py
      - unique_soft_scale_stationarity_v20.py
      - reduced_amplitude_free_extrema_v20.py
      - .github/workflows/technically-natural-hierarchy-soft-matching.yml
  workflow_dispatch:

concurrency:
  group: technically-natural-hierarchy-soft-matching-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  technically-natural-hierarchy-soft-matching:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute hierarchy soft-matching certificate
        run: python technically_natural_hierarchy_soft_matching_v20.py --write
      - name: Focused regression tests
        run: python -m unittest -v test_technically_natural_hierarchy_soft_matching_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('TECHNICALLY_NATURAL_HIERARCHY_SOFT_MATCHING_V20.json'))
          assert r['status']=='TECHNICALLY_NATURAL_HIERARCHY_SOFT_MATCHING_PARTIAL__FULL_STATIONARITY_OPEN'
          assert r['n_failed']==0
          assert r['overall_state']=='BLOCKED'
          assert r['flags']['technically_natural_hierarchy_soft_matching_partial']
          assert not r['flags']['uv_kappa_uniquely_determined']
          assert not r['flags']['whole_model_validated']
          PY
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technically-natural-hierarchy-soft-matching
          path: |
            TECHNICALLY_NATURAL_HIERARCHY_SOFT_MATCHING_V20.json
            TECHNICALLY_NATURAL_HIERARCHY_SOFT_MATCHING_V20.md
