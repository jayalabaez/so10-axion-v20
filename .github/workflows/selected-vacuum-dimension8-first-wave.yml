name: selected-vacuum-dimension8-first-wave

on:
  pull_request:
    paths:
      - selected_vacuum_dimension8_first_wave_v20.py
      - test_selected_vacuum_dimension8_first_wave_v20.py
      - .github/workflows/selected-vacuum-dimension8-first-wave.yml
  workflow_dispatch:

concurrency:
  group: selected-vacuum-dimension8-first-wave-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dimension8-first-wave:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        wave: [8a, 8b, 8c, 8d, 8e, 8f, 8g, 8h, 8i, 8j, 8k, 8l]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONHASHSEED: "0"
      WAVE: ${{ matrix.wave }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile first-wave evaluator
        run: |
          python -m compileall -q \
            selected_vacuum_dimension8_first_wave_v20.py \
            test_selected_vacuum_dimension8_first_wave_v20.py
      - name: Verify census partition
        run: |
          python -m unittest -v test_selected_vacuum_dimension8_first_wave_v20.py
      - name: Execute dimension-eight coefficient wave
        run: |
          python selected_vacuum_dimension8_first_wave_v20.py \
            --wave "$WAVE" --write
      - name: Assert honest coefficient result
        run: |
          python - <<'PY'
          import json
          import os
          import selected_vacuum_dimension8_first_wave_v20 as mod

          wave=os.environ['WAVE']
          tag=wave.upper()
          report=json.load(open(f'SELECTED_VACUUM_DIMENSION8_FIRST_WAVE_{tag}_V20.json'))
          spec=mod.WAVE_SPECS[wave]
          result=report['result']
          assert report['n_failed']==0, report
          assert report['overall_state']=='BLOCKED', report
          assert tuple(result['signature_P_D_Db_H_Hb'])==spec['signature'], report
          assert result['n_metric_graphs']==spec['graphs'], report
          assert result['n_H_multilinear_assignments']==spec['assignments'], report
          assert result['n_graph_coefficient_evaluations']==spec['cost'], report
          assert result['planned_evaluation_cost']==spec['cost'], report
          assert result['maximum_abs_coefficient'] >= 0.0, report
          assert report['status'] in {
              f'DIMENSION8_FIRST_WAVE_{tag}_ZERO',
              f'DIMENSION8_FIRST_WAVE_{tag}_NONZERO_CHANNEL_FOUND__STATIONARITY_OPEN',
          }, report
          assert not report['flags']['stationarity_rebuilt'], report
          assert not report['flags']['boundedness_reproved'], report
          assert not report['flags']['full_scalar_hessian_rebuilt'], report
          assert not report['flags']['whole_model_validated'], report
          assert not report['flags']['whole_model_excluded'], report
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-vacuum-dimension8-first-wave-${{ matrix.wave }}
          path: |
            SELECTED_VACUUM_DIMENSION8_FIRST_WAVE_*_V20.json
            SELECTED_VACUUM_DIMENSION8_FIRST_WAVE_*_V20.md
