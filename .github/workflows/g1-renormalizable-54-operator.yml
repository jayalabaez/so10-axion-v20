name: g1-renormalizable-54-operator

on:
  pull_request:
    paths:
      - 'g1_renormalizable_operator_inventory_v20.py'
      - 'test_g1_renormalizable_operator_inventory_v20.py'
      - '.github/workflows/g1-renormalizable-54-operator.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: g1-renormalizable-54-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  operator-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy scipy mpmath
      - run: python -m unittest -v test_g1_renormalizable_operator_inventory_v20.py
      - run: python g1_renormalizable_operator_inventory_v20.py --write
      - name: Assert exact scope
        run: |
          python - <<'PY'
          import json
          d=json.load(open('G1_RENORMALIZABLE_OPERATOR_INVENTORY_V20.json'))
          assert d['n_failed']==0 and d['overall_state']=='BLOCKED', d
          assert d['restored_operator']['status']=='ALLOWED', d
          assert d['restored_operator']['multiplicity']==1, d
          assert d['scope']['operator_existence_closed'], d
          assert d['scope']['operator_multiplicity_closed'], d
          assert d['scope']['selected_background_value_closed_zero'], d
          assert not d['flags']['new_selected_phase_lock_found'], d
          assert not d['scope']['complete_mixed_invariant_ring_G1_closed'], d
          assert not d['flags']['whole_model_validated'], d
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-renormalizable-54-${{ matrix.python-version }}
          path: |
            G1_RENORMALIZABLE_OPERATOR_INVENTORY_V20.json
            G1_RENORMALIZABLE_OPERATOR_INVENTORY_V20.md
