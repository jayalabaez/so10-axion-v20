name: nonsusy-charge-allowed-mt

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  nonsusy-charge-allowed-mt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute charge-allowed nonsusy M_T
        run: python nonsusy_charge_allowed_mt_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_nonsusy_charge_allowed_mt_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('NONSUSY_CHARGE_ALLOWED_MT_V20_VERDICT.json'))
          assert r['status']=='NONSUSY_CHARGE_ALLOWED_MT_BUILT__CG_NORMALIZATIONS_OPEN'
          assert r['n_failed']==0
          assert r['flag']['charge_allowed_mt_built']
          assert r['flag']['bare_10_squared_absent']
          assert r['flag']['ten2_S_mixing_included']
          assert r['flag']['locking_phase_hessian_computed']
          assert not r['flag']['complete_phase_hessian']
          assert not r['flag']['invented_unpublished_cg_normalizations']
          assert not r['flag']['complete_so10_scalar_potential']
          assert not r['flag']['whole_model_excluded']
          assert r['locking_phase_hessian']['n_positive']==1
          assert r['locking_phase_hessian']['n_zero']==2
          assert 0 < r['n_excluded_by_ps_mu_K0'] < r['n_scenarios']
          PY
      - name: Upload charge-allowed M_T verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonsusy-charge-allowed-mt-verdict
          path: |
            NONSUSY_CHARGE_ALLOWED_MT_V20_VERDICT.json
            NONSUSY_CHARGE_ALLOWED_MT_V20.md
