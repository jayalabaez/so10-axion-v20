name: nonsusy-signed-mt2-proxy

on:
  workflow_dispatch:

concurrency:
  group: nonsusy-charge-allowed-mt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signed-mt2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute signed operator filter
        run: python nonsusy_z17_pq_potential_filter_v20.py
      - name: Test signed operator filter
        run: python -m unittest -v test_nonsusy_z17_pq_potential_filter_v20.py
      - name: Execute signed non-SUSY M_T squared proxy
        run: python nonsusy_charge_allowed_mt_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_nonsusy_charge_allowed_mt_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          f=json.load(open('NONSUSY_Z17_PQ_POTENTIAL_FILTER_V20.json'))
          r=json.load(open('NONSUSY_CHARGE_ALLOWED_MT_V20_VERDICT.json'))
          assert f['n_failed']==0, f
          assert f['flag']['forbidden_210_10dag10_removed']
          assert f['flag']['quartic_2102_10dag10_retained']
          assert r['status']=='NONSUSY_SIGNED_MT2_PROXY_BUILT__FULL_COMPONENT_CG_OPEN'
          assert r['n_failed']==0, r
          assert r['flag']['charge_and_so10_allowed_mt2_proxy_built']
          assert r['flag']['mass_squared_matrix_used']
          assert r['flag']['forbidden_210_10dag10_absent']
          assert r['flag']['forbidden_10_126_S_absent']
          assert r['flag']['lambda4_offdiag_slot_included']
          assert r['flag']['bare_10_squared_absent']
          assert r['flag']['ten2_S_mixing_included']
          assert r['locking_phase_hessian']['n_positive']==1
          assert r['locking_phase_hessian']['n_zero']==2
          assert 0 < r['n_excluded_by_ps_mu_K0'] < r['n_scenarios']
          assert not r['flag']['physical_component_CG_complete']
          assert not r['flag']['physical_triplet_spectrum_complete']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload signed M_T2 verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonsusy-signed-mt2-verdict
          path: |
            NONSUSY_Z17_PQ_POTENTIAL_FILTER_V20.json
            NONSUSY_Z17_PQ_POTENTIAL_FILTER_V20.md
            NONSUSY_CHARGE_ALLOWED_MT_V20_VERDICT.json
            NONSUSY_CHARGE_ALLOWED_MT_V20.md
