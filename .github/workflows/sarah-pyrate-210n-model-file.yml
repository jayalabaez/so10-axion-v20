name: sarah-pyrate-210n-model-file

on:
  pull_request:
    paths:
      - sarah_pyrate_210n_model_file_v20.py
      - test_sarah_pyrate_210n_model_file_v20.py
      - exact_x_symmetry_consistency_gate_v20.py
      - models/SO10Z17AxionV20.m
      - models/SO10Z17AxionV20_pyrate.yaml
      - models/EXACT_X_EXTERNAL_MODEL_VALIDATION_V20.json
      - models/EXACT_X_EXTERNAL_INPUT_MANIFEST_V20.json
      - models/SARAH_4_15_3_CANONICAL_SOURCE_TREE_V20.json
      - tools/validate-exact-x-model.wls
      - .github/workflows/sarah-pyrate-210n-model-file.yml
  workflow_dispatch:

concurrency:
  group: sarah-pyrate-210n-model-file-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sarah-pyrate-210n-model-file:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Classify native SARAH input + bound-evidence probe
        run: python sarah_pyrate_210n_model_file_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_sarah_pyrate_210n_model_file_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('SARAH_PYRATE_MODEL_FILE_V20_VERDICT.json'))
          assert r['status']=='SARAH_NATIVE_MODEL_EXTERNALLY_VALIDATED'
          assert r['overall_state']=='PASS'
          assert r['n_failed']==0
          assert r['flag']['sarah_pyrate_model_file_authored']
          assert r['flag']['sarah_metadata_scaffold_present']
          assert r['flag']['pyrate_metadata_scaffold_present']
          assert r['flag']['sarah_model_tool_native']
          assert r['flag']['sarah_static_contract_consistent']
          assert not r['flag']['pyrate_model_tool_native']
          assert r['flag']['pyrate_yaml_dynkin_matches_upstream']
          assert r['flag']['charge_locks_encoded']
          assert r['flag']['external_validation_v3_valid']
          assert not r['flag']['external_validation_v2_valid']
          assert r['flag']['live_sarah_or_pyrate_executable_run']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          assert r['live_probe']['live_run_executed']
          PY
      - name: Upload model-file verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarah-pyrate-210n-model-file-verdict
          path: |
            SARAH_PYRATE_MODEL_FILE_V20_VERDICT.json
            SARAH_PYRATE_MODEL_FILE_V20.md
            models/SO10Z17AxionV20.m
            models/EXACT_X_EXTERNAL_INPUT_MANIFEST_V20.json
            models/SARAH_4_15_3_CANONICAL_SOURCE_TREE_V20.json
            tools/validate-exact-x-model.wls
            models/SO10Z17AxionV20_pyrate.yaml
