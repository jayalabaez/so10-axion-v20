name: reduced-amplitude-free-extrema

on:
  pull_request:
    paths:
      - reduced_amplitude_free_extrema_v20.py
      - test_reduced_amplitude_free_extrema_v20.py
      - reduced_polynomial_competing_extrema_v20.py
      - nonsusy_reduced_hessian_v20.py
      - .github/workflows/reduced-amplitude-free-extrema.yml
  workflow_dispatch:

concurrency:
  group: reduced-amplitude-free-extrema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reduced-amplitude-free-extrema:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute free-extrema solve
        run: python reduced_amplitude_free_extrema_v20.py --write
      - name: Focused regression tests
        run: python -m unittest -v test_reduced_amplitude_free_extrema_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('REDUCED_AMPLITUDE_FREE_EXTREMA_V20.json'))
          assert r['status']=='REDUCED_AMPLITUDE_FREE_EXTREMA_SOLVED__FULL_RING_OPEN'
          assert r['n_failed']==0
          assert r['overall_state']=='BLOCKED'
          assert r['flags']['reduced_free_extrema_solved']
          assert r['flags']['selected_near_soft_matched_minimum']
          assert not r['flags']['full_invariant_ring_extrema']
          assert not r['flags']['whole_model_validated']
          PY
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reduced-amplitude-free-extrema
          path: |
            REDUCED_AMPLITUDE_FREE_EXTREMA_V20.json
            REDUCED_AMPLITUDE_FREE_EXTREMA_V20.md
