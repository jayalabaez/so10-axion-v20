name: selected-vacuum-dim7-remaining-high-complexity

on:
  pull_request:
    paths:
      - selected_vacuum_dim7_remaining_high_complexity_v20.py
      - test_selected_vacuum_dim7_remaining_high_complexity_v20.py
      - .github/workflows/selected-vacuum-dim7-remaining-high-complexity.yml
  workflow_dispatch:

concurrency:
  group: selected-vacuum-dim7-remaining-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  remaining-high-complexity:
    strategy:
      fail-fast: false
      matrix:
        wave: [2a, 2b, 2c]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONHASHSEED: "0"
      WAVE: ${{ matrix.wave }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile remaining-wave evaluator
        run: |
          python -m compileall -q \
            selected_vacuum_dim7_remaining_high_complexity_v20.py \
            test_selected_vacuum_dim7_remaining_high_complexity_v20.py
      - name: Verify finite workload partition
        run: |
          python -m unittest -v \
            test_selected_vacuum_dim7_remaining_high_complexity_v20.py
      - name: Execute remaining dimension-seven wave
        run: |
          python selected_vacuum_dim7_remaining_high_complexity_v20.py \
            --wave "$WAVE" --write
      - name: Assert honest wave result
        run: |
          python - <<'PY'
          import json
          import os

          wave = os.environ["WAVE"]
          tag = wave.upper()
          report = json.load(
              open(f"SELECTED_VACUUM_DIM7_REMAINING_{tag}_V20.json")
          )
          expected = {
              "2a": ((0, 2, 4, 0, 0), 12043, 1, 12043),
              "2b": ((3, 0, 2, 2, 0), 3387, 4, 13548),
              "2c": ((1, 1, 3, 2, 0), 4897, 4, 19588),
          }
          signature, graphs, assignments, cost = expected[wave]
          result = report["result"]
          assert report["n_failed"] == 0, report
          assert report["overall_state"] == "BLOCKED", report
          assert tuple(result["signature_P_D_Db_H_Hb"]) == signature, report
          assert result["n_metric_graphs"] == graphs, report
          assert result["n_H_multilinear_assignments"] == assignments, report
          assert result["n_graph_coefficient_evaluations"] == cost, report
          assert result["planned_evaluation_cost"] == cost, report
          assert result["maximum_abs_coefficient"] >= 0.0, report
          assert report["status"] in {
              f"DIM7_REMAINING_{tag}_ZERO",
              f"DIM7_REMAINING_{tag}_NONZERO_CHANNEL_FOUND__STATIONARITY_OPEN",
          }, report
          assert not report["flags"]["stationarity_rebuilt"], report
          assert not report["flags"]["full_scalar_hessian_rebuilt"], report
          assert not report["flags"]["whole_model_validated"], report
          assert not report["flags"]["whole_model_excluded"], report
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-vacuum-dim7-remaining-${{ matrix.wave }}
          path: |
            SELECTED_VACUUM_DIM7_REMAINING_*_V20.json
            SELECTED_VACUUM_DIM7_REMAINING_*_V20.md
