name: diagonal-m2-isotropic-54-slots

on:
  pull_request:
    paths:
      - h10_intermediate_vev_consistency_audit_v20.py
      - test_h10_intermediate_vev_consistency_audit_v20.py
      - physical_h10_54_mass_block_from_deltar_v20.py
      - test_physical_h10_54_mass_block_from_deltar_v20.py
      - phase_operator_independence_audit_v20.py
      - test_phase_operator_independence_audit_v20.py
      - deltar_54_locking_dependency_audit_v20.py
      - test_deltar_54_locking_dependency_audit_v20.py
      - diagonal_h10_sigmabar_m2_isotropic_54_slots_v20.py
      - test_diagonal_h10_sigmabar_m2_isotropic_54_slots_v20.py
      - .github/workflows/diagonal-m2-isotropic-54-slots.yml
  workflow_dispatch:

concurrency:
  group: diagonal-m2-isotropic-54-slots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corrected-isotropic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: |
          python -m compileall -q \
            h10_intermediate_vev_consistency_audit_v20.py \
            physical_h10_54_mass_block_from_deltar_v20.py \
            phase_operator_independence_audit_v20.py \
            deltar_54_locking_dependency_audit_v20.py \
            diagonal_h10_sigmabar_m2_isotropic_54_slots_v20.py \
            test_h10_intermediate_vev_consistency_audit_v20.py \
            test_physical_h10_54_mass_block_from_deltar_v20.py \
            test_phase_operator_independence_audit_v20.py \
            test_deltar_54_locking_dependency_audit_v20.py \
            test_diagonal_h10_sigmabar_m2_isotropic_54_slots_v20.py
      - name: Execute corrected component audits
        run: |
          python h10_intermediate_vev_consistency_audit_v20.py --write
          python physical_h10_54_mass_block_from_deltar_v20.py --write
          python phase_operator_independence_audit_v20.py --write
          python deltar_54_locking_dependency_audit_v20.py --write
          python diagonal_h10_sigmabar_m2_isotropic_54_slots_v20.py --write
      - name: Focused tests
        run: |
          python -m unittest -v \
            test_h10_intermediate_vev_consistency_audit_v20.py \
            test_physical_h10_54_mass_block_from_deltar_v20.py \
            test_phase_operator_independence_audit_v20.py \
            test_deltar_54_locking_dependency_audit_v20.py \
            test_diagonal_h10_sigmabar_m2_isotropic_54_slots_v20.py
      - name: Assert fail-closed scientific state
        run: |
          python - <<'PY'
          import json
          a=json.load(open('H10_INTERMEDIATE_VEV_CONSISTENCY_AUDIT_V20.json'))
          h=json.load(open('PHYSICAL_H10_54_MASS_BLOCK_FROM_DELTAR_V20.json'))
          p=json.load(open('PHASE_OPERATOR_INDEPENDENCE_AUDIT_V20.json'))
          d=json.load(open('DELTAR_54_LOCKING_DEPENDENCY_AUDIT_V20.json'))
          r=json.load(open('DIAGONAL_H10_SIGMABAR_M2_ISOTROPIC_54_SLOTS_V20.json'))
          assert a['n_failed']==0 and a['overall_state']=='BLOCKED', a
          assert not a['flags']['physical_H10_intermediate_scale_singlet_vev_exists'], a
          assert not a['flags']['legacy_A54_v10eff_MI_physical'], a
          assert not a['flags']['legacy_isotropic_54_mass_seed_physical'], a
          assert h['n_failed']==0 and h['overall_state']=='BLOCKED', h
          assert h['flags']['DeltaR_squared_54_projection_zero'], h
          assert not h['flags']['physical_locking_amplitude_on_selected_vacuum'], h
          assert not h['flags']['physical_H10_54_mass_block_from_DeltaR'], h
          assert h['exact_zero_evidence']['generic_map_nonzero'], h
          assert h['exact_zero_evidence']['Q_delta_frobenius'] < 1e-12, h
          assert p['n_failed']==0 and p['overall_state']=='BLOCKED', p
          assert p['linear_algebra']['rank_kappa_lambda4']==2, p
          assert p['linear_algebra']['rank_after_adding_lambda_lock']==2, p
          assert p['linear_algebra']['rank_increment_from_lambda_lock']==0, p
          assert p['linear_algebra']['common_null_vector']==[1,1,-2], p
          assert not p['flags']['legacy_lambda_lock_independent_lift_claim_valid'], p
          assert not p['flags']['selected_vacuum_dimension6_lock_valid'], p
          assert d['n_failed']==0 and d['overall_state']=='BLOCKED', d
          assert d['flags']['all_known_consumers_identified'], d
          assert not d['flags']['all_consumers_revalidated'], d
          assert not d['flags']['selected_vacuum_lambda_lock_chain_valid'], d
          assert not d['flags']['repository_ready_for_release'], d
          assert d['counts']['n_revalidation_required'] == d['counts']['n_known_consumers'], d
          assert d['counts']['n_known_consumers'] >= 10, d
          assert r['n_failed']==0 and r['overall_state']=='BLOCKED', r
          assert r['flag']['isotropic_norm_slots_partially_filled'], r
          assert not r['flag']['isotropic_norm_54_slots_partially_filled'], r
          assert r['flag']['unphysical_H10_MI_54_seed_withdrawn'], r
          assert r['flag']['schur_fed_with_partial_A_C'], r
          assert not r['flag']['diagonal_h10_m2_fully_derived'], r
          assert not r['flag']['diagonal_sigmabar_m2_fully_derived'], r
          assert not r['flag']['full_component_hessian'], r
          assert not r['flag']['whole_model_validated'], r
          assert not r['flag']['whole_model_excluded'], r
          assert len(r['partial_diagonals']['filled_slots'])==3, r
          assert len(r['partial_diagonals']['withdrawn_slots'])==2, r
          assert r['partial_diagonals']['components']['locking_isotropic_seed']==0.0, r
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagonal-m2-proxy-withdrawal
          path: |
            H10_INTERMEDIATE_VEV_CONSISTENCY_AUDIT_V20.json
            H10_INTERMEDIATE_VEV_CONSISTENCY_AUDIT_V20.md
            PHYSICAL_H10_54_MASS_BLOCK_FROM_DELTAR_V20.json
            PHYSICAL_H10_54_MASS_BLOCK_FROM_DELTAR_V20.md
            PHASE_OPERATOR_INDEPENDENCE_AUDIT_V20.json
            PHASE_OPERATOR_INDEPENDENCE_AUDIT_V20.md
            DELTAR_54_LOCKING_DEPENDENCY_AUDIT_V20.json
            DELTAR_54_LOCKING_DEPENDENCY_AUDIT_V20.md
            DIAGONAL_H10_SIGMABAR_M2_ISOTROPIC_54_SLOTS_V20.json
            DIAGONAL_H10_SIGMABAR_M2_ISOTROPIC_54_SLOTS_V20.md
