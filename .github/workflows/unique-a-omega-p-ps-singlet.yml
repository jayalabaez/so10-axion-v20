name: unique-a-omega-p-ps-singlet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unique-a-omega-p-ps-singlet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute unique (a,ω,p) minimization
        run: python unique_a_omega_p_ps_singlet_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_unique_a_omega_p_ps_singlet_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('UNIQUE_A_OMEGA_P_PS_SINGLET_V20_VERDICT.json'))
          assert r['status']=='UNIQUE_A_OMEGA_P_FROM_PS_SINGLET__FULL_210N_OPEN'
          assert r['n_failed']==0
          fr=r['selected']['fractions']
          assert abs(fr['a_over_MGUT']+fr['omega_over_MGUT']+fr['p_over_MGUT']-1)<1e-8
          assert r['flag']['unique_a_omega_p_under_ps_singlet_potential']
          assert r['flag']['replaced_stack_030_050_020_convention']
          assert not r['flag']['unique_from_full_210n_tensor_basis']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload unique (a,ω,p) verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unique-a-omega-p-ps-singlet-verdict
          path: |
            UNIQUE_A_OMEGA_P_PS_SINGLET_V20_VERDICT.json
            UNIQUE_A_OMEGA_P_PS_SINGLET_V20.md
