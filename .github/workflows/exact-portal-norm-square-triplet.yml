name: exact-portal-norm-square-triplet

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "exact_portal_norm_square_triplet_channel_v20.py"
      - "test_exact_portal_norm_square_triplet_channel_v20.py"
      - "direct_phi_h_sigmabar_tensor_v20.py"
      - "exact_126bar_triplet_clebsch_v20.py"
      - ".github/workflows/exact-portal-norm-square-triplet.yml"
  push:
    branches: [main]
    paths:
      - "exact_portal_norm_square_triplet_channel_v20.py"
      - "test_exact_portal_norm_square_triplet_channel_v20.py"
      - "direct_phi_h_sigmabar_tensor_v20.py"
      - "exact_126bar_triplet_clebsch_v20.py"
      - ".github/workflows/exact-portal-norm-square-triplet.yml"

concurrency:
  group: exact-portal-norm-square-triplet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-portal-norm-square-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile exact contraction modules
        run: |
          python -m py_compile \
            exact_portal_norm_square_triplet_channel_v20.py \
            test_exact_portal_norm_square_triplet_channel_v20.py
      - name: Run exact contraction tests
        run: python -m unittest -v test_exact_portal_norm_square_triplet_channel_v20.py
      - name: Generate exact contraction report
        run: python exact_portal_norm_square_triplet_channel_v20.py
      - name: Assert exact result and scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('EXACT_PORTAL_NORM_SQUARE_TRIPLET_CHANNEL_V20.json'))
          assert r['n_failed']==0, r['failures']
          assert r['overall_state']=='CLOSED_SUBPROBLEM'
          assert r['flag']['exact_portal_norm_square_channel_closed']
          assert r['flag']['exact_quartic_t2bar_t4bar_mixing_derived']
          assert r['exact_sigma_blocks']['positive_sector_rank']==1
          assert not r['flag']['all_PhiSigma_anisotropic_channels_complete']
          assert not r['flag']['physical_triplet_spectrum_complete']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_validated']
          assert not r['flag']['whole_model_excluded']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-portal-norm-square-triplet
          path: |
            EXACT_PORTAL_NORM_SQUARE_TRIPLET_CHANNEL_V20.json
            EXACT_PORTAL_NORM_SQUARE_TRIPLET_CHANNEL_V20.md
