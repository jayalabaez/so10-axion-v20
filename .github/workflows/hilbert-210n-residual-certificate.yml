name: hilbert-210n-residual-certificate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hilbert-210n-residual-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute Hilbert 210^n residual certificate
        run: python hilbert_210n_residual_certificate_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_hilbert_210n_residual_certificate_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('HILBERT_210N_RESIDUAL_CERTIFICATE_V20_VERDICT.json'))
          assert r['status']=='HILBERT_SERIES_210N_RESIDUAL_KERNEL_CERTIFIED__FLUCTUATION_CG_OPEN'
          assert r['n_failed']==0
          assert r['hilbert_series']['coefficients']['4']==4
          assert r['residual_off_singlet']['residual_kernel_total_deg_le_4']==0
          assert r['residual_off_singlet']['closed']
          assert r['flag']['hilbert_series_certificate']
          assert not r['flag']['off_singlet_fluctuation_cg_complete']
          assert not r['flag']['mixed_rep_full_hilbert_series']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload Hilbert certificate verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hilbert-210n-residual-certificate-verdict
          path: |
            HILBERT_210N_RESIDUAL_CERTIFICATE_V20_VERDICT.json
            HILBERT_210N_RESIDUAL_CERTIFICATE_V20.md
