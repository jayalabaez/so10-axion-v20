name: sarah-pyrate-so10-210-betas

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "sarah_pyrate_so10_210_betas_v20.py"
      - "test_sarah_pyrate_so10_210_betas_v20.py"
      - "SARAH_PYRATE_SO10_210_BETAS_V20_VERDICT.json"
      - "SARAH_PYRATE_SO10_210_BETAS_V20.md"
      - ".github/workflows/sarah-pyrate-so10-210-betas.yml"
  push:
    branches: [main]
    paths:
      - "sarah_pyrate_so10_210_betas_v20.py"
      - "test_sarah_pyrate_so10_210_betas_v20.py"
      - "SARAH_PYRATE_SO10_210_BETAS_V20_VERDICT.json"
      - "SARAH_PYRATE_SO10_210_BETAS_V20.md"
      - ".github/workflows/sarah-pyrate-so10-210-betas.yml"

concurrency:
  group: sarah-pyrate-so10-210-betas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sarah-pyrate-so10-210-betas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile diagnostic source and tests
        run: python -m py_compile sarah_pyrate_so10_210_betas_v20.py test_sarah_pyrate_so10_210_betas_v20.py
      - name: Execute SARAH/PyR@TE-formula beta ingest
        run: python sarah_pyrate_so10_210_betas_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_sarah_pyrate_so10_210_betas_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('SARAH_PYRATE_SO10_210_BETAS_V20_VERDICT.json'))
          assert r['status']=='CORRECTED_SO10_NONYUKAWA_GAUGE_POLYNOMIAL__FULL_G7_OPEN'
          assert r['n_checks']==11
          assert r['n_failed']==0
          assert r['failures']==[]
          assert r['content']['casimirs']['16']==45.0/8.0
          assert not r['flag']['sarah_validated_210_betas']
          assert r['flag']['pyrate_sarah_mv_formulas_ingested']
          assert r['flag']['two_loop_so10_nonyukawa_gauge_polynomial_complete']
          assert r['flag']['ad_hoc_1p1_fudge_replaced']
          assert r['flag']['two_loop_landau_or_breakdown_above_MGUT']
          assert not r['flag']['live_sarah_or_pyrate_executable_run']
          assert not r['flag']['two_loop_so10_gauge_complete_for_content']
          assert not r['flag']['two_loop_quartic_betas_complete']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          assert 'remain OPEN' in r['verdict']
          PY
      - name: Upload beta-ingest verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarah-pyrate-so10-210-betas-verdict
          path: |
            SARAH_PYRATE_SO10_210_BETAS_V20_VERDICT.json
            SARAH_PYRATE_SO10_210_BETAS_V20.md
