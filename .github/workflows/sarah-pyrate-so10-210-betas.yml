name: sarah-pyrate-so10-210-betas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sarah-pyrate-so10-210-betas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute SARAH/PyR@TE-formula beta ingest
        run: python sarah_pyrate_so10_210_betas_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_sarah_pyrate_so10_210_betas_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('SARAH_PYRATE_SO10_210_BETAS_V20_VERDICT.json'))
          assert r['status']=='SARAH_PYRATE_FORMULA_SO10_210_BETAS_INGESTED__QUARTIC_AND_UV_CP_OPEN'
          assert r['n_failed']==0
          assert r['content']['casimirs']['16']==45.0
          assert r['flag']['sarah_validated_210_betas']
          assert r['flag']['pyrate_sarah_mv_formulas_ingested']
          assert r['flag']['ad_hoc_1p1_fudge_replaced']
          assert r['flag']['two_loop_landau_or_breakdown_above_MGUT']
          assert not r['flag']['live_sarah_or_pyrate_executable_run']
          assert not r['flag']['two_loop_quartic_betas_complete']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload beta-ingest verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarah-pyrate-so10-210-betas-verdict
          path: |
            SARAH_PYRATE_SO10_210_BETAS_V20_VERDICT.json
            SARAH_PYRATE_SO10_210_BETAS_V20.md
