name: scalar-alpha-flavour-nonuniqueness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scalar-alpha-flavour-nonuniqueness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute scalar-α flavour non-uniqueness certificate
        run: python scalar_alpha_flavour_nonuniqueness_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_scalar_alpha_flavour_nonuniqueness_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('SCALAR_ALPHA_FLAVOUR_NONUNIQUENESS_V20_VERDICT.json'))
          assert r['status']=='SCALAR_ALPHA_PROVEN_NONUNIQUE_FROM_FLAVOUR__TAU_P_OPEN'
          assert r['n_failed']==0
          assert r['flag']['scalar_alpha_proven_nonunique_from_flavour']
          assert not r['flag']['alpha_identified_with_yukawa_fit']
          assert r['closed_mt_alpha_grid']['template_alpha4_scaling_verified']
          assert r['closed_mt_alpha_grid']['distinct_lifetimes_on_grid']
          assert not r['flag']['live_sarah_or_pyrate_executable_run']
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload scalar-α non-uniqueness verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalar-alpha-flavour-nonuniqueness-verdict
          path: |
            SCALAR_ALPHA_FLAVOUR_NONUNIQUENESS_V20_VERDICT.json
            SCALAR_ALPHA_FLAVOUR_NONUNIQUENESS_V20.md
