name: current-main-proton-decay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**proton**"
      - "**tau_p**"
      - "**xy**"
      - "**threshold**"
      - ".github/workflows/current-main-proton-decay.yml"
  push:
    branches: [main]
    paths:
      - "**proton**"
      - "**tau_p**"
      - "**xy**"
      - "**threshold**"
      - ".github/workflows/current-main-proton-decay.yml"

concurrency:
  group: current-main-proton-decay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proton-decay-falsification-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run physics-invariant tests
        run: python -m unittest -v test_current_main_proton_decay_evaluation_v20.py
      - name: Evaluate current repository fail-closed
        run: python current_main_proton_decay_evaluation_v20.py
      - name: Assert no unsupported discovery or model verdict
        run: |
          python - <<'PY'
          import json
          r=json.load(open('PROTON_DECAY_FALSIFICATION_GATE_V20_VERDICT.json'))
          c=r['classification']
          assert r['n_failed'] == 0, r['failures']
          assert c['proton_decay_observed'] is False
          assert c['exact_unique_proton_lifetime_derived'] is False
          assert c['whole_model_excluded_by_proton_decay'] is False
          assert r['experimental_reference']['limit_90CL_years'] == 2.4e34
          for row in r['benchmarks'].values():
              point=row['canonical_literature_normalization']
              assert point['derivation_complete'] is False
              assert point['whole_model_excluded'] is False
          PY
      - name: Upload proton-decay audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proton-decay-falsification-gate
          path: |
            PROTON_DECAY_FALSIFICATION_GATE_V20_VERDICT.json
            PROTON_DECAY_FALSIFICATION_GATE_V20.md
            CURRENT_MAIN_PROTON_DECAY_EVALUATION_V20_VERDICT.json
            CURRENT_MAIN_PROTON_DECAY_EVALUATION_V20.md
