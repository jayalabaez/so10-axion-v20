name: current-main-proton-decay

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  evaluate-current-main-proton-decay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Evaluate proton decay on current tree
        run: python current_main_proton_decay_evaluation_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_current_main_proton_decay_evaluation_v20.py
      - name: Assert honest classification
        run: |
          python - <<'PY'
          import json
          r=json.load(open('CURRENT_MAIN_PROTON_DECAY_EVALUATION_V20_VERDICT.json'))
          assert r['n_failed']==0
          assert not r['classification']['central_gauge_benchmark_fails']
          assert r['classification']['some_threshold_or_scalar_parameter_points_fail']
          assert not r['classification']['whole_model_excluded_by_proton_decay']
          assert not r['classification']['exact_unique_proton_lifetime_derived']
          assert r['gauge_XY']['central']['lifetime_years'] > r['experimental_reference']['Super_K_90CL_lower_limit_years']
          assert r['gauge_XY']['broad_envelope_contains_excluded_points']
          PY
      - name: Upload current proton-decay verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-main-proton-decay-verdict
          path: |
            CURRENT_MAIN_PROTON_DECAY_EVALUATION_V20_VERDICT.json
            CURRENT_MAIN_PROTON_DECAY_EVALUATION_V20.md
