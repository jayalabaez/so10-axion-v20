name: open-210-channel-210-off-singlet-sm-qn

on:
  pull_request:
    paths:
      - open_210_channel_210_off_singlet_sm_quantum_numbers_v20.py
      - test_open_210_channel_210_off_singlet_sm_quantum_numbers_v20.py
      - open_210_channel_210_off_singlet_census_v20.py
      - open_210_channel_45_off_singlet_sm_quantum_numbers_v20.py
      - so10_210_to_210_self_map_v20.py
      - .github/workflows/open-210-channel-210-off-singlet-sm-qn.yml
  workflow_dispatch:

concurrency:
  group: open-210-channel-210-off-singlet-sm-qn-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  open-210-channel-210-off-singlet-sm-qn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute SM Cartan quantum numbers
        run: python open_210_channel_210_off_singlet_sm_quantum_numbers_v20.py --write
      - name: Focused regression tests
        run: python -m unittest -v test_open_210_channel_210_off_singlet_sm_quantum_numbers_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('OPEN_210_CHANNEL_210_OFF_SINGLET_SM_QN_V20.json'))
          assert r['status']=='OPEN_210_CHANNEL_210_OFF_SINGLET_SM_QN_READY__CG_OPEN'
          assert r['n_failed']==0
          assert r['overall_state']=='BLOCKED'
          assert r['inventory_slot']['status']=='PARTIAL_SM_QUANTUM_NUMBERS_READY'
          assert r['quantum_numbers']['n_modes_labeled']==207
          assert r['flags']['off_singlet_210_sm_qn_ready']
          assert not r['flags']['off_singlet_210_mode_cg']
          assert not r['flags']['whole_model_validated']
          PY
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-210-channel-210-off-singlet-sm-qn
          path: |
            OPEN_210_CHANNEL_210_OFF_SINGLET_SM_QN_V20.json
            OPEN_210_CHANNEL_210_OFF_SINGLET_SM_QN_V20.md
