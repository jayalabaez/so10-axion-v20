name: selected-vacuum-dimension8-first-wave-recovery

on:
  pull_request:
    paths:
      - .github/workflows/selected-vacuum-dimension8-first-wave-recovery.yml
  workflow_dispatch:

concurrency:
  group: selected-vacuum-dimension8-first-wave-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recover-first-wave:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        wave: [8k, 8l]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      WAVE: ${{ matrix.wave }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile authoritative first-wave evaluator
        run: python -m compileall -q selected_vacuum_dimension8_first_wave_v20.py
      - name: Execute recovered coefficient job
        run: |
          python selected_vacuum_dimension8_first_wave_v20.py \
            --wave "$WAVE" --write
      - name: Assert honest recovered result
        run: |
          python - <<'PY'
          import json
          import os
          import selected_vacuum_dimension8_first_wave_v20 as mod
          wave=os.environ['WAVE']
          tag=wave.upper()
          report=json.load(open(f'SELECTED_VACUUM_DIMENSION8_FIRST_WAVE_{tag}_V20.json'))
          spec=mod.WAVE_SPECS[wave]
          result=report['result']
          assert report['n_failed']==0, report
          assert tuple(result['signature_P_D_Db_H_Hb'])==spec['signature'], report
          assert result['n_graph_coefficient_evaluations']==spec['cost'], report
          assert report['status'] in {
              f'DIMENSION8_FIRST_WAVE_{tag}_ZERO',
              f'DIMENSION8_FIRST_WAVE_{tag}_NONZERO_CHANNEL_FOUND__STATIONARITY_OPEN',
          }, report
          assert not report['flags']['stationarity_rebuilt'], report
          assert not report['flags']['whole_model_validated'], report
          assert not report['flags']['whole_model_excluded'], report
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-vacuum-dimension8-first-wave-recovery-${{ matrix.wave }}
          path: |
            SELECTED_VACUUM_DIMENSION8_FIRST_WAVE_*_V20.json
            SELECTED_VACUUM_DIMENSION8_FIRST_WAVE_*_V20.md
