name: live-g2-exact-singlet-derivatives

on:
  workflow_dispatch:
  pull_request:
    paths:
      - live_g2_exact_singlet_derivatives_v20.py
      - test_live_g2_exact_singlet_derivatives_v20.py
      - live_g2_canonical_486_field_chart_v20.py
      - live_g2_arbitrary_component_potential_values_v20.py
      - .github/workflows/live-g2-exact-singlet-derivatives.yml
  push:
    branches: [main]
    paths:
      - live_g2_exact_singlet_derivatives_v20.py
      - test_live_g2_exact_singlet_derivatives_v20.py
      - live_g2_canonical_486_field_chart_v20.py
      - live_g2_arbitrary_component_potential_values_v20.py
      - .github/workflows/live-g2-exact-singlet-derivatives.yml

concurrency:
  group: live-g2-singlet-derivatives-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-four-singlet-block:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile derivative stack
        run: |
          python -m py_compile \
            live_g2_arbitrary_component_potential_values_v20.py \
            live_g2_canonical_486_field_chart_v20.py \
            live_g2_exact_singlet_derivatives_v20.py \
            test_live_g2_exact_singlet_derivatives_v20.py
      - name: Execute exact derivative certificate
        run: python live_g2_exact_singlet_derivatives_v20.py --write
      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            test_live_g2_arbitrary_component_potential_values_v20.py \
            test_live_g2_canonical_486_field_chart_v20.py \
            test_live_g2_exact_singlet_derivatives_v20.py
      - name: Assert exact scope and fail-closed boundary
        run: |
          python - <<'PY'
          import json

          report = json.load(open('LIVE_G2_EXACT_SINGLET_DERIVATIVES_V20.json'))
          assert report['n_failed'] == 0, report['failures']
          assert report['scope']['global_indices'] == [482,483,484,485]
          assert report['scope']['coordinate_names'] == ['S.x','S.y','Phi17.x','Phi17.y']
          assert report['scope']['complete_gradient_entries'] == 4
          assert report['scope']['complete_symmetric_Hessian_entries'] == 10
          assert report['scope']['full_gradient_entries_required'] == 486
          assert report['scope']['full_symmetric_Hessian_entries_required'] == 118341
          assert report['counts']['operator_directions'] == 64
          assert report['counts']['real_parameters'] == 91
          assert report['maximum_operator_value_reconstruction_residual'] < 1e-10
          assert report['monomial_finite_difference_audit']['maximum_gradient_residual'] < 2e-7
          assert report['monomial_finite_difference_audit']['maximum_Hessian_residual'] < 3e-6
          assert report['combined_finite_difference_audit']['gradient_residual'] < 2e-5
          assert report['combined_finite_difference_audit']['Hessian_residual'] < 2e-3
          assert report['flags']['all_64_operator_singlet_jets_complete']
          assert report['flags']['all_91_parameter_singlet_derivatives_complete']
          assert report['flags']['singlet_gradient_4_complete']
          assert report['flags']['singlet_Hessian_4x4_complete']
          assert not report['flags']['complete_486_gradient']
          assert not report['flags']['complete_486_Hessian']
          assert not report['flags']['G2_closed']
          assert not report['flags']['whole_model_validated']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-g2-exact-singlet-derivatives
          path: |
            LIVE_G2_EXACT_SINGLET_DERIVATIVES_V20.json
            LIVE_G2_EXACT_SINGLET_DERIVATIVES_V20.md
