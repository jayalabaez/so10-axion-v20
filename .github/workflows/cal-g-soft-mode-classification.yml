name: cal-g-soft-mode-classification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cal-g-soft-mode-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute cal G soft-mode classification
        run: python cal_g_soft_mode_classification_v20.py
      - name: Focused regression tests
        run: python -m unittest -v test_cal_g_soft_mode_classification_v20.py
      - name: Assert honest scientific scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('CAL_G_SOFT_MODE_CLASSIFICATION_V20_VERDICT.json'))
          assert r['status']=='CAL_G_SOFT_MODE_CLASSIFIED__TAU_P_OPEN'
          assert r['n_failed']==0
          assert r['flag']['cal_G_soft_mode_classified']
          assert r['flag']['cal_G_gamma_independent']
          assert r['flag']['goldstone_compatible_slice_null5']
          assert r['primary_classification']['label']=='residual_flat_or_light_singlet'
          assert not r['flag']['exact_unique_proton_lifetime']
          assert not r['flag']['whole_model_excluded']
          PY
      - name: Upload cal G classification verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal-g-soft-mode-classification-verdict
          path: |
            CAL_G_SOFT_MODE_CLASSIFICATION_V20_VERDICT.json
            CAL_G_SOFT_MODE_CLASSIFICATION_V20.md
